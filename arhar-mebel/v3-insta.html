<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архар Мебель — Вариант 3 · В стиле Instagram</title>
<meta name="description" content="Архар Мебель — мебель на заказ в Бишкеке. Кухни, шкафы-купе, гардеробные. Пишите в WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Палитра по профилю @arhar_mebel: чёрно-белый логотип, графит, тёплый беж,
   натуральный орех, дымчато-синий и латунь — цвета из их постов. */
:root{
  --bg:#F6F4F1; --sand:#ECE8E2; --latte:#CDC2B4; --choco:#1B1B1B; --caramel:#7B5134; --caramel2:#5E3C25;
  --mut:#6E6963; --line:#E3DED7; --white:#fff; --blue:#3E5671; --brass:#B8935A; --ig:#4A5DF0;
  --ring:linear-gradient(45deg,#F9CE34,#EE2A7B 55%,#6228D7);
  --wood:linear-gradient(140deg,#d9cfc3,#a99886);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font:400 15.5px/1.6 Montserrat,system-ui,sans-serif;color:var(--choco);background:var(--bg);overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.img-x{opacity:0}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.14}
.w{max-width:1160px;margin:0 auto;padding:0 24px}
:focus-visible{outline:3px solid var(--caramel);outline-offset:3px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:700 14.5px/1 Montserrat;padding:14px 20px;border-radius:12px;transition:background .2s,transform .15s}
.btn:active{transform:scale(.98)}
.btn-c{background:var(--caramel);color:#fff}.btn-c:hover{background:var(--caramel2)}
.btn-s{background:var(--sand);color:var(--choco)}.btn-s:hover{background:var(--latte)}
.btn-wa{background:#25D366;color:#063018}
.btn-ig{background:var(--ig);color:#fff}.btn-ig:hover{background:#3a4bd6}.btn-wa:hover{background:#1fc05c}
.btn-gis .ic{color:#2FA84F}

/* шапка */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo .dot{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font:400 11px Comfortaa,sans-serif}
.logo b{font:600 15px Montserrat;letter-spacing:-.01em}
.nav{display:flex;gap:4px;margin-left:16px}
.nav a{white-space:nowrap;padding:8px 11px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.nav a:hover{background:var(--sand);color:var(--choco)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.hphone{white-space:nowrap;font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:7px;padding:0 6px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--sand);border:0;cursor:pointer;color:var(--choco)}
.ib.wa{background:#25D366;color:#fff}.ib.gis{color:#2FA84F}
.langs{display:flex;background:var(--sand);border-radius:12px;padding:3px}
.langs button{border:0;background:none;font:700 12.5px Montserrat;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--mut)}
.langs button[aria-pressed=true]{background:#fff;color:var(--choco);box-shadow:0 1px 4px rgba(27,27,27,.15)}
.burger{display:none}

section{padding:64px 0}
.fit{min-height:calc(100vh - 64px);display:flex;align-items:center}
.fit>.w{width:100%}
.sh{text-align:center;max-width:640px;margin:0 auto 34px}
.sh h2{font-size:clamp(28px,3.4vw,42px);margin-bottom:10px}
.sh p{color:var(--mut)}

/* профиль = hero */
.hero{padding:34px 0}
.prof{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.ptop{display:flex;align-items:center;gap:30px;margin-bottom:22px}
.ava{width:150px;height:150px;border-radius:50%;padding:4px;background:var(--ring);flex:none}
.ava div{width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);background:#000;display:grid;place-items:center;color:#fff;font:300 34px Comfortaa,sans-serif;letter-spacing:-.02em}
.pname{font-weight:600;font-size:15px;margin-bottom:10px}
.slogan{font-weight:600;font-size:14.5px;margin-bottom:12px;color:var(--choco)}
.handle{display:flex;align-items:center;gap:8px;font:700 22px Montserrat;margin-bottom:12px}
.handle svg{width:20px;height:20px}
.counts{display:flex;gap:26px}
.counts b{display:block;font-size:22px;font-weight:700}
.counts span{font-size:13px;color:var(--mut)}
.hero h1{font-size:clamp(32px,3.9vw,52px);margin-bottom:14px}
.bio{color:var(--mut);font-size:16.5px;max-width:52ch;margin-bottom:12px}
.bio-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:600;font-size:14.5px;margin-bottom:22px}
.bio-meta a,.bio-meta span{display:inline-flex;align-items:center;gap:6px}
.bio-meta .ic{width:17px;height:17px;color:var(--caramel)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}.pbtns .btn{white-space:nowrap}
.offer{margin-top:18px;display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px dashed var(--caramel);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.offer b{background:var(--caramel);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px}
/* телефон с «рилсом» */
.phone{justify-self:center;width:300px;aspect-ratio:9/18.5;border-radius:42px;background:#1d140e;padding:10px;box-shadow:0 40px 70px -30px rgba(27,27,27,.55);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:33px;overflow:hidden;background:var(--wood)}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.screen::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 45%,transparent 80%,rgba(0,0,0,.3))}
.reel-top{position:absolute;top:16px;left:16px;right:16px;z-index:2;color:#fff;font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.reel-side{position:absolute;right:12px;bottom:90px;z-index:2;display:flex;flex-direction:column;gap:16px;color:#fff;text-align:center;font-size:11.5px;font-weight:600}
.reel-side svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.reel-cap{position:absolute;left:14px;right:56px;bottom:18px;z-index:2;color:#fff;font-size:13px}
.reel-cap .u{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.reel-cap .u i{width:26px;height:26px;border-radius:50%;background:var(--choco);border:2px solid #fff;display:block}
.reel-cap .u em{font-style:normal;border:1px solid #fff;border-radius:6px;padding:1px 7px;font-size:11px}
.phone .bub{position:absolute;left:-90px;top:90px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 20px 40px -16px rgba(27,27,27,.4);font-size:13px;width:190px;z-index:3}
.phone .bub b{display:block;font-size:13.5px}
.phone .bub span{color:#E0A31C;letter-spacing:1px}

/* хайлайты-категории */
.hl{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 10px;justify-content:center}
.hl::-webkit-scrollbar{display:none}
.hl button{background:none;border:0;cursor:pointer;font:600 13px Montserrat;color:var(--choco);display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;width:92px}
.hl .c{width:84px;height:84px;border-radius:50%;padding:3px;background:var(--line)}
.hl button[aria-pressed=true] .c{background:var(--ring)}
.hl .c div{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden;background:var(--wood)}
.hl .c img{width:100%;height:100%;object-fit:cover}
.catcard{max-width:820px;margin:18px auto 0;display:grid;grid-template-columns:200px 1fr auto;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px}
.catcard .im{height:130px;border-radius:14px;overflow:hidden;background:var(--wood)}
.catcard .im img{width:100%;height:100%;object-fit:cover}
.catcard h3{font-size:24px;margin-bottom:4px}
.catcard p{color:var(--mut);font-size:14.5px}

/* сетка постов */
.tabs{display:flex;justify-content:center;gap:40px;border-top:1px solid var(--line);margin-bottom:4px}
.tabs span{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:14px 0;border-top:2px solid var(--choco);margin-top:-1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:740px;margin:0 auto}
.post{position:relative;aspect-ratio:1/1;max-height:290px;width:100%;background:var(--wood);overflow:hidden}
.post img{width:100%;height:100%;object-fit:cover}
.post .ov{position:absolute;inset:0;background:rgba(27,27,27,.55);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .2s;font-weight:700;text-align:center;padding:12px}
.post:hover .ov,.post:focus-within .ov{opacity:1}
.post .ov small{font-weight:600;font-size:13px}
.more{text-align:center;margin-top:22px}

/* почему — как сторис */
.stories{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sty{position:relative;aspect-ratio:9/14;border-radius:22px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.sty:nth-child(1){background:linear-gradient(170deg,#8E5F3E,#5A3A24)}
.sty:nth-child(2){background:linear-gradient(170deg,#2B2B2B,#0E0E0E)}
.sty:nth-child(3){background:linear-gradient(170deg,#9C8F80,#6F6357)}
.sty:nth-child(4){background:linear-gradient(170deg,#4F6884,#2F4258)}
.sty .bars{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:4px}
.sty .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.sty .bars i.on{background:#fff}
.sty .big{position:absolute;top:38px;left:20px;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.sty .big .ic{width:34px;height:34px}
.sty h3{font-size:22px;margin-bottom:8px}
.sty p{font-size:14px;opacity:.9}

/* процесс — карусель */
.carousel{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.slide{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;position:relative}
.slide .n{width:42px;height:42px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:800;color:var(--caramel)}
.slide:nth-child(2){background:var(--choco);color:#fff;border-color:var(--choco)}
.slide:nth-child(2) .n{background:var(--brass);color:#111}
.slide:nth-child(2) p{color:#bdb6ad}
.slide h3{font-size:18px}
.slide p{font-size:14px;color:var(--mut)}
.slide:not(:last-child)::after{content:"";position:absolute;right:-9px;top:38px;width:6px;height:6px;border-top:2px solid var(--latte);border-right:2px solid var(--latte);transform:rotate(45deg)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--latte)}
.dots i:first-child{background:#3897F0}

/* команда — круги */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tm{text-align:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px 16px 22px}
.tm .c{width:150px;height:150px;margin:0 auto 16px;border-radius:50%;padding:4px;background:var(--ring)}
.tm .c div{position:relative;width:100%;height:100%;border-radius:50%;border:4px solid #fff;overflow:hidden;background:var(--latte);display:grid;place-items:center;font:800 48px Montserrat;color:#fff}
.tm .c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tm h3{font-size:17px}
.tm p{color:var(--mut);font-size:13.5px;margin:4px 0 12px;min-height:42px}
.tm .xp{display:inline-block;background:var(--sand);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--caramel2)}

/* отзывы — комментарии */
.revwrap{display:grid;grid-template-columns:.75fr 2fr;gap:24px;align-items:start}
.rate{background:var(--choco);color:#fff;border-radius:24px;padding:26px;position:sticky;top:84px}
.rate b{font-size:58px;font-weight:700;line-height:1}
.rate .s{color:#F3B53F;letter-spacing:2px;font-size:19px;margin:6px 0 4px}
.rate p{color:#bdb6ad;font-size:14px;margin-bottom:18px}
.rate .btn{width:100%;margin-top:8px}
.comments{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cm{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.cm .av{width:42px;height:42px;border-radius:50%;padding:2px;background:var(--ring);flex:none}
.cm .av div{width:100%;height:100%;border-radius:50%;border:2px solid #fff;background:var(--caramel);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.cm p{font-size:14.5px}
.cm p b{margin-right:6px}
.cm .meta{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:6px;font-weight:600}
.cm .meta .s{color:#E0A31C}

/* заявка — директ */
.dm-wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.dm-wrap h2{font-size:clamp(28px,3.4vw,42px);margin-bottom:12px}
.dm-wrap>div>p{color:var(--mut);margin-bottom:18px}
.bigph{display:inline-flex;align-items:center;gap:10px;font-size:28px;font-weight:700;margin-bottom:16px;white-space:nowrap}
.bigph .ic{width:28px;height:28px;color:var(--caramel)}
.dm{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -36px rgba(27,27,27,.5)}
.dm-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.dm-h i{width:34px;height:34px;border-radius:50%;background:var(--choco);display:block}
.dm-h small{display:block;color:#2FA84F;font-weight:600;font-size:12px}
.dm form{padding:18px;display:flex;flex-direction:column;gap:12px}
.msgb{align-self:flex-start;background:var(--sand);border-radius:18px 18px 18px 4px;padding:11px 15px;font-size:14.5px;max-width:85%}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.chip{border:1.5px solid #3897F0;background:#fff;color:#1b6fc2;border-radius:99px;padding:8px 13px;font:600 13.5px Montserrat;cursor:pointer}
.chip[aria-pressed=true]{background:#3897F0;color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{width:100%;border:1.5px solid var(--line);border-radius:99px;padding:13px 18px;font:500 15.5px Montserrat;background:var(--bg);color:var(--choco)}
input:focus{outline:none;border-color:var(--caramel)}
.msg{font-size:13px;color:var(--mut);text-align:center;min-height:20px}
.msg[data-state=err]{color:#c0392b}.msg[data-state=ok]{color:#1a7f43}

/* контакты */
.ct{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:6px}
.cc .ic{width:30px;height:30px;color:var(--caramel);margin-bottom:6px}
.cc small{color:var(--mut);font-size:13px;font-weight:600}
.cc b{font-size:19px}
.cc .btn{margin-top:auto}
.cc.dark{background:var(--choco);color:#fff;border-color:var(--choco)}.cc.dark small{color:#bdb6ad}.cc.dark .ic{color:var(--latte)}
.cc.dark b{font-size:24px;white-space:nowrap}
footer{padding:26px 0 100px;text-align:center;color:var(--mut);font-size:13.5px}

.fab{position:fixed;right:22px;bottom:22px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.8)}
.fab .ic{width:30px;height:30px}
.mbar{display:none}

@media (max-height:800px) and (min-width:1001px){section{padding:48px 0}.phone{width:270px}.ava{width:124px;height:124px}.post{max-height:230px}.sty{aspect-ratio:9/12}.tm .c{width:124px;height:124px}}
@media (max-width:1240px){.nav{display:none}.burger{display:grid}
  body.menu-open .nav{display:flex;flex-direction:column;position:fixed;top:64px;left:0;right:0;background:#fff;padding:14px 18px 22px;margin:0;border-bottom:1px solid var(--line)}
  body.menu-open .nav a{font-size:17px;padding:12px}}
@media (max-width:1000px){
  .fit{min-height:0}
  .prof,.dm-wrap,.revwrap{grid-template-columns:1fr}
  .phone{display:none}
  .stories{grid-template-columns:1fr 1fr}
  .carousel{grid-template-columns:1fr 1fr}.slide::after{display:none}
  .team{grid-template-columns:1fr 1fr}
  .rate{position:static}
  .ct{grid-template-columns:1fr 1fr}.cc.dark{grid-column:span 2}
  .hphone{display:none}
}
@media (max-width:700px){
  .w{padding:0 16px}
  section{padding:46px 0}
  .hd{gap:8px;height:58px}.logo b{display:none}
  html{scroll-padding-top:62px}
  body.menu-open .nav{top:58px}
  .hd-r .ib.gis{display:none}
  .hero{padding:20px 0 10px}
  .ptop{gap:18px;margin-bottom:16px}
  .ava{width:88px;height:88px}.ava div{border-width:3px;font-size:21px}
  .handle{font-size:17px;margin-bottom:6px}
  .counts{gap:14px}.counts b{font-size:17px}.counts span{font-size:11.5px;line-height:1.3;display:block}
  .hero h1{font-size:28px}
  .bio{font-size:15px}
  .pbtns{display:grid;grid-template-columns:1fr 1fr}.pbtns .btn:first-child{grid-column:span 2}
  .hl{justify-content:flex-start;gap:12px;margin:0 -16px;padding:6px 16px 10px}
  .hl button{width:76px;font-size:11.5px}.hl .c{width:70px;height:70px}
  .catcard{grid-template-columns:1fr;gap:12px}.catcard .im{height:170px}
  .tabs{gap:24px}
  .grid{gap:2px;margin:0 -16px}
  .post .ov{display:none}
  .stories{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;gap:10px}
  .sty{flex:0 0 62%;scroll-snap-align:start}
  .carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px}
  .slide{flex:0 0 72%;scroll-snap-align:start}
  .team{gap:10px}.tm{padding:18px 10px}.tm .c{width:104px;height:104px}.tm h3{font-size:14.5px}.tm p{font-size:12.5px}
  .comments{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .bigph{font-size:24px}
  .ct{grid-template-columns:1fr}.cc.dark{grid-column:auto}
  .fab{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12px;padding:7px 4px;border-radius:12px}
  .mbar .c{background:var(--caramel);color:#fff}.mbar .w2{background:#25D366;color:#063018}.mbar .g2{background:var(--sand)}.mbar .g2 .ic{color:#2FA84F}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <div class="w hd">
  <a class="logo" href="#top" aria-label="ARHAR — мебельная компания"><span class="dot">arhar</span><b>arhar_mebel</b></a>
  <nav class="nav">
   <a href="#catalog" data-t="nav.catalog"></a><a href="#works" data-t="nav.works"></a><a href="#process" data-t="nav.process"></a>
   <a href="#team" data-t="nav.team"></a><a href="#reviews" data-t="nav.reviews"></a><a href="#contacts" data-t="nav.contacts"></a>
  </nav>
  <div class="hd-r">

<script>
const $ = id => document.getElementById(id);
$('reelImg').src = U(IMG.hero, 700);
let cat = 0;
function showCat(i) {
  cat = i; const c = DATA.catalog[i], L = AM.lang;
  document.querySelectorAll('#hl button').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  $('catcard').innerHTML = `<div class="im"><img src="${U(c.img, 600)}" alt="${esc(c[L][0])}"></div><div><h3>${c[L][0]}</h3><p>${c[L][1]}</p></div>
    <a class="btn btn-wa" href="${AM.wa(AM.t('wa.msg') + ' — ' + c[L][0])}" target="_blank" rel="noopener">${ico('wa')}${AM.t('cta.calc')}</a>`;
}
AM.onLang(() => {
  const L = AM.lang;
  $('counts').innerHTML = DATA.insta.map(([n, k]) => `<div><b>${n}</b><span>${AM.t(k)}</span></div>`).join('');
  $('reelCap').textContent = DATA.works[0][L] + ' · #мебельбишкек';
  $('hl').innerHTML = DATA.catalog.map((c, i) => `<button data-ci="${i}"><span class="c"><div><img src="${U(c.img, 200)}" alt=""></div></span>${c[L][0]}</button>`).join('');
  showCat(cat);
  const posts = [...DATA.works, ...DATA.catalog.slice(0, 3).map(c => ({ img: c.img, ru: c.ru[0], ky: c.ky[0] }))];
  const likes = [412, 268, 391, 305, 187, 244, 356, 199, 281];
  $('grid').innerHTML = posts.map((p, i) => `<a class="post" data-href-ig href="${CONFIG.instagram}" target="_blank" rel="noopener"><img src="${U(p.img, 500)}" alt="${esc(p[L])}" loading="lazy"><span class="ov">♥ ${likes[i]}<small>${p[L]}</small></span></a>`).join('');
  $('stories').innerHTML = DATA.why.map((w, i) => `<article class="sty"><div class="bars">${[0, 1, 2, 3].map(k => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><div class="big">${ico(w.i)}</div><h3>${w[L][0]}</h3><p>${w[L][1]}</p></article>`).join('');
  $('carousel').innerHTML = DATA.process.map((p, i) => `<div class="slide"><div class="n">${i + 1}</div><h3>${p[L][0]}</h3><p>${p[L][1]}</p></div>`).join('');
  $('teamG').innerHTML = DATA.team.map(m => `<article class="tm"><div class="c"><div>${m.name[0]}<img src="${U(m.img, 400)}" alt="${esc(m.name)}" loading="lazy"></div></div>
    <h3>${m.name}</h3><p>${m[L]}</p><span class="xp">${AM.t('exp')}: ${m.exp} ${L === 'ky' ? 'жыл' : 'лет'}</span></article>`).join('');
  $('comments').innerHTML = DATA.reviews.map(r => `<article class="cm"><div class="av"><div>${r.name[0]}</div></div><div><p><b>${r.name}</b>${r[L]}</p>
    <div class="meta"><span class="s">★★★★★</span><span>${AM.L(r.where)}</span></div></div></article>`).join('');
  $('chips').innerHTML = DATA.catalog.map(c => `<button type="button" class="chip" aria-pressed="false">${c[L][0]}</button>`).join('');
});
document.addEventListener('click', e => { const c = e.target.closest('[data-ci]'); if (c) showCat(+c.dataset.ci); });
</script>
