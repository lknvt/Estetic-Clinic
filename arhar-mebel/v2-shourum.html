<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архар Мебель — Вариант 2 · Вечерний шоурум</title>
<meta name="description" content="Премиальная мебель на заказ в Бишкеке: кухни, гардеробные, спальни. Шпон, эмаль, фурнитура Blum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#231B16; --bg2:#2D231D; --bg3:#382C24; --bone:#EEE7DB; --mut:#AD9F8E; --line:#4B3C31;
  --brass:#CBA65E; --brass2:#B38C42; --walnut:#7A4E33; --moss:#6E7B5A;
  --wood:linear-gradient(140deg,#5a4130,#3a2a20);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font:400 16px/1.65 Manrope,system-ui,sans-serif;color:var(--bone);background:var(--bg);overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.img-x{opacity:0}
h1,h2,h3,.serif{font-family:Cormorant,Georgia,serif;font-weight:600;letter-spacing:-.01em;line-height:1.02}
.w{max-width:1280px;margin:0 auto;padding:0 28px}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.ic{width:20px;height:20px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;font:600 15px/1 Manrope;padding:17px 26px;border-radius:2px;transition:background .25s,color .25s,border-color .25s}
.btn-b{background:var(--brass);color:#1d150f}.btn-b:hover{background:#dcb870}
.btn-g{border:1px solid rgba(238,231,219,.35);color:var(--bone);background:transparent}.btn-g:hover{border-color:var(--brass);color:var(--brass)}
.btn-wa{background:#25D366;color:#05301a}.btn-wa:hover{background:#3ee07a}

/* шапка */
header{position:fixed;inset:0 0 auto;z-index:50;transition:background .3s}
header.solid{background:rgba(35,27,22,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:flex;align-items:center;gap:11px;font:700 24px Cormorant;letter-spacing:.02em}
.logo svg{width:34px;height:34px;color:var(--brass)}
.nav{display:flex;gap:26px;font-size:14.5px;color:#d7cdbf}
.nav a:hover{color:var(--brass)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.hphone{font:600 16px Manrope;display:flex;align-items:center;gap:8px}
.hphone .ic{color:var(--brass)}
.ib{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(238,231,219,.3);border-radius:50%;color:var(--bone);background:transparent;cursor:pointer}
.ib:hover{border-color:var(--brass);color:var(--brass)}
.langs{display:flex;gap:2px;font:600 13px Manrope}
.langs button{background:none;border:0;color:var(--mut);cursor:pointer;padding:8px 7px;font:inherit}
.langs button[aria-pressed=true]{color:var(--brass);text-decoration:underline;text-underline-offset:5px}
.burger{display:none}

section{padding:88px 0}
.fit{min-height:100vh;display:flex;align-items:center}
.fit>.w{width:100%}
.sh{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:40px}
.sh h2{font-size:clamp(38px,4.6vw,64px)}
.sh p{color:var(--mut);max-width:46ch;justify-self:end}
.kick{color:var(--brass);font:600 14px Manrope;margin-bottom:12px;display:block}

/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;padding:120px 0 40px;overflow:hidden;background:var(--wood)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,27,22,.92) 0%,rgba(35,27,22,.62) 48%,rgba(35,27,22,.25) 100%),linear-gradient(0deg,rgba(35,27,22,.9),transparent 45%)}
.hero .w{position:relative;z-index:2;width:100%}
.hero-g{display:grid;grid-template-columns:1.5fr .9fr;gap:60px;align-items:end}
.hero h1{font-size:clamp(46px,6.4vw,100px);font-weight:600;margin-bottom:22px;max-width:13ch}
.hero .lead{font-size:18px;color:#d9cfc2;max-width:48ch;margin-bottom:30px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.ccard{background:rgba(45,35,29,.82);backdrop-filter:blur(14px);border:1px solid var(--line);padding:26px}
.ccard small{color:var(--mut);font-size:13px;display:block}
.ccard .ph{display:block;font:600 34px Cormorant;color:var(--bone);margin:2px 0 4px;white-space:nowrap}
.ccard .hrs{color:var(--mut);font-size:14px;margin-bottom:18px}
.ccard .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ccard .btn{padding:14px 12px;font-size:14px}
.gis{color:var(--bone);border:1px solid var(--line);background:var(--bg3)}.gis .ic{color:#4cc46a}.gis:hover{border-color:#4cc46a}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:46px;border-top:1px solid rgba(238,231,219,.2)}
.hstats div{padding:18px 0 0}
.hstats b{font:600 40px Cormorant;color:var(--brass);display:block;line-height:1}
.hstats span{font-size:13.5px;color:#cfc4b6}

/* каталог — список + большое фото */
.cat-g{display:grid;grid-template-columns:1fr 1.25fr;gap:56px;align-items:stretch}
.clist{list-style:none;border-top:1px solid var(--line)}
.clist button{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--mut);text-align:left;padding:17px 0;cursor:pointer;font:inherit}
.clist .n{font:600 15px Manrope;color:var(--mut)}
.clist b{font:600 30px Cormorant;color:#cbbfae;transition:color .2s}
.clist .ar{opacity:0;color:var(--brass);transition:opacity .2s}
.clist button[aria-selected=true] b,.clist button:hover b{color:var(--bone)}
.clist button[aria-selected=true] .ar{opacity:1}
.clist button[aria-selected=true] .n{color:var(--brass)}
.cview{position:relative;min-height:470px;background:var(--wood);overflow:hidden}
.cview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .5s ease}
@keyframes fade{from{opacity:.2;transform:scale(1.03)}to{opacity:1;transform:none}}
.cview .cap{position:absolute;left:0;right:0;bottom:0;padding:26px;background:linear-gradient(0deg,rgba(35,27,22,.95),transparent);display:flex;align-items:end;justify-content:space-between;gap:20px}
.cview .cap h3{font-size:38px}
.cview .cap p{color:#d4c9bb;max-width:40ch}

/* материалы */
.mats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.mat{background:none;border:1px solid var(--line);color:var(--bone);cursor:pointer;text-align:left;padding:0;font:inherit;transition:border-color .2s}
.mat .sw{aspect-ratio:3/4}
.mat div{padding:12px 14px}
.mat b{display:block;font:600 21px Cormorant}
.mat span{font-size:13px;color:var(--mut)}
.mat[aria-pressed=true]{border-color:var(--brass)}
.mat[aria-pressed=true] b{color:var(--brass)}
.sw.oak{background:repeating-linear-gradient(92deg,#c9a274 0 3px,#bb9363 3px 5px,#d2ad80 5px 11px,#b88f5f 11px 12px)}
.sw.wal{background:repeating-linear-gradient(88deg,#5b3a26 0 4px,#4d301f 4px 6px,#6a452e 6px 13px,#43291a 13px 14px)}
.sw.ash{background:repeating-linear-gradient(91deg,#d9cdb9 0 3px,#cbbca4 3px 4px,#e2d7c5 4px 10px)}
.sw.gr{background:linear-gradient(160deg,#4a4c4d,#2d2f30)}
.sw.sage{background:linear-gradient(160deg,#9aa48a,#7a8569)}
.sw.st{background:radial-gradient(circle at 30% 40%,#fff 0 6%,transparent 7%),radial-gradient(circle at 70% 70%,#d8d4cf 0 10%,transparent 11%),linear-gradient(130deg,#efece7 0 40%,#d9d4cd 41% 43%,#ece8e2 44%)}
.mat-note{margin-top:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--mut)}
.mat-note b{color:var(--bone);font-weight:600}

/* почему */
.why{background:var(--bg2)}
.why-g{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.wi{padding:30px 26px 10px 0;border-right:1px solid var(--line);margin-right:26px}
.wi:last-child{border-right:0;margin-right:0}
.wi .ic{width:36px;height:36px;color:var(--brass);margin-bottom:22px}
.wi h3{font-size:28px;margin-bottom:10px}
.wi p{color:var(--mut);font-size:15px}

/* работы */
.works{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:270px;gap:12px}
.wk{position:relative;overflow:hidden;background:var(--wood)}
.wk img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.wk:hover img{transform:scale(1.04)}
.wk figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;background:linear-gradient(0deg,rgba(35,27,22,.9),transparent);font:600 22px Cormorant}

/* процесс */
.proc{display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.st{border-top:1px solid var(--brass);padding-top:20px}
.st .n{font:600 64px Cormorant;color:var(--brass);line-height:.9;margin-bottom:14px}
.st h3{font-size:26px;margin-bottom:8px}
.st p{color:var(--mut);font-size:14.5px}

/* команда */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tm{position:relative;aspect-ratio:3/4;overflow:hidden;background:linear-gradient(170deg,#4a3a2f,#2d231d)}
.tm>span{position:absolute;inset:0;display:grid;place-items:center;font:600 120px Cormorant;color:rgba(203,166,94,.25)}
.tm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.35) contrast(1.05)}
.tm .tx{position:absolute;left:0;right:0;bottom:0;padding:60px 20px 20px;background:linear-gradient(0deg,rgba(35,27,22,.95) 30%,transparent)}
.tm h3{font-size:27px}
.tm p{color:#d4c9bb;font-size:14px}
.tm .xp{color:var(--brass);font-size:13px;font-weight:600;margin-top:6px;display:block}

/* отзывы */
.rv-wrap{display:grid;grid-template-columns:.8fr 2.2fr;gap:44px;align-items:start}
.rv-wrap>*,.cat-g>*,.hero-g>*,.lc>*{min-width:0}
.score{border:1px solid var(--line);padding:26px}
.score b{font:600 76px Cormorant;color:var(--brass);line-height:1}
.score .s{color:var(--brass);letter-spacing:3px;margin:6px 0 10px}
.score p{color:var(--mut);font-size:14px;margin-bottom:18px}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/3);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.rv{scroll-snap-align:start;background:var(--bg2);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:14px}
.rv q{font:500 21px/1.35 Cormorant;quotes:"«" "»";flex:1}
.rv .who{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.rv .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--walnut);font:700 15px Manrope}
.rv .who b{font-weight:600;font-size:15px;display:block}
.rv .who span{font-size:13px;color:var(--mut)}
.arrows{display:flex;gap:8px;margin-top:18px}

/* заявка + контакты */
.lc{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border:1px solid var(--line)}
.lc>div{padding:46px}
.lc .l{background:var(--bg2)}
.lc h2{font-size:clamp(36px,3.8vw,54px);margin-bottom:14px}
.lc .l>p{color:var(--mut);margin-bottom:24px}
form{display:flex;flex-direction:column;gap:14px}
form label{font-size:14px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--bone);padding:10px 15px;font:500 14px Manrope;cursor:pointer;border-radius:2px}
.chip[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#1d150f}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--bone);padding:15px 16px;font:400 16px Manrope;border-radius:2px}
input:focus{outline:none;border-color:var(--brass)}
.msg{font-size:13.5px;color:var(--mut);min-height:20px}
.msg[data-state=err]{color:#f08a7a}.msg[data-state=ok]{color:#6fd396}
.ct small{color:var(--mut);font-size:13px;display:block}
.ct .ph{font:600 44px Cormorant;display:block;margin-bottom:24px;white-space:nowrap}
.ct .item{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.ct .item .ic{color:var(--brass);width:24px;height:24px;margin-top:2px}
.ct .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.ct .btns .gis{grid-column:span 2}
footer{border-top:1px solid var(--line);padding:26px 0 100px;color:var(--mut);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

.fab{position:fixed;right:24px;bottom:24px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
.fab .ic{width:30px;height:30px}
.mbar{display:none}

@media (max-height:820px) and (min-width:1001px){section{padding:64px 0}.sh{margin-bottom:28px}.cview{min-height:400px}.clist button{padding:13px 0}.works{grid-auto-rows:230px}.hero h1{font-size:80px}}
@media (max-width:1150px){.nav{display:none}.burger{display:grid}
  body.menu-open .nav{display:flex;flex-direction:column;position:fixed;top:72px;left:0;right:0;background:var(--bg);padding:24px 28px 30px;gap:18px;font:600 30px Cormorant;border-bottom:1px solid var(--line)}
  body.menu-open header{background:var(--bg)}}
@media (max-width:1000px){
  .fit{min-height:0}
  .hero-g,.cat-g,.rv-wrap,.lc,.sh{grid-template-columns:1fr}
  .sh{gap:12px}.sh p{justify-self:start}
  .mats{grid-template-columns:repeat(3,1fr)}
  .why-g{grid-template-columns:1fr 1fr}.wi{border-right:0;margin-right:0;border-bottom:1px solid var(--line);padding-bottom:24px}
  .proc{grid-template-columns:1fr 1fr}
  .team{grid-template-columns:1fr 1fr}
  .track{grid-auto-columns:calc((100% - 16px)/2)}
  .hphone{display:none}
}
@media (max-width:700px){
  .w{padding:0 16px}
  section{padding:60px 0}
  .hd{height:62px;gap:10px}.logo{font-size:21px}.logo svg{width:28px;height:28px}
  .hd-r .ib.g{display:none}
  body.menu-open .nav{top:62px}
  .hero{padding:96px 0 26px;min-height:auto}
  .hero::after{background:linear-gradient(0deg,rgba(35,27,22,.97) 40%,rgba(35,27,22,.5))}
  .hero h1{font-size:46px}
  .hero .lead{font-size:16px}
  .hero .cta .btn{flex:1 1 100%}
  .hero-g{gap:26px}
  .ccard{padding:20px}.ccard .ph{font-size:30px}
  .hstats{grid-template-columns:1fr 1fr;gap:0 16px;margin-top:28px}.hstats b{font-size:32px}
  .clist b{font-size:25px}
  .cview{min-height:300px}.cview .cap{flex-direction:column;align-items:start;padding:18px}.cview .cap h3{font-size:30px}
  .mats{grid-template-columns:repeat(3,1fr);gap:8px}.mat div{padding:8px}.mat b{font-size:17px}.mat span{display:none}
  .why-g{grid-template-columns:1fr}
  .works{grid-template-columns:1fr 1fr;grid-auto-rows:170px;gap:8px}
  .wk:nth-child(1),.wk:nth-child(6){grid-column:span 2}.wk figcaption{font-size:18px;padding:30px 12px 10px}
  .proc{grid-template-columns:1fr;gap:20px}.st{display:grid;grid-template-columns:64px 1fr;gap:0 14px}.st .n{grid-row:span 2;font-size:48px}
  .team{gap:10px}.tm h3{font-size:21px}.tm .tx{padding:40px 12px 12px}.tm p{font-size:12.5px}
  .track{grid-auto-columns:86%}
  .score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.score b{font-size:56px}.score p{margin:0}
  .lc>div{padding:26px 18px}.row2{grid-template-columns:1fr}
  .ct .ph{font-size:36px}
  .fab{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(35,27,22,.97);border-top:1px solid var(--line)}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12.5px Manrope;padding:8px 4px}
  .mbar .c{background:var(--brass);color:#1d150f}.mbar .w2{background:#25D366;color:#05301a}.mbar .g2{border:1px solid var(--line)}.mbar .g2 .ic{color:#4cc46a}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header id="hdr">
 <div class="w hd">
  <a class="logo" href="#top" aria-label="Архар Мебель">
   <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 15c-2-7-11-9-14-3-2.5 5 2 10 7 8 3.5-1.5 2.5-6-1-6"/><path d="M20 15c2-7 11-9 14-3 2.5 5-2 10-7 8-3.5-1.5-2.5-6 1-6"/><path d="M15.5 19 20 33l4.5-14"/></svg>
   Архар
  </a>
  <nav class="nav">
   <a href="#catalog" data-t="nav.catalog"></a><a href="#works" data-t="nav.works"></a><a href="#process" data-t="nav.process"></a>
   <a href="#team" data-t="nav.team"></a><a href="#reviews" data-t="nav.reviews"></a><a href="#contacts" data-t="nav.contacts"></a>
  </nav>
  <div class="hd-r">
   <a class="hphone" data-href="phone" data-i="phone"><span data-c="phone"></span></a>
   <a class="ib" data-href="wa" data-i="wa" aria-label="WhatsApp"></a>
   <a class="ib g" data-href="gis" data-i="gis" aria-label="2ГИС"></a>
   <div class="langs" role="group" aria-label="Язык"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
   <button class="ib burger" data-menu data-i="menu" aria-label="Меню"></button>
  </div>
 </div>
</header>

<main id="top">
<section class="hero">
 <img id="heroImg" alt="Интерьер с мебелью Архар" fetchpriority="high">
 <div class="w">
  <div class="hero-g">
   <div>
    <span class="kick" data-t="offer"></span>
    <h1 data-t="hero.title"></h1>
    <p class="lead" data-t="hero.sub"></p>
    <div class="cta">
     <a class="btn btn-b" href="#contacts"><span data-t="cta.measure"></span></a>
     <a class="btn btn-g" href="#catalog"><span data-t="nav.catalog"></span></a>
    </div>
   </div>
   <div class="ccard">
    <small data-t="ct.phone"></small>
    <a class="ph" data-href="phone" data-c="phone"></a>
    <div class="hrs" data-c="hours"></div>
    <div class="row">
     <a class="btn btn-wa" data-href="wa" data-i="wa"><span>WhatsApp</span></a>
     <a class="btn gis" data-href="gis" data-i="gis"><span>2ГИС</span></a>
    </div>
   </div>
  </div>
  <div class="hstats" id="stats"></div>
 </div>
</section>

<section id="catalog" class="fit">
 <div class="w">
  <div class="sh"><h2 data-t="cat.title"></h2><p data-t="cat.sub"></p></div>
  <div class="cat-g">
   <div class="clist" role="tablist" id="clist"></div>
   <div class="cview" id="cview"></div>
  </div>
 </div>
</section>

<section class="fit">
 <div class="w">
  <div class="sh"><h2 data-t="mat.title"></h2><p data-t="mat.sub"></p></div>
  <div class="mats" id="mats"></div>
  <div class="mat-note"><span id="matName"></span><a class="btn btn-g" data-href="wa" data-i="wa"><span data-t="cta.calc"></span></a></div>
 </div>
</section>

<section class="why">
 <div class="w">
  <div class="sh"><h2 data-t="why.title"></h2><p data-t="why.sub"></p></div>
  <div class="why-g" id="why"></div>
 </div>
</section>

<section id="works" class="fit">
 <div class="w">
  <div class="sh"><h2 data-t="works.title"></h2><p data-t="works.sub"></p></div>
  <div class="works" id="worksG"></div>
 </div>
</section>

<section id="process" class="why">
 <div class="w">
  <div class="sh"><h2 data-t="proc.title"></h2><p data-t="proc.sub"></p></div>
  <div class="proc" id="proc"></div>
 </div>
</section>

<section id="team" class="fit">
 <div class="w">
  <div class="sh"><h2 data-t="team.title"></h2><p data-t="team.sub"></p></div>
  <div class="team" id="teamG"></div>
 </div>
</section>

<section id="reviews">
 <div class="w">
  <div class="sh"><h2 data-t="rev.title"></h2><p data-t="rev.sub"></p></div>
  <div class="rv-wrap">
   <div class="score">
    <b>4,9</b><div><div class="s">★★★★★</div><p>2ГИС · Instagram</p>
    <a class="btn gis" data-href="gis" data-i="gis"><span data-t="rev.all"></span></a></div>
   </div>
   <div>
    <div class="track" id="track"></div>
    <div class="arrows"><button class="ib" id="prev" aria-label="Назад">‹</button><button class="ib" id="next" aria-label="Вперёд">›</button></div>
   </div>
  </div>
 </div>
</section>

<section id="contacts">
 <div class="w">
  <div class="lc">
   <div class="l">
    <h2 data-t="lead.title"></h2>
    <p data-t="lead.sub"></p>
    <form data-lead novalidate>
     <label data-t="lead.what"></label>
     <div class="chips" id="chips"></div>
     <div class="row2">
      <input name="name" autocomplete="name" data-tp="lead.name" aria-label="Имя">
      <input name="phone" type="tel" inputmode="tel" autocomplete="tel" data-tp="lead.phone" aria-label="Телефон" value="+996 ">
     </div>
     <button class="btn btn-b" type="submit" data-i="wa"><span data-t="lead.send"></span></button>
     <p class="msg" data-t="lead.note" aria-live="polite"></p>
    </form>
   </div>
   <div class="ct">
    <small data-t="ct.phone"></small>
    <a class="ph" data-href="phone" data-c="phone"></a>
    <div class="item" data-i="pin"><div><small data-t="ct.address"></small><span data-c="address"></span></div></div>
    <div class="item" data-i="clock"><div><small data-t="ct.hours"></small><span data-c="hours"></span></div></div>
    <div class="btns">
     <a class="btn btn-wa" data-href="wa" data-i="wa"><span>WhatsApp</span></a>
     <a class="btn btn-g" data-href="ig" data-i="ig"><span>Instagram</span></a>
     <a class="btn gis" data-href="gis" data-i="gis"><span data-t="ct.route"></span></a>
    </div>
   </div>
  </div>
 </div>
</section>
</main>

<footer><div class="w"><span data-t="foot"></span><a data-href="phone" data-c="phone"></a></div></footer>
<a class="fab" data-href="wa" data-i="wa" aria-label="WhatsApp"></a>
<nav class="mbar" aria-label="Быстрая связь">
 <a class="c" data-href="phone" data-i="phone"><span data-t="cta.call"></span></a>
 <a class="w2" data-href="wa" data-i="wa"><span>WhatsApp</span></a>
 <a class="g2" data-href="gis" data-i="gis"><span>2ГИС</span></a>
</nav>

<script src="site.js"></script>
<script>
const $ = id => document.getElementById(id);
$('heroImg').src = U(IMG.interior, 1800);
const hdr = $('hdr'); const onS = () => hdr.classList.toggle('solid', scrollY > 40); addEventListener('scroll', onS, { passive: true }); onS();

const MATS = [
  ['oak', { ru: ['Дуб натуральный', 'Шпон, масло'], ky: ['Табигый эмен', 'Шпон, май'] }],
  ['wal', { ru: ['Американский орех', 'Шпон, лак'], ky: ['Америка жаңгагы', 'Шпон, лак'] }],
  ['ash', { ru: ['Ясень светлый', 'Шпон, матовый'], ky: ['Ачык шумтал', 'Шпон, күңүрт'] }],
  ['gr', { ru: ['Графит', 'Эмаль, суперматовая'], ky: ['Графит', 'Эмаль, өтө күңүрт'] }],
  ['sage', { ru: ['Шалфей', 'МДФ, эмаль'], ky: ['Шалфей', 'МДФ, эмаль'] }],
  ['st', { ru: ['Мрамор белый', 'Столешница, кварц'], ky: ['Ак мрамор', 'Столешница, кварц'] }]
];
let cur = 0, mat = 0;
function showCat(i) {
  cur = i; const c = DATA.catalog[i], L = AM.lang;
  document.querySelectorAll('#clist button').forEach((b, k) => b.setAttribute('aria-selected', k === i));
  $('cview').innerHTML = `<img src="${U(c.img, 1200)}" alt="${esc(c[L][0])}"><div class="cap"><div><h3>${c[L][0]}</h3><p>${c[L][1]}</p></div>
    <a class="btn btn-b" href="${AM.wa(AM.t('wa.msg') + ' — ' + c[L][0])}" target="_blank" rel="noopener">${AM.t('cta.calc')}</a></div>`;
}
function showMat(i) {
  mat = i; document.querySelectorAll('.mat').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  const m = MATS[i][1][AM.lang]; $('matName').innerHTML = `<b>${m[0]}</b> — ${m[1]}`;
}
AM.onLang(() => {
  const L = AM.lang;
  $('stats').innerHTML = DATA.stats.map(([n, k]) => `<div><b>${n}</b><span>${AM.t(k)}</span></div>`).join('');
  $('clist').innerHTML = DATA.catalog.map((c, i) => `<button role="tab" data-ci="${i}"><span class="n">0${i + 1}</span><b>${c[L][0]}</b><span class="ar">—</span></button>`).join('');
  showCat(cur);
  $('mats').innerHTML = MATS.map(([k, t], i) => `<button class="mat" data-mi="${i}"><div class="sw ${k}"></div><div><b>${t[L][0]}</b><span>${t[L][1]}</span></div></button>`).join('');
  showMat(mat);
  $('why').innerHTML = DATA.why.map(w => `<div class="wi">${ico(w.i)}<h3>${w[L][0]}</h3><p>${w[L][1]}</p></div>`).join('');
  $('worksG').innerHTML = DATA.works.map(w => `<figure class="wk"><img src="${U(w.img, 900)}" alt="${esc(w[L])}" loading="lazy"><figcaption>${w[L]}</figcaption></figure>`).join('');
  $('proc').innerHTML = DATA.process.map((p, i) => `<div class="st"><div class="n">${i + 1}</div><h3>${p[L][0]}</h3><p>${p[L][1]}</p></div>`).join('');
  $('teamG').innerHTML = DATA.team.map(m => `<article class="tm"><span>${m.name[0]}</span><img src="${U(m.img, 600)}" alt="${esc(m.name)}" loading="lazy">
    <div class="tx"><h3>${m.name}</h3><p>${m[L]}</p><span class="xp">${AM.t('exp')}: ${m.exp} ${L === 'ky' ? 'жыл' : 'лет'}</span></div></article>`).join('');
  $('track').innerHTML = DATA.reviews.map(r => `<article class="rv"><q>${r[L]}</q><div class="who"><div class="av">${r.name[0]}</div><div><b>${r.name}</b><span>${AM.L(r.where)} · ★★★★★</span></div></div></article>`).join('');
  $('chips').innerHTML = DATA.catalog.map(c => `<button type="button" class="chip" aria-pressed="false">${c[L][0]}</button>`).join('');
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-ci]'); if (c) showCat(+c.dataset.ci);
  const m = e.target.closest('[data-mi]'); if (m) showMat(+m.dataset.mi);
});
document.addEventListener('mouseover', e => { const c = e.target.closest('[data-ci]'); if (c && +c.dataset.ci !== cur && matchMedia('(hover:hover)').matches) showCat(+c.dataset.ci); });
const tr = $('track'), step = () => tr.firstElementChild.getBoundingClientRect().width + 16;
$('prev').onclick = () => tr.scrollBy({ left: -step(), behavior: 'smooth' });
$('next').onclick = () => tr.scrollBy({ left: step(), behavior: 'smooth' });
</script>
</body>
</html>
