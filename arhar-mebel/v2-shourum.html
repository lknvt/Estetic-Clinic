<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARHAR — Вариант 2 · Светлый шоурум</title>
<meta name="description" content="ARHAR — мебель на заказ в Бишкеке. Кухни, гардеробные, ванные и офисы. Цена, сроки и гарантия в договоре.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&family=Cormorant:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Концепция: светлый шоурум — слоновая кость, латунные тонкие рамки, шалфей как спокойный акцент.
   Крупный антиквенный шрифт для эмоции, гротеск для фактов. */
:root{
  --ivory:#FBF8F3; --linen:#F3EDE4; --sand:#E8DFD2; --ink:#2A2521; --mut:#77695D;
  --line:#E4DACB; --brass:#A9803F; --brass2:#8E6A31; --sage:#7D8C72; --sage2:#6A7860;
  --walnut:#7A4E33; --wa:#25D366; --star:#D99A1E;
  --f-d:Cormorant,Georgia,serif; --f-b:Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font:400 16px/1.65 var(--f-b);color:var(--ink);background:var(--ivory);overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.img-x{opacity:0}
h1,h2,h3{font-family:var(--f-d);font-weight:600;letter-spacing:-.01em;line-height:1.04;text-wrap:balance}
.w{max-width:1260px;margin:0 auto;padding:0 28px}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
.ic{width:20px;height:20px;flex:none}
.ph{background:var(--sand);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;font:600 15px/1 var(--f-b);padding:17px 26px;border-radius:4px;transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.btn-s{background:var(--sage);color:#fff}.btn-s:hover{background:var(--sage2)}
.btn-wa{background:var(--wa);color:#05301a}.btn-wa:hover{background:#1fbf5b}
.btn-l{background:transparent;border:1px solid var(--ink);color:var(--ink)}.btn-l:hover{background:var(--ink);color:#fff}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-g .ic{color:#2FA84F}.btn-g:hover{border-color:#2FA84F}

header{position:sticky;top:0;z-index:50;background:rgba(251,248,243,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:28px;height:72px}
.logo .wm{font:300 31px/1 Comfortaa,sans-serif;letter-spacing:-.01em}
.nav{display:flex;gap:24px;font-size:14.5px;color:var(--mut)}
.nav a:hover{color:var(--ink)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.hphone{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.hphone .ic{color:var(--brass)}
.ib{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--ink);background:#fff;cursor:pointer}
.ib.wa{background:var(--wa);border-color:var(--wa);color:#fff}.ib.g{color:#2FA84F}
.langs{display:flex;gap:2px;font:700 13px var(--f-b)}
.langs button{background:none;border:0;color:var(--mut);cursor:pointer;padding:8px 7px;font:inherit}
.langs button[aria-pressed=true]{color:var(--brass2);text-decoration:underline;text-underline-offset:6px}
.burger{display:none}

section{padding:84px 0}
.sh{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:38px}
.sh h2{font-size:clamp(38px,4.4vw,62px)}
.sh p{color:var(--mut);max-width:46ch;justify-self:end}
.kick{display:inline-flex;align-items:center;gap:10px;color:var(--brass2);font:600 14px var(--f-b)}
.kick::before{content:"";width:28px;height:1px;background:var(--brass);flex:none}

.hero{padding:44px 0 36px}
.hero-g{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center}
.hero-g>*{min-width:0}
.hero h1{font-size:clamp(46px,5.6vw,84px);margin:16px 0 20px}
.hero .sub{font-size:18px;color:var(--mut);max-width:46ch;margin-bottom:28px}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.proof{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.proof>*{display:flex;align-items:baseline;gap:8px;color:var(--mut);font-size:14px}
.proof b{font:600 32px/1 var(--f-d);color:var(--ink)}
.proof .stars{color:var(--star);letter-spacing:1px;font-size:13px}
.frame{position:relative;padding:0 0 26px 26px}
.frame::before{content:"";position:absolute;left:0;bottom:0;width:calc(100% - 26px);height:calc(100% - 26px);border:1px solid var(--brass)}
.frame .main{aspect-ratio:4/4.9;position:relative;z-index:1}
.frame .mini{position:absolute;z-index:2;left:-34px;top:40px;width:38%;aspect-ratio:3/4;border:6px solid var(--ivory)}
.ccard{position:absolute;z-index:3;right:-18px;bottom:54px;background:#fff;padding:18px 20px;box-shadow:0 30px 60px -30px rgba(60,40,20,.45);min-width:250px}
.ccard small{display:block;color:var(--mut);font-size:12.5px}
.ccard .ph2{display:block;font:600 28px var(--f-d);white-space:nowrap;margin:2px 0 10px}
.ccard .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ccard .btn{padding:11px 10px;font-size:13px}

.guar{background:var(--linen);padding:34px 0}
.guar .w{display:grid;grid-template-columns:.8fr 2.2fr;gap:30px;align-items:center}
.guar h2{font-size:32px}
.guar h2+p{color:var(--mut);font-size:14.5px;margin-top:6px}
.guar-g{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line)}
.guar-g div{padding:4px 22px;border-right:1px solid var(--line)}
.guar-g .ic{color:var(--brass);width:26px;height:26px;margin-bottom:10px}
.guar-g b{display:block;font:600 22px var(--f-d)}
.guar-g span{font-size:13.5px;color:var(--mut)}

.cat-g{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:stretch}
.cat-g>*{min-width:0}
.clist{border-top:1px solid var(--line)}
.clist button{width:100%;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--mut);text-align:left;padding:15px 0;cursor:pointer;font:inherit}
.clist .n{font-size:14px;font-variant-numeric:tabular-nums}
.clist b{font:600 32px var(--f-d);color:#a99a8a;transition:color .2s}
.clist .ar{opacity:0;font-size:14px;font-weight:600;color:var(--brass2)}
.clist button[aria-selected=true] b,.clist button:hover b{color:var(--ink)}
.clist button[aria-selected=true] .ar{opacity:1}
.clist button[aria-selected=true] .n{color:var(--brass2)}
.cview{display:flex;flex-direction:column;gap:16px}
.cview .ph{flex:1;min-height:380px}
.cview .ph img{animation:fade .45s ease}
@keyframes fade{from{opacity:.3}to{opacity:1}}
.cview p{color:var(--mut)}
.cview .row{display:flex;gap:10px;flex-wrap:wrap}

.mats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.mat{background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:left;padding:0;font:inherit;transition:border-color .2s,transform .2s}
.mat:hover{transform:translateY(-3px)}
.mat .sw{aspect-ratio:3/3.6}
.mat div{padding:12px 14px}
.mat b{display:block;font:600 21px var(--f-d)}
.mat span{font-size:13px;color:var(--mut)}
.mat[aria-pressed=true]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.sw.oak{background:repeating-linear-gradient(92deg,#d3ad80 0 3px,#c49c6c 3px 5px,#dab78c 5px 11px,#c09466 11px 12px)}
.sw.wal{background:repeating-linear-gradient(88deg,#6b4630 0 4px,#5a3a27 4px 6px,#7a5238 6px 13px,#4f3322 13px 14px)}
.sw.ash{background:repeating-linear-gradient(91deg,#e4d9c6 0 3px,#d6c8b1 3px 4px,#ebe2d3 4px 10px)}
.sw.blue{background:linear-gradient(160deg,#55708c,#3E5671)}
.sw.sage{background:linear-gradient(160deg,#a3ae95,#7d8c72)}
.sw.st{background:radial-gradient(circle at 30% 40%,#fff 0 6%,transparent 7%),radial-gradient(circle at 70% 70%,#ddd8d2 0 10%,transparent 11%),linear-gradient(130deg,#f3f0eb 0 40%,#ddd8d0 41% 43%,#efebe5 44%)}
.mat-note{margin-top:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--mut)}
.mat-note b{color:var(--ink)}

.why{background:var(--linen)}
.why-g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.wi{background:var(--ivory);padding:30px 26px;border-top:2px solid var(--brass)}
.wi .ic{width:34px;height:34px;color:var(--brass);margin-bottom:20px}
.wi h3{font-size:27px;margin-bottom:10px}
.wi p{color:var(--mut);font-size:15px}

.works{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:280px;gap:12px}
.wk:nth-child(1),.wk:nth-child(6){grid-column:span 2}
.wk figcaption{position:absolute;left:0;bottom:0;background:var(--ivory);padding:8px 14px;font:600 19px var(--f-d)}
.wk img{transition:transform .8s}.wk:hover img{transform:scale(1.04)}

.proc{display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.st{border-top:1px solid var(--brass);padding-top:20px}
.st .n{font:600 60px var(--f-d);color:var(--brass);line-height:.9;margin-bottom:14px}
.st h3{font-size:25px;margin-bottom:8px}
.st p{color:var(--mut);font-size:14.5px}

.team{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tm .ph{aspect-ratio:3/3.8;display:grid;place-items:center;color:#d2c5b3;background:var(--linen)}
.tm .face{width:40%;height:auto}
.tm .nm{display:block;height:26px;width:75%;border-bottom:1px dashed var(--brass);margin:14px 0 6px}
.tm p{color:var(--mut);font-size:14.5px}

.rv-wrap{display:grid;grid-template-columns:.8fr 2.2fr;gap:44px;align-items:start}
.rv-wrap>*{min-width:0}
.score{border:1px solid var(--line);background:#fff;padding:26px}
.score b{font:600 76px var(--f-d);color:var(--ink);line-height:1}
.score .s{color:var(--star);letter-spacing:3px;margin:6px 0 10px}
.score p{color:var(--mut);font-size:14px;margin-bottom:18px}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/3);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.rv{scroll-snap-align:start;background:#fff;border:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:14px}
.rv .s{color:var(--star);letter-spacing:2px;font-size:14px}
.rv q{font:500 21px/1.35 var(--f-d);quotes:"«" "»";flex:1}
.rv .who{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.rv .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:#fff;font:700 15px var(--f-b)}
.rv .who b{font-weight:700;font-size:15px;display:block}
.rv .who span{font-size:13px;color:var(--mut)}
.arrows{display:flex;gap:8px;margin-top:18px}

.faq{display:grid;grid-template-columns:.8fr 1.4fr;gap:56px;align-items:start}
.faq>*{min-width:0}
.faq h2{font-size:clamp(38px,4.2vw,58px);margin-bottom:14px}
.faq>div>p{color:var(--mut);margin-bottom:22px;max-width:36ch}
details{border-bottom:1px solid var(--line)}
details:first-child{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:20px 0;font:600 25px var(--f-d);display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 26px/1 var(--f-b);color:var(--brass);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 20px;color:var(--mut);max-width:62ch}

.lc{display:grid;grid-template-columns:1.15fr 1fr;border:1px solid var(--line);background:#fff}
.lc>*{min-width:0}
.lc>div{padding:46px}
.lc .l{background:var(--linen)}
.lc h2{font-size:clamp(36px,3.8vw,54px);margin-bottom:12px}
.lc .l>p{color:var(--mut);margin-bottom:24px}
form{display:flex;flex-direction:column;gap:14px}
form label{font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;font:500 14px var(--f-b);cursor:pointer;border-radius:4px}
.chip[aria-pressed=true]{background:var(--sage);border-color:var(--sage);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);padding:15px 16px;font:400 16px var(--f-b);border-radius:4px}
input:focus{outline:none;border-color:var(--brass)}
.msg{font-size:13.5px;color:var(--mut);min-height:20px}
.msg[data-state=err]{color:#b3261e}.msg[data-state=ok]{color:#1a7f43}
.ct small{color:var(--mut);font-size:13px;display:block}
.ct .ph2{font:600 44px var(--f-d);display:block;margin-bottom:22px;white-space:nowrap}
.ct .item{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.ct .item .ic{color:var(--brass);width:24px;height:24px;margin-top:2px}
.ct .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.ct .btns .btn-g{grid-column:span 2}
footer{border-top:1px solid var(--line);padding:26px 0 100px;color:var(--mut);font-size:14px}
footer .w{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer .wm{font:300 24px Comfortaa,sans-serif;color:var(--ink)}

.fab{position:fixed;right:24px;bottom:24px;z-index:60;width:60px;height:60px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.8)}
.fab .ic{width:30px;height:30px}
.mbar{display:none}

@media (max-height:820px) and (min-width:1001px){section{padding:62px 0}.hero h1{font-size:66px}.frame .main{aspect-ratio:4/4.3}.cview .ph{min-height:320px}.clist button{padding:12px 0}.works{grid-auto-rows:230px}}
@media (max-width:1180px){.nav{display:none}.burger{display:grid}
  body.menu-open .nav{display:flex;flex-direction:column;position:fixed;top:72px;left:0;right:0;background:var(--ivory);padding:22px 28px 28px;gap:16px;font:600 28px var(--f-d);color:var(--ink);border-bottom:1px solid var(--line)}}
@media (max-width:1000px){
  .hero-g,.cat-g,.rv-wrap,.lc,.sh,.faq,.guar .w{grid-template-columns:1fr}
  .sh{gap:12px}.sh p{justify-self:start}
  .hero-g{gap:40px}.frame{max-width:520px;margin-left:34px}
  .mats{grid-template-columns:repeat(3,1fr)}
  .why-g{grid-template-columns:1fr 1fr}
  .proc{grid-template-columns:1fr 1fr}
  .team{grid-template-columns:1fr 1fr}
  .track{grid-auto-columns:calc((100% - 16px)/2)}
  .guar-g{grid-template-columns:1fr 1fr;row-gap:20px}
  .hphone{display:none}
}
@media (max-width:700px){
  .w{padding:0 16px}
  section{padding:56px 0}
  .btn{white-space:normal;text-align:center;line-height:1.25}
  html{scroll-padding-top:64px}
  .hd{height:62px;gap:10px}.logo .wm{font-size:26px}
  body.menu-open .nav{top:62px}
  .hd-r .ib.g{display:none}
  .hero{padding:24px 0 20px}
  .hero h1{font-size:42px;margin:12px 0 14px}
  .hero .sub{font-size:16px;margin-bottom:22px}
  .cta .btn{flex:1 1 100%}
  .proof{gap:10px 18px}.proof b{font-size:26px}
  .frame{margin-left:22px;padding:0 0 18px 18px}.frame::before{width:calc(100% - 18px);height:calc(100% - 18px)}
  .frame .mini{left:-26px;top:24px;width:34%;border-width:4px}
  .ccard{position:relative;right:auto;bottom:auto;margin:-40px 0 0 -4px;min-width:0}
  .ccard .ph2{font-size:24px}
  .guar .w{gap:16px}.guar-g{border-left:0}.guar-g div{padding:0 12px 0 0;border-right:0}
  .clist b{font-size:25px}
  .cview .ph{min-height:300px}
  .mats{gap:8px}.mat div{padding:8px}.mat b{font-size:17px}.mat span{display:none}
  .why-g{grid-template-columns:1fr}
  .works{grid-template-columns:1fr 1fr;grid-auto-rows:170px;gap:8px}
  .wk figcaption{font-size:15px;padding:5px 10px}
  .proc{grid-template-columns:1fr;gap:20px}.st{display:grid;grid-template-columns:60px 1fr;gap:0 14px}.st .n{grid-row:span 2;font-size:46px}
  .team{gap:10px}.tm p{font-size:12.5px}
  .track{grid-auto-columns:86%}
  .score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.score b{font-size:56px}.score p{margin:0}
  summary{font-size:21px;padding:16px 0}
  .lc>div{padding:26px 18px}.row2{grid-template-columns:1fr}
  .ct .ph2{font-size:32px}
  .fab{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(251,248,243,.97);border-top:1px solid var(--line)}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font:700 12.5px var(--f-b);padding:8px 4px;border-radius:4px}
  .mbar .c{background:var(--sage);color:#fff}.mbar .w2{background:var(--wa);color:#05301a}.mbar .g2{background:#fff;border:1px solid var(--line)}.mbar .g2 .ic{color:#2FA84F}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <div class="w hd">
  <a class="logo" href="#top" aria-label="ARHAR"><span class="wm">arhar</span></a>
  <nav class="nav">
   <a href="#catalog" data-t="nav.catalog"></a><a href="#works" data-t="nav.works"></a><a href="#process" data-t="nav.process"></a>
   <a href="#team" data-t="nav.team"></a><a href="#reviews" data-t="nav.reviews"></a><a href="#contacts" data-t="nav.contacts"></a>
  </nav>
  <div class="hd-r">
   <a class="hphone" data-href="phone" data-i="phone"><span data-c="phone"></span></a>
   <a class="ib wa" data-href="wa" data-i="wa" aria-label="WhatsApp"></a>
   <a class="ib g" data-href="gis" data-i="gis" aria-label="2ГИС"></a>
   <div class="langs" role="group" aria-label="Язык"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
   <button class="ib burger" data-menu data-i="menu" aria-label="Меню"></button>
  </div>
 </div>
</header>

<main id="top">
<section class="hero">
 <div class="w hero-g">
  <div>
   <span class="kick"><span data-t="offer"></span></span>
   <h1 data-t="v2.hero.title"></h1>
   <p class="sub" data-t="hero2.sub"></p>
   <div class="cta">
    <a class="btn btn-s" href="#contacts"><span data-t="cta.measure"></span></a>
    <a class="btn btn-wa" data-href="wa" data-i="wa"><span data-t="cta.wa"></span></a>
   </div>
   <div class="proof">
    <a data-href="gis"><b>4,9</b><span><span class="stars">★★★★★</span> <span data-t="proof.rating"></span></span></a>
    <span><b>36 000+</b><span data-t="proof.subs"></span></span>
    <span><b>8</b><span data-t="proof.years"></span></span>
   </div>
  </div>
  <div class="frame">
   <div class="ph main"><img src="img/kitchen-hero.jpg" alt="Кухня ARHAR" fetchpriority="high"></div>
   <div class="ph mini"><img src="img/bath-green.jpg" alt="Ванная ARHAR"></div>
   <div class="ccard">
    <small data-t="ct.phone"></small>
    <a class="ph2" data-href="phone" data-c="phone"></a>
    <div class="row">
     <a class="btn btn-wa" data-href="wa" data-i="wa"><span>WhatsApp</span></a>
     <a class="btn btn-g" data-href="gis" data-i="gis"><span>2ГИС</span></a>

<script src="site.js"></script>
<script>
const $ = id => document.getElementById(id);
const MATS = [
  ['oak', { ru: ['Дуб натуральный', 'Шпон, масло'], ky: ['Табигый эмен', 'Шпон, май'] }],
  ['wal', { ru: ['Орех карини', 'Шпон, лак'], ky: ['Карини жаңгагы', 'Шпон, лак'] }],
  ['ash', { ru: ['Ясень светлый', 'Шпон, матовый'], ky: ['Ачык шумтал', 'Шпон, күңүрт'] }],
  ['blue', { ru: ['Дымчато-синий', 'МДФ, эмаль'], ky: ['Түтүн-көк', 'МДФ, эмаль'] }],
  ['sage', { ru: ['Шалфей', 'МДФ, эмаль'], ky: ['Шалфей', 'МДФ, эмаль'] }],
  ['st', { ru: ['Мрамор белый', 'Столешница, кварц'], ky: ['Ак мрамор', 'Столешница, кварц'] }]
];
let cur = 0, mat = 0;
function showCat(i) {
  cur = i; const c = DATA.catalog[i], L = AM.lang;
  document.querySelectorAll('#clist button').forEach((b, k) => b.setAttribute('aria-selected', k === i));
  $('cview').innerHTML = `<div class="ph"><img src="${P(REAL.catalog[c.k])}" alt="${esc(c[L][0])}"></div><p>${c[L][1]}</p>
    <div class="row"><a class="btn btn-wa" href="${AM.wa(AM.t('wa.msg') + ' — ' + c[L][0])}" target="_blank" rel="noopener">${ico('wa')}${AM.t('cta.calc')}</a></div>`;
}
function showMat(i) {
  mat = i; document.querySelectorAll('.mat').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  const m = MATS[i][1][AM.lang]; $('matName').innerHTML = `<b>${m[0]}</b> — ${m[1]}`;
}
AM.onLang(() => {
  const L = AM.lang;
  $('guar').innerHTML = DATA.guarantees.map(g => `<div>${ico(g.i)}<b>${g[L][0]}</b><span>${g[L][1]}</span></div>`).join('');
  $('clist').innerHTML = DATA.catalog.map((c, i) => `<button role="tab" data-ci="${i}"><span class="n">0${i + 1}</span><b>${c[L][0]}</b><span class="ar">${AM.t('cta.calc')}</span></button>`).join('');
  showCat(cur);
  $('mats').innerHTML = MATS.map(([k, t], i) => `<button class="mat" data-mi="${i}"><div class="sw ${k}"></div><div><b>${t[L][0]}</b><span>${t[L][1]}</span></div></button>`).join('');
  showMat(mat);
  $('why').innerHTML = DATA.why.map(w => `<div class="wi">${ico(w.i)}<h3>${w[L][0]}</h3><p>${w[L][1]}</p></div>`).join('');
  $('worksG').innerHTML = REAL.works.slice(0, 6).map(w => `<figure class="ph wk"><img src="${P(w.img)}" alt="${esc(w[L])}" loading="lazy"><figcaption>${w[L]}</figcaption></figure>`).join('');
  $('proc').innerHTML = DATA.process.map((p, i) => `<div class="st"><div class="n">${i + 1}</div><h3>${p[L][0]}</h3><p>${p[L][1]}</p></div>`).join('');
  $('teamG').innerHTML = DATA.team.map(m => `<article class="tm"><div class="ph">${FACE}</div><span class="nm" aria-label="Имя сотрудника"></span><p>${m[L]}</p></article>`).join('');
  $('track').innerHTML = DATA.reviews.map(r => `<article class="rv"><div class="s">★★★★★</div><q>${r[L]}</q><div class="who"><div class="av">${r.name[0]}</div><div><b>${r.name}</b><span>${AM.L(r.where)}</span></div></div></article>`).join('');
  $('faqL').innerHTML = DATA.faq.map((f, i) => `<details${i ? '' : ' open'}><summary>${f[L][0]}</summary><p>${f[L][1]}</p></details>`).join('');
  $('chips').innerHTML = DATA.catalog.map(c => `<button type="button" class="chip" aria-pressed="false">${c[L][0]}</button>`).join('');
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-ci]'); if (c) showCat(+c.dataset.ci);
  const m = e.target.closest('[data-mi]'); if (m) showMat(+m.dataset.mi);
});
document.addEventListener('mouseover', e => { const c = e.target.closest('[data-ci]'); if (c && +c.dataset.ci !== cur && matchMedia('(hover:hover)').matches) showCat(+c.dataset.ci); });
const tr = $('track'), step = () => tr.firstElementChild.getBoundingClientRect().width + 16;
$('prev').onclick = () => tr.scrollBy({ left: -step(), behavior: 'smooth' });
$('next').onclick = () => tr.scrollBy({ left: step(), behavior: 'smooth' });
</script>
