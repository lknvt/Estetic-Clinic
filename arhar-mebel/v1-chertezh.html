<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архар Мебель — Вариант 1 · Чертёж</title>
<meta name="description" content="Мебель на заказ в Бишкеке: кухни, шкафы-купе, гардеробные, спальни. Бесплатный замер и 3D-проект.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&family=Geologica:wght@400;500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EC; --card:#F8FAF7; --pine:#1E3A32; --pine2:#2B5146; --walnut:#6B4430;
  --ochre:#E2A62A; --ochre2:#C98E14; --ink:#16211D; --mut:#56645E; --line:#C8D1CA;
  --wood:repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 2px,transparent 2px 13px),linear-gradient(140deg,#cfae8c,#a47a57);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font:400 16px/1.6 "Golos Text",system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.img-x{opacity:0}
h1,h2,h3,.disp{font-family:Geologica,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.08}
.w{max-width:1240px;margin:0 auto;padding:0 24px}
:focus-visible{outline:3px solid var(--ochre);outline-offset:3px;border-radius:6px}
.ic{width:20px;height:20px;flex:none}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;font:600 15px/1 "Golos Text";padding:16px 24px;border-radius:12px;transition:background .2s,transform .2s,border-color .2s}
.btn:active{transform:translateY(1px)}
.btn-o{background:var(--ochre);color:var(--ink)} .btn-o:hover{background:var(--ochre2)}
.btn-wa{background:#25D366;color:#06301a} .btn-wa:hover{background:#1fbd5a}
.btn-l{background:transparent;border:1.5px solid var(--line);color:var(--ink)} .btn-l:hover{border-color:var(--pine)}
.btn-gis{background:#fff;color:var(--ink);border:1.5px solid var(--line)} .btn-gis .ic{color:#2FA84F} .btn-gis:hover{border-color:#2FA84F}

/* шапка */
header{position:sticky;top:0;z-index:50;background:rgba(237,240,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:22px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font:800 19px Geologica;color:var(--pine)}
.wm{font:400 28px/1 Comfortaa,sans-serif;letter-spacing:-.02em;color:var(--ink)}.logo small{font:500 11px/1.15 'Golos Text';color:var(--mut);border-left:1px solid var(--line);padding-left:10px}
.nav{display:flex;gap:22px;margin-left:12px;font-size:15px;color:var(--mut)}
.nav a:hover{color:var(--pine)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.hphone{display:flex;align-items:center;gap:8px;font:700 17px Geologica;color:var(--pine)}
.hphone small{display:block;font:400 12px "Golos Text";color:var(--mut)}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.ibtn.wa{color:#1a9f4c} .ibtn.gis{color:#2FA84F}
.langs{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}
.langs button{border:0;background:transparent;font:600 13px "Golos Text";padding:11px 10px;cursor:pointer;color:var(--mut)}
.langs button[aria-pressed=true]{background:var(--pine);color:#fff}
.burger{display:none}

/* секции */
section{padding:72px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:34px}
.sh h2{font-size:clamp(30px,3.6vw,46px);color:var(--pine);max-width:16ch}
.sh p{color:var(--mut);max-width:44ch}
.fit{min-height:calc(100vh - 68px);display:flex;align-items:center}
.fit>.w{width:100%}

/* hero */
.hero{padding:36px 0 30px}
.hero-g{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center}
.offer{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 16px 7px 8px;font-size:14px;color:var(--pine);margin-bottom:22px}
.offer b{background:var(--ochre);color:var(--ink);border-radius:99px;padding:3px 10px;font:700 12px Geologica}
.hero h1{font-size:clamp(36px,4vw,58px);font-weight:800;color:var(--pine);margin-bottom:20px}
.hero .lead{font-size:18px;color:var(--mut);max-width:46ch;margin-bottom:28px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.callrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-top:22px;border-top:1px dashed var(--line)}
.callrow .ph{font:800 26px Geologica;color:var(--ink);white-space:nowrap}
.callrow span{color:var(--mut);font-size:14px}
/* фото с размерными линиями */
.dim{position:relative;padding:30px 0 0 38px}
.dim .pic{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:5/4;background:var(--wood)}
.dim .pic img{width:100%;height:100%;object-fit:cover}
.dl{position:absolute;color:var(--walnut);font:600 13px Geologica;display:flex;align-items:center;gap:8px}
.dl.h{top:0;left:38px;right:0;height:22px}
.dl.h::before,.dl.h::after{content:"";flex:1;height:0;border-top:1.5px solid currentColor}
.dl.h{border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;padding:0 6px}
.dl.v{left:0;top:30px;bottom:0;width:22px;flex-direction:column;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;padding:6px 0}
.dl.v::before,.dl.v::after{content:"";flex:1;width:0;border-left:1.5px solid currentColor}
.dl.v em{writing-mode:vertical-rl;transform:rotate(180deg);font-style:normal}
.tag{position:absolute;background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:0 18px 40px -18px rgba(22,33,29,.45);font-size:13px;color:var(--mut)}
.tag b{display:block;font:700 15px Geologica;color:var(--ink)}
.tag.t1{left:6px;bottom:28px}.tag.t2{right:18px;top:58px}
.tag i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2FA84F;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:30px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.stats div{padding:18px 22px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font:800 30px Geologica;color:var(--pine)}
.stats span{font-size:14px;color:var(--mut)}

/* каталог */
.cat{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ci{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.ci .im{height:190px;background:var(--wood);overflow:hidden}
.ci .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ci:hover .im img{transform:scale(1.05)}
.ci .tx{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.ci h3{font-size:22px;color:var(--pine)}
.ci p{font-size:14.5px;color:var(--mut);flex:1}
.ci a{margin-top:8px;font-weight:600;color:var(--walnut);font-size:14.5px;display:inline-flex;gap:6px;align-items:center}
.ci a:hover{color:var(--pine)}

/* почему мы */
.why{background:var(--pine);color:#e7eee9}
.why .sh h2{color:#fff}.why .sh p{color:#b6c7be}
.why-g{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.why-l{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wi{border:1px solid #3b6255;border-radius:18px;padding:24px}
.wi .ic{width:34px;height:34px;color:var(--ochre);margin-bottom:16px}
.wi h3{font-size:20px;color:#fff;margin-bottom:8px}
.wi p{font-size:14.5px;color:#b6c7be}
.why-p{border-radius:20px;overflow:hidden;background:var(--wood);position:relative;min-height:360px}
.why-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.why-p .tag{left:18px;bottom:18px}

/* работы */
.works{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:250px 250px;gap:14px}
.wk{position:relative;border-radius:18px;overflow:hidden;background:var(--wood)}
.wk img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.wk:hover img{transform:scale(1.04)}
.wk figcaption{position:absolute;left:12px;bottom:12px;right:12px;background:rgba(248,250,247,.94);border-radius:11px;padding:9px 13px;font:600 14px Geologica;color:var(--ink)}

/* процесс */
.proc{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;counter-reset:s}
.proc::before{content:"";position:absolute;left:0;right:0;top:27px;border-top:1.5px dashed var(--walnut);opacity:.5}
.st{position:relative;padding-right:22px}
.st .n{width:56px;height:56px;border-radius:50%;background:var(--paper);border:1.5px solid var(--walnut);display:grid;place-items:center;font:800 20px Geologica;color:var(--walnut);margin-bottom:20px;position:relative}
.st:nth-child(2) .n{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
.st h3{font-size:19px;color:var(--pine);margin-bottom:6px}
.st p{font-size:14.5px;color:var(--mut)}
.proc-cta{margin-top:40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px}
.proc-cta p{flex:1;min-width:220px;font:600 18px Geologica;color:var(--pine)}

/* команда */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tm{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tm .im{aspect-ratio:1/1.05;background:linear-gradient(160deg,#c9d3cc,#9fb0a6);position:relative;overflow:hidden}
.tm .im img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.tm .im span{position:absolute;inset:0;display:grid;place-items:center;font:800 54px Geologica;color:rgba(255,255,255,.7);z-index:-0}
.tm .im img{position:relative;z-index:1}
.tm .tx{padding:16px 18px 18px}
.tm h3{font-size:18px;color:var(--ink)}
.tm p{font-size:14px;color:var(--mut);margin:3px 0 10px}
.tm .xp{display:inline-block;font:600 12.5px Geologica;color:var(--walnut);background:#efe5dc;border-radius:99px;padding:4px 10px}

/* отзывы */
.rev-top{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 18px}
.rev-top b{font:800 30px Geologica;color:var(--pine)}
.rev-top .s{color:var(--ochre);letter-spacing:2px}
.rev-top small{display:block;color:var(--mut);font-size:13px}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.rv .s{color:var(--ochre);letter-spacing:2px}
.rv p{font-size:15px;flex:1}
.rv .who{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.rv .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pine);color:#fff;font:700 15px Geologica;flex:none}
.rv .who b{display:block;font:600 15px Geologica}
.rv .who span{font-size:13px;color:var(--mut)}

/* заявка */
.lead-b{background:var(--walnut);color:#f5ece4;border-radius:28px;padding:48px;display:grid;grid-template-columns:1fr 1.1fr;gap:44px;position:relative;overflow:hidden}
.lead-b::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border:1.5px dashed rgba(245,236,228,.25);border-radius:50%}
.lead-b h2{font-size:clamp(30px,3.4vw,44px);color:#fff;margin-bottom:14px}
.lead-b>div>p{color:#e3cfbf;margin-bottom:22px}
.lead-b .callrow{border-color:rgba(245,236,228,.3)}
.lead-b .callrow .ph{color:#fff}.lead-b .callrow span{color:#e3cfbf}
form{background:var(--card);color:var(--ink);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
form label{font:600 14px "Golos Text";color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 15px;font:500 14px "Golos Text";cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;font:400 16px "Golos Text";background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--pine)}
.msg{font-size:13.5px;color:var(--mut);min-height:20px}
.msg[data-state=err]{color:#b3261e}.msg[data-state=ok]{color:#1a7f43}

/* контакты */
.ct-g{display:grid;grid-template-columns:1fr 1.25fr;gap:24px}
.ct-l{display:flex;flex-direction:column;gap:12px}
.cr{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.cr .ic{width:26px;height:26px;color:var(--pine)}
.cr small{display:block;color:var(--mut);font-size:13px}
.cr b{font:700 18px Geologica}
.cr.big b{font-size:26px}
.ct-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.map{border-radius:22px;overflow:hidden;position:relative;min-height:380px;background:
  linear-gradient(90deg,transparent 49.6%,#d5dcd6 49.6% 50.4%,transparent 50.4%) 0 0/80px 80px,
  linear-gradient(0deg,transparent 49.6%,#d5dcd6 49.6% 50.4%,transparent 50.4%) 0 0/80px 80px,
  linear-gradient(35deg,transparent 47%,#fff 47% 53%,transparent 53%),#e4e9e5;border:1px solid var(--line)}
.map .pinbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);text-align:center}
.map .pinbox .ic{width:54px;height:54px;color:var(--walnut);fill:#efe5dc}
.map .pinbox div{background:var(--card);border-radius:12px;padding:10px 14px;font:600 14px Geologica;box-shadow:0 14px 30px -14px rgba(0,0,0,.4);margin-bottom:6px;white-space:nowrap}
.map .btn{position:absolute;left:18px;bottom:18px}
footer{padding:28px 0 100px;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

/* плавающие */
.fab{position:fixed;right:22px;bottom:22px;z-index:60;width:62px;height:62px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.8)}
.fab .ic{width:32px;height:32px}
.mbar{display:none}

/* адаптив */
@media (max-height:800px) and (min-width:1001px){section{padding:56px 0}.sh{margin-bottom:26px}.ci .im{height:160px}.works{grid-template-rows:205px 205px}.hero h1{font-size:54px}}
@media (max-width:1100px){.nav{display:none}.burger{display:grid}
  body.menu-open .nav{display:flex;position:fixed;top:68px;left:0;right:0;flex-direction:column;background:var(--paper);padding:20px 24px 28px;gap:16px;font-size:19px;border-bottom:1px solid var(--line);margin:0}}
@media (max-width:1000px){
  .fit{min-height:0}
  .hero-g,.why-g,.lead-b,.ct-g{grid-template-columns:1fr}
  .cat{grid-template-columns:1fr 1fr}
  .proc{grid-template-columns:1fr;gap:22px}
  .proc::before{left:27px;right:auto;top:0;bottom:0;border-top:0;border-left:1.5px dashed var(--walnut)}
  .st{display:grid;grid-template-columns:56px 1fr;gap:0 18px;padding:0}.st .n{margin:0;grid-row:span 2}
  .team{grid-template-columns:1fr 1fr}
  .revs{grid-template-columns:1fr 1fr}
  .works{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .wk{height:220px}.wk:first-child{grid-column:span 2;height:280px}.wk:last-child{grid-column:span 2}
  .hphone small{display:none}
}
@media (max-width:700px){
  .w{padding:0 16px}
  section{padding:52px 0}
  .hd{gap:10px;height:62px}.wm{font-size:24px}
  .hphone,.hd-r .ibtn.gis{display:none}
  html{scroll-padding-top:66px}
  body.menu-open .nav{top:62px}
  .sh{flex-direction:column;align-items:start;gap:10px;margin-bottom:24px}
  .hero{padding:22px 0 10px}
  .hero .lead{font-size:16.5px}
  .cta .btn{flex:1 1 100%}
  .callrow .ph{font-size:24px}.hero .callrow>span{display:none}
  .dim{padding:24px 0 0 30px}.dl.h{left:30px}.dl.v{top:24px}
  .tag.t2{display:none}.tag.t1{left:-14px}
  .stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .stats b{font-size:24px}
  .cat{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;gap:12px}
  .ci{flex:0 0 78%;scroll-snap-align:start}
  .why-l{grid-template-columns:1fr}.why-p{min-height:240px}
  .works{grid-template-columns:1fr 1fr;gap:10px}.wk{height:170px}.wk:first-child{height:230px}
  .wk figcaption{font-size:12.5px;padding:7px 10px;left:8px;right:8px;bottom:8px}
  .team{gap:12px}.tm .tx{padding:12px}.tm h3{font-size:15.5px}.tm p{font-size:13px}
  .revs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;gap:12px}
  .rv{flex:0 0 86%;scroll-snap-align:start}
  .lead-b{padding:28px 18px;border-radius:22px;margin:0 -4px}
  form{padding:18px}.row2{grid-template-columns:1fr}
  .map{min-height:280px}
  .fab{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(248,250,247,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12.5px "Golos Text";padding:8px 4px;border-radius:12px}
  .mbar .c{background:var(--pine);color:#fff}.mbar .w2{background:#25D366;color:#06301a}.mbar .g{background:#fff;border:1.5px solid var(--line)}.mbar .g .ic{color:#2FA84F}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <div class="w hd">
  <a class="logo" href="#top" aria-label="Архар Мебель"><span class="wm">arhar</span><small>мебельная<br>компания</small>
  </a>
  <nav class="nav">
   <a href="#catalog" data-t="nav.catalog"></a><a href="#works" data-t="nav.works"></a><a href="#process" data-t="nav.process"></a>
   <a href="#team" data-t="nav.team"></a><a href="#reviews" data-t="nav.reviews"></a><a href="#contacts" data-t="nav.contacts"></a>
  </nav>
  <div class="hd-r">
   <a class="hphone" data-href="phone" data-i="phone"><span><span data-c="phone"></span><small data-c="hours"></small></span></a>
   <a class="ibtn wa" data-href="wa" data-i="wa" aria-label="WhatsApp"></a>
   <a class="ibtn gis" data-href="gis" data-i="gis" aria-label="2ГИС"></a>
   <div class="langs" role="group" aria-label="Язык"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
   <button class="ibtn burger" data-menu data-i="menu" aria-label="Меню"></button>
  </div>
 </div>
</header>

<main id="top">
<!-- HERO -->
<section class="hero fit">
 <div class="w">
  <div class="hero-g">
   <div>
    <div class="offer"><b>%</b><span data-t="offer"></span></div>
    <h1 data-t="hero.title"></h1>
    <p class="lead" data-t="hero.sub"></p>
    <div class="cta">
     <a class="btn btn-o" href="#lead"><span data-t="cta.measure"></span></a>
     <a class="btn btn-wa" data-href="wa" data-i="wa"><span data-t="cta.wa"></span></a>
    </div>
    <div class="callrow">
     <a class="ph" data-href="phone" data-c="phone"></a>
     <span data-c="hours"></span>
     <a class="btn btn-gis" data-href="gis" data-i="gis" style="margin-left:auto;padding:12px 16px"><span data-t="cta.gis"></span></a>
    </div>
   </div>
   <div class="dim">
    <div class="dl h"><em style="font-style:normal">4 200 мм</em></div>

<script>
document.getElementById('heroImg').src = U(IMG.hero, 1200);
document.getElementById('shopImg').src = U(IMG.workshop, 900);
AM.onLang(() => {
  const L = AM.lang, $ = id => document.getElementById(id);
  $('stats').innerHTML = DATA.stats.map(([n, k]) => `<div><b>${n}</b><span>${AM.t(k)}</span></div>`).join('');
  $('cat').innerHTML = DATA.catalog.map(c => `<article class="ci"><div class="im"><img src="${U(c.img, 700)}" alt="${esc(c[L][0])}" loading="lazy"></div>
    <div class="tx"><h3>${c[L][0]}</h3><p>${c[L][1]}</p><a href="${AM.wa(AM.t('wa.msg') + ' — ' + c[L][0])}" target="_blank" rel="noopener">${ico('wa')}${AM.t('cta.calc')}</a></div></article>`).join('');
  $('why').innerHTML = DATA.why.map(w => `<div class="wi">${ico(w.i)}<h3>${w[L][0]}</h3><p>${w[L][1]}</p></div>`).join('');
  $('worksG').innerHTML = DATA.works.map(w => `<figure class="wk"><img src="${U(w.img, 800)}" alt="${esc(w[L])}" loading="lazy"><figcaption>${w[L]}</figcaption></figure>`).join('');
  $('proc').innerHTML = DATA.process.map((p, i) => `<div class="st"><div class="n">${i + 1}</div><h3>${p[L][0]}</h3><p>${p[L][1]}</p></div>`).join('');
  $('teamG').innerHTML = DATA.team.map(m => `<article class="tm"><div class="im"><span>${m.name[0]}</span><img src="${U(m.img, 500)}" alt="${esc(m.name)}" loading="lazy"></div>
    <div class="tx"><h3>${m.name}</h3><p>${m[L]}</p><span class="xp">${AM.t('exp')}: ${m.exp} ${L === 'ky' ? 'жыл' : 'лет'}</span></div></article>`).join('');
  $('revs').innerHTML = DATA.reviews.map(r => `<article class="rv"><div class="s">★★★★★</div><p>${r[L]}</p>
    <div class="who"><div class="av">${r.name[0]}</div><div><b>${r.name}</b><span>${AM.L(r.where)}</span></div></div></article>`).join('');
  $('chips').innerHTML = DATA.catalog.map(c => `<button type="button" class="chip" aria-pressed="false">${c[L][0]}</button>`).join('');
});
</script>
