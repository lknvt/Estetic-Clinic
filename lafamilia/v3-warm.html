<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Familia KG — Тёплая мебель для всей семьи</title>
<meta name="description" content="La Familia KG — мебельный салон в Бишкеке: диваны, спальни, детские, кухни. Доставка, сборка, рассрочка 0%.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
/* Brand palette (warm cream / caramel / cocoa). Adjust tokens to match the exact brand colours. */
:root{--cream:#f7f1e9;--sand:#ecdfcf;--caramel:#b07b55;--caramel2:#d9ab84;--cocoa:#4a3226;--cocoa2:#3a271d;--mut:#8a7565;--sage:#dfe5d6;--blush:#f2ddd2;--white:#fffdf9;--r:28px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cocoa);background:var(--cream);line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.ic{width:1.2em;height:1.2em;flex:none}
.wrap{max-width:1200px;margin:auto;padding:0 24px}
h1,h2,h3{font-weight:900;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
h2{font-size:clamp(30px,3.5vw,46px)}
em{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;color:var(--caramel)}
.kick{display:inline-block;font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--caramel);margin-bottom:12px}
.sub{color:var(--mut);font-size:17px;max-width:540px;margin-top:10px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;font:800 15px Nunito,sans-serif;padding:15px 24px;border-radius:99px;transition:transform .2s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.wa{background:#25d366;color:#fff;box-shadow:0 12px 24px -12px #25d366}
.btn.wa:hover{transform:translateY(-2px);background:#1fbd5a}
.btn.br{background:var(--cocoa);color:#fff}
.btn.br:hover{background:var(--cocoa2);transform:translateY(-2px)}
.btn.lt{background:var(--white);color:var(--cocoa);box-shadow:0 6px 16px -10px rgba(74,50,38,.4)}
.btn.lt:hover{transform:translateY(-2px)}
.btn .g{color:#2fa84f}
section{padding:76px 0;scroll-margin-top:70px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.stars{display:inline-flex;gap:1px;color:#f0a93b}
.stars .ic{width:15px;height:15px}
/* header */
.top{background:var(--cocoa);color:#eadccb;font-size:13px;font-weight:700}
.top .wrap{display:flex;gap:22px;align-items:center;height:36px}
.top span,.top a{display:inline-flex;gap:6px;align-items:center}
.top .ic{color:var(--caramel2);width:15px;height:15px}
.top .r{margin-left:auto}
header{position:sticky;top:0;z-index:40;background:rgba(247,241,233,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav{display:flex;align-items:center;gap:26px;height:76px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo .mk{width:44px;height:44px;border-radius:14px 14px 22px 22px;background:var(--caramel);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif;font-style:italic;font-size:19px}
.logo b{font-size:21px;font-weight:900;line-height:1}
.logo small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.nav-links{display:flex;gap:22px;font-weight:800;font-size:15px;white-space:nowrap}
.nav-links a{position:relative;padding:6px 0}
.nav-links a:after{content:"";position:absolute;left:50%;right:50%;bottom:0;height:3px;border-radius:3px;background:var(--caramel);transition:left .25s,right .25s}
.nav-links a:hover:after{left:0;right:0}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.ph{display:flex;flex-direction:column;line-height:1.15;text-align:right;white-space:nowrap}
.ph b{font-size:18px;font-weight:900}
.ph small{font-size:12px;font-weight:800;color:#2f9e55}
.lang{display:flex;background:var(--sand);border-radius:99px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;font:800 13px Nunito;padding:7px 11px;border-radius:99px;color:var(--mut)}
.lang button.on{background:var(--cocoa);color:#fff}
.nav .btn{padding:12px 18px}
.burger{display:none;border:0;background:none;cursor:pointer;color:var(--cocoa)}
.burger .ic{width:28px;height:28px}
.telm{display:none}
/* hero */
.hero{padding:36px 0 64px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:54px;align-items:center}
.hero h1{font-size:clamp(40px,5.2vw,70px);margin-bottom:18px}
.hero p{font-size:19px;color:#6d5546;max-width:500px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 30px}
.rooms{display:flex;gap:8px;flex-wrap:wrap}
.rooms a{background:var(--white);border:1.5px solid var(--sand);padding:8px 14px;border-radius:99px;font-weight:800;font-size:14px;transition:background .2s,border-color .2s,color .2s}
.rooms a:hover{background:var(--caramel);border-color:var(--caramel);color:#fff}
.trust{display:flex;align-items:center;gap:14px;margin-top:26px;font-size:14px;font-weight:700;color:var(--mut)}
.faces{display:flex}
.faces span{width:36px;height:36px;border-radius:50%;border:3px solid var(--cream);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;margin-left:-10px}
.faces span:first-child{margin-left:0}
.hv{position:relative;height:min(560px,calc(100vh - 210px));min-height:430px}
.hv .bg{position:absolute;right:-6%;top:6%;width:78%;height:92%;border-radius:50% 50% var(--r) var(--r);background:var(--sand)}
.hv .p1{position:absolute;left:0;top:0;width:76%;height:100%;border-radius:var(--r);overflow:hidden;box-shadow:0 40px 70px -40px rgba(74,50,38,.6)}
.hv .p2{position:absolute;right:0;bottom:8%;width:40%;height:46%;border-radius:var(--r);overflow:hidden;border:7px solid var(--cream);box-shadow:0 24px 50px -24px rgba(74,50,38,.6)}
.hv img{width:100%;height:100%;object-fit:cover}
.promo{position:absolute;left:-26px;bottom:10%;background:var(--cocoa);color:#fff;border-radius:22px;padding:18px 22px;box-shadow:0 24px 40px -20px rgba(58,39,29,.8)}
.promo b{display:block;font-size:34px;font-weight:900;line-height:1;color:var(--caramel2)}
.promo span{font-size:14px;font-weight:700;opacity:.9}
.seal{position:absolute;right:4%;top:2%;width:118px;height:118px;border-radius:50%;background:var(--caramel);color:#fff;display:grid;place-items:center}
.seal svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 22s linear infinite}
.seal .ic{width:34px;height:34px}
@keyframes spin{to{transform:rotate(360deg)}}
/* advantages band */
.band{background:var(--cocoa);color:#f3e8dc;border-radius:var(--r);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
.band article{padding:34px 28px;display:flex;flex-direction:column;gap:10px;position:relative;transition:background .3s}
.band article:hover{background:var(--cocoa2)}
.band article+article:before{content:"";position:absolute;left:0;top:28px;bottom:28px;border-left:1px dashed rgba(234,220,203,.25)}
.band .ib{width:58px;height:58px;border-radius:18px;background:var(--caramel);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.band .ib .ic{width:28px;height:28px}
.band h3{font-size:21px;color:#fff}
.band p{font-size:15px;opacity:.78}
/* catalog: room tabs */
.rt{display:grid;grid-template-columns:330px 1fr;gap:22px;height:470px}
.tabs{display:flex;flex-direction:column;gap:8px}
.tabs button{flex:1;display:flex;align-items:center;gap:14px;border:0;cursor:pointer;text-align:left;background:var(--white);border-radius:20px;padding:10px 16px 10px 10px;font:800 16px Nunito,sans-serif;color:var(--cocoa);transition:background .25s,color .25s,transform .25s}
.tabs button img{width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none}
.tabs button small{display:block;font-weight:600;font-size:13px;color:var(--mut)}
.tabs button .ic{margin-left:auto;opacity:0;transition:opacity .2s,transform .2s}
.tabs button:hover{transform:translateX(4px)}
.tabs button.on{background:var(--cocoa);color:#fff}
.tabs button.on small{color:#d9c6b4}
.tabs button.on .ic{opacity:1}
.show{position:relative;border-radius:var(--r);overflow:hidden;isolation:isolate;display:flex;align-items:flex-end;padding:30px;color:#fff}
.show img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:fadeZoom .7s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeZoom{from{opacity:.3;transform:scale(1.05)}to{opacity:1;transform:none}}
.show:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(40,26,19,.85),transparent 55%)}
.show .card{display:flex;align-items:end;justify-content:space-between;gap:20px;width:100%;flex-wrap:wrap}
.show h3{font-size:36px}
.show p{font-size:16px;opacity:.9;margin-top:4px}
.show .cnt{position:absolute;top:22px;left:24px;background:var(--white);color:var(--cocoa);font-weight:900;font-size:13px;padding:7px 12px;border-radius:99px}
/* steps path */
#steps{background:var(--white)}
.path{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-top:10px}
.path svg.line{position:absolute;left:0;right:0;top:0;width:100%;height:120px;z-index:0}
.path article{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.path article:nth-child(odd of article){margin-top:44px}
.path .ib{width:92px;height:92px;border-radius:50%;background:var(--cream);border:3px solid var(--caramel2);display:grid;place-items:center;color:var(--caramel);position:relative;margin-bottom:18px;transition:transform .3s,background .3s,color .3s}
.path article:hover .ib{transform:scale(1.07);background:var(--caramel);color:#fff}
.path .ib .ic{width:36px;height:36px}
.path .ib b{position:absolute;top:-4px;right:-4px;width:32px;height:32px;border-radius:50%;background:var(--cocoa);color:#fff;font-size:14px;display:grid;place-items:center}
.path h3{font-size:22px;margin-bottom:6px}
.path p{font-size:15px;color:var(--mut);max-width:240px}
.path-cta{margin-top:40px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
/* team */
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tm{border-radius:var(--r);padding:14px 14px 20px;text-align:center;transition:transform .3s}
.tm:hover{transform:translateY(-6px)}
.tm:nth-child(1){background:var(--blush)}.tm:nth-child(2){background:var(--sage)}.tm:nth-child(3){background:var(--sand)}.tm:nth-child(4){background:#e3e1ec}
.tm .ph-i{height:250px;border-radius:120px 120px 18px 18px;overflow:hidden;margin-bottom:16px}
.tm img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.tm h3{font-size:19px}
.tm .role{display:inline-block;background:var(--white);font-weight:900;font-size:12px;color:var(--caramel);padding:5px 11px;border-radius:99px;margin:8px 0 6px}
.tm p{font-size:14px;color:#6d5546}
/* reviews slider */
#rev{background:var(--sand)}
.rw{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:stretch}
.sum{background:var(--caramel);color:#fff;border-radius:var(--r);padding:30px;display:flex;flex-direction:column;gap:14px}
.sum .big{font-size:30px;font-weight:600;line-height:1.1;font-family:"Playfair Display",serif;font-style:italic}
.sum .stars{color:#ffe1a8}.sum .stars .ic{width:20px;height:20px}
.sum p{font-size:15px;opacity:.92}
.sum .btn{margin-top:auto}
.slider{position:relative;min-width:0}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.rc{flex:0 0 calc(50% - 9px);scroll-snap-align:start;background:var(--white);border-radius:var(--r);padding:30px;display:flex;flex-direction:column;gap:16px;position:relative}
.rc:before{content:"„";position:absolute;right:24px;bottom:-34px;font-family:"Playfair Display",serif;font-size:110px;line-height:1;color:var(--sand)}
.rc p{font-size:17px;flex:1}
.who{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.who b{display:block}.who small{font-size:13px;color:var(--mut);font-weight:700}
.arr{display:flex;gap:8px;margin-top:14px}
.arr button{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;background:var(--white);color:var(--cocoa);display:grid;place-items:center;transition:background .2s,color .2s}
.arr button:hover{background:var(--cocoa);color:#fff}
.arr button .ic{width:22px;height:22px}
.arr button:first-child .ic{transform:rotate(180deg)}
/* lead */
.lead{display:grid;grid-template-columns:1fr 1fr;border-radius:32px;overflow:hidden;background:var(--white);box-shadow:0 40px 80px -50px rgba(74,50,38,.6)}
.lead .pic{position:relative;min-height:440px}
.lead .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lead .pic .badge{position:absolute;left:22px;bottom:22px;background:var(--white);border-radius:18px;padding:12px 16px;font-weight:800;font-size:14px;display:flex;gap:10px;align-items:center;max-width:80%}
.lead .pic .badge .ic{color:#25d366;width:26px;height:26px}
.lead .fm{padding:46px}
.lead p.s{color:var(--mut);margin:10px 0 22px;font-size:16px}
form{display:grid;gap:10px}
input,select{width:100%;font:700 15px Nunito;padding:16px 18px;border-radius:16px;border:1.5px solid var(--sand);background:var(--cream);color:var(--cocoa);outline:none}
input:focus,select:focus{border-color:var(--caramel)}
form .btn{width:100%;padding:17px}
form small{color:var(--mut);font-size:13px;text-align:center}
/* contacts */
.ct{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}
.ci{background:var(--cocoa);color:#f3e8dc;border-radius:var(--r);padding:36px}
.ci h2{color:#fff}
.ci .kick{color:var(--caramel2)}
.ci ul{list-style:none;display:grid;gap:18px;margin:26px 0}
.ci li{display:flex;gap:14px;align-items:center}
.ci li .ib{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.1);color:var(--caramel2);display:grid;place-items:center;flex:none}
.ci li small{display:block;font-size:13px;opacity:.7;font-weight:700}
.ci li b{font-size:18px;color:#fff}
.ci .row{display:flex;gap:10px;flex-wrap:wrap}
.ci .btn.lt{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.map{position:relative;border-radius:var(--r);overflow:hidden;min-height:440px;background:#efe5d6}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:52%;top:46%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.map .pin span{background:var(--white);border-radius:16px;padding:10px 14px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(74,50,38,.6);display:flex;gap:8px;align-items:center}
.map .pin span i{width:30px;height:30px;border-radius:10px 10px 15px 15px;background:var(--caramel);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif;font-size:13px}
.map .pin u{width:18px;height:18px;border-radius:50%;background:var(--caramel);border:4px solid var(--white);margin-top:8px;box-shadow:0 0 0 10px rgba(176,123,85,.25)}
.map .btn{position:absolute;right:20px;bottom:20px}
footer{padding:30px 0 40px;font-size:14px;color:var(--mut);font-weight:700}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fab{position:fixed;right:24px;bottom:24px;z-index:30;width:62px;height:62px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.8);transition:transform .2s}
.fab:hover{transform:scale(1.08)}
.fab .ic{width:32px;height:32px}
.mbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1320px){
 .nav-links{display:none}.burger{display:block}
 body.menu-open .nav-links{display:flex;flex-direction:column;position:absolute;top:76px;left:0;right:0;background:var(--cream);padding:18px 24px 26px;font-size:18px;gap:16px;border-bottom:1px solid var(--sand)}
}
@media(max-width:1040px){
 .band,.team{grid-template-columns:repeat(2,minmax(0,1fr))}
 .band article:nth-child(3):before{display:none}
 .rt{grid-template-columns:280px 1fr}
}
@media(max-width:820px){
 section{padding:56px 0}
 .wrap{padding:0 18px}
 .top{display:none}
 .nav{height:64px;gap:10px}
 body.menu-open .nav-links{top:64px}
 .nav .ph,.nav .btn,.logo small{display:none}
 .telm{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--cocoa);color:#fff}
 .hero{padding:20px 0 44px}
 .hero .wrap,.rw,.lead,.ct{grid-template-columns:minmax(0,1fr)}
 .hero .wrap{gap:34px}
 .hero p{font-size:17px}
 .cta .btn{flex:1 1 auto}
 .hv{height:380px;min-height:0}
 .hv .p1{width:82%}
 .promo{left:8px;bottom:6%;padding:12px 16px}.promo b{font-size:26px}
 .seal{width:86px;height:86px;right:0}
 .band{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .band article{padding:22px 16px}
 .band h3{font-size:17px}.band p{font-size:13.5px}
 .band .ib{width:46px;height:46px}
 .band article:nth-child(odd):before{display:none}
 .rt{grid-template-columns:minmax(0,1fr);height:auto}
 .tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
 .tabs::-webkit-scrollbar{display:none}
 .tabs button{flex:none;padding:8px 14px 8px 8px;font-size:14px}
 .tabs button img{width:38px;height:38px;border-radius:10px}
 .tabs button small,.tabs button .ic{display:none}
 .tabs button:hover{transform:none}
 .show{height:340px;padding:20px}
 .show h3{font-size:26px}
 .path{grid-template-columns:minmax(0,1fr);gap:22px}
 .path svg.line{display:none}
 .path article,.path article:nth-child(odd of article){margin:0;display:grid;grid-template-columns:76px 1fr;gap:4px 16px;text-align:left;align-items:center}
 .path .ib{width:72px;height:72px;margin:0;grid-row:span 2}
 .path .ib .ic{width:28px;height:28px}
 .path h3{margin:0;font-size:20px}
 .team{gap:10px}
 .tm{padding:8px 8px 14px}
 .tm .ph-i{height:170px;margin-bottom:10px}
 .tm h3{font-size:16px}
 .tm .role{font-size:10.5px}
 .tm p{display:none}
 .sum{padding:24px}.sum .big{font-size:26px}
 .rc{flex:0 0 88%;padding:22px}
 .rc p{font-size:15.5px}
 .lead .pic{min-height:220px}
 .lead .fm{padding:26px 20px}
 .ci{padding:26px 20px}
 .map{min-height:300px}
 .fab{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,249,.95);backdrop-filter:blur(12px);border-top:1px solid var(--sand)}
 .mbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;padding:8px 4px;border-radius:16px;background:var(--sand)}
 .mbar a.w{background:#25d366;color:#fff}
 .mbar .ic{width:22px;height:22px}
 footer{padding-bottom:100px}
}
</style>
</head>
<body>
<div class="top"><div class="wrap">
 <span data-ic="pin" data-i="addr"></span>
 <span data-ic="clock" data-i="hours"></span>
 <a class="r" data-href="ig" data-ic="ig">@lafamilia.kg</a>
 <a data-href="gis" data-ic="gis">2ГИС</a>
</div></div>

<header><div class="wrap nav">
 <a href="#" class="logo"><span class="mk">LF</span><span><b>La Familia</b><small id="lgs"></small></span></a>
 <nav class="nav-links">
  <a href="#cat" data-i="nav_cat"></a><a href="#why" data-i="nav_why"></a><a href="#steps" data-i="nav_steps"></a><a href="#team" data-i="nav_team"></a><a href="#rev" data-i="nav_rev"></a><a href="#contacts" data-i="nav_contacts"></a>

<script>
const {D,img,icon,stars,wa,t}=LF;
const $=id=>document.getElementById(id);
const AV=['#c98e6a','#8f9f7a','#7d93a3','#b9876a'];
let cur=0;
function showCat(i){
 cur=i;const l=LF.lang,c=D.cats[i],ky=l==='ky';
 $('tabs').querySelectorAll('button').forEach((b,k)=>{b.classList.toggle('on',k===i);b.setAttribute('aria-selected',k===i)});
 $('show').innerHTML=`<img src="${img(c.img)}" alt="${c[l][0]}"><span class="cnt">${i+1} / ${D.cats.length}</span><div class="card"><div><h3>${c[l][0]}</h3><p>${c[l][1]}</p></div><a class="btn wa" href="${wa(t('wa_cat')+' '+c[l][0])}" target="_blank" rel="noopener">${icon('wa')}${t('cat_more')}</a></div>`;
}
LF.init(l=>{
 const ky=l==='ky';
 $('lgs').textContent=ky?'Үй-бүлө эмерек салону':'Семейный мебельный салон';
 $('hs').innerHTML=$('ss').innerHTML=stars();
 $('faces').innerHTML=D.reviews.map((r,i)=>`<span style="background:${AV[i]}">${r.n[0]}</span>`).join('');
 $('promo').textContent=ky?'бөлүп төлөө — үстөк төлөмсүз':'рассрочка без переплат';
 $('sealtx').textContent=ky?'БҮТ ҮЙ-БҮЛӨ ҮЧҮН ЭМЕРЕК • LA FAMILIA • ':'МЕБЕЛЬ ДЛЯ ВСЕЙ СЕМЬИ • LA FAMILIA • ';
 $('rooms').innerHTML=D.cats.map((c,i)=>`<a href="#cat" data-cat="${i}">${c[l][2]}</a>`).join('');
 $('adv').innerHTML=D.adv.map(a=>`<article><div class="ib">${icon(a.ic)}</div><h3>${a[l][0]}</h3><p>${a[l][1]}</p></article>`).join('');
 $('tabs').innerHTML=D.cats.map((c,i)=>`<button role="tab" data-k="${i}"><img src="${img(c.img)}" alt="" loading="lazy"><span>${c[l][0]}<small>${c[l][1]}</small></span>${icon('arrow')}</button>`).join('');
 showCat(cur);
 $('stp').innerHTML=D.steps.map((s,i)=>`<article><div class="ib">${icon(s.ic)}<b>${i+1}</b></div><h3>${s[l][0]}</h3><p>${s[l][1]}</p></article>`).join('');
 $('tm').innerHTML=D.team.map(m=>`<article class="tm rv"><div class="ph-i"><img src="${img(m.img)}" alt="${m[l][0]}" loading="lazy"></div><h3>${m[l][0]}</h3><span class="role">${m[l][1]}</span><p>${m[l][2]}</p></article>`).join('');
 $('sumh').textContent=ky?'Бизди сунушташат':'Нас рекомендуют';
 $('sump').textContent=ky?'Кардарлар бизди жеткирүүнүн ылдамдыгы, усталардын тактыгы жана адилет баалар үчүн баалашат.':'Покупатели ценят нас за быструю доставку, аккуратных мастеров и честные цены.';
 $('trk').innerHTML=D.reviews.map((r,i)=>`<article class="rc">${stars()}<p>${r[l]}</p><div class="who"><span class="av" style="background:${AV[i]}">${r.n[0]}</span><div><b>${r.n}</b><small>${r.p} · 2ГИС</small></div></div></article>`).join('');
 $('pics').textContent=ky?'Менеджер 10 мүнөттө жооп берет':'Менеджер ответит за 10 минут';
 $('room').innerHTML=`<option value="">${t('f_room')}</option>`+D.cats.map(c=>`<option>${c[l][0]}</option>`).join('');
});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showCat(+b.dataset.k)});
$('rooms').addEventListener('click',e=>{const a=e.target.closest('[data-cat]');if(a)showCat(+a.dataset.cat)});
const step=d=>{const tr=$('trk'),w=tr.querySelector('.rc').offsetWidth+18;tr.scrollBy({left:d*w})};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
</script>
