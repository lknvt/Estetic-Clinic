<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Familia KG — @lafamilia.kg · Мебель для всей семьи</title>
<meta name="description" content="La Familia KG — мебельный салон в Бишкеке: диваны, спальни, детские, кухни. Доставка, сборка, рассрочка 0%.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
/* Brand palette — adjust these 6 tokens to match the exact colours of @lafamilia.kg */
:root{--cream:#f7f1e9;--sand:#ecdfcf;--caramel:#b07b55;--caramel2:#d2a27a;--cocoa:#4a3226;--mut:#8a7565;--sage:#dfe5d6;--blush:#f2ddd2;--sky:#dde6ec;--white:#fffdf9;--r:26px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cocoa);background:var(--cream);line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.ic{width:1.2em;height:1.2em;flex:none}
.wrap{max-width:1200px;margin:auto;padding:0 24px}
h1,h2,h3{font-weight:900;letter-spacing:-.02em;line-height:1.1}
h2{font-size:clamp(28px,3.4vw,44px)}
em,.pf{font-family:"Playfair Display",serif;font-style:italic;font-weight:600;color:var(--caramel)}
.kick{display:inline-flex;align-items:center;gap:8px;background:var(--white);color:var(--caramel);font-weight:800;font-size:13px;padding:7px 14px;border-radius:99px;margin-bottom:14px;box-shadow:0 4px 14px -8px rgba(74,50,38,.3)}
.kick:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--caramel)}
.sub{color:var(--mut);font-size:17px;max-width:520px;margin-top:10px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:800 15px Nunito,sans-serif;padding:14px 22px;border-radius:14px;transition:transform .2s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.wa{background:#25d366;color:#fff;box-shadow:0 10px 22px -12px #25d366}
.btn.wa:hover{transform:translateY(-2px);background:#1fbd5a}
.btn.br{background:var(--cocoa);color:#fff}
.btn.br:hover{background:#2f1f17;transform:translateY(-2px)}
.btn.lt{background:var(--white);color:var(--cocoa);box-shadow:0 4px 14px -8px rgba(74,50,38,.35)}
.btn.lt:hover{transform:translateY(-2px)}
.btn.lt .ic.g{color:#2fa84f}
section{padding:70px 0;scroll-margin-top:70px}
.rv{opacity:0;transform:translateY(20px) scale(.98);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.34,1.3,.5,1)}
.rv.in{opacity:1;transform:none}
.ring{padding:3px;border-radius:50%;background:conic-gradient(from 210deg,var(--caramel),#e9b98f,#c98e6a,var(--cocoa),var(--caramel))}
.ring>*{border-radius:50%;border:3px solid var(--cream);overflow:hidden;width:100%;height:100%}
/* header */
header{position:sticky;top:0;z-index:40;background:rgba(247,241,233,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--sand)}
.nav{display:flex;align-items:center;gap:24px;height:70px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo .ring{width:44px;height:44px}
.logo .ring span{display:grid;place-items:center;background:var(--cocoa);color:#fff;font-family:"Playfair Display",serif;font-style:italic;font-size:19px}
.logo b{font-size:19px;font-weight:900;line-height:1}
.logo small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.nav-links{display:flex;gap:2px;font-weight:800;font-size:14px;white-space:nowrap}
.nav-links a{padding:8px 9px;border-radius:99px;transition:background .2s}
.nav-links a:hover{background:var(--sand)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.ph{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;white-space:nowrap;background:var(--white);padding:10px 14px;border-radius:14px}
.ph .ic{color:var(--caramel)}
.lang{display:flex;background:var(--sand);border-radius:12px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;font:800 13px Nunito;padding:7px 10px;border-radius:9px;color:var(--mut)}
.lang button.on{background:var(--white);color:var(--cocoa);box-shadow:0 2px 6px rgba(74,50,38,.15)}
.burger{display:none;border:0;background:none;cursor:pointer;color:var(--cocoa)}
.burger .ic{width:28px;height:28px}
.telm{display:none}
/* hero = profile */
.hero{padding:40px 0 50px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.prof{display:flex;gap:26px;align-items:center;margin-bottom:22px}
.prof .ring{width:118px;height:118px;flex:none}
.prof .ring img{object-fit:cover}
.prof h1{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.prof h1 .vf{width:18px;height:18px;border-radius:50%;background:var(--caramel);color:#fff;display:grid;place-items:center;font-size:11px}
.stats{display:flex;gap:26px}
.stats b{display:block;font-size:24px;font-weight:900;line-height:1.1}
.stats span{font-size:13px;color:var(--mut);font-weight:700}
.hero h2{font-size:clamp(36px,4.6vw,62px);margin-bottom:14px}
.bio{font-size:16px;font-weight:600;color:#6d5546;margin-bottom:22px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.hl{display:flex;gap:18px;margin-top:28px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.hl::-webkit-scrollbar{display:none}
.hl a{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:800;flex:none;transition:transform .2s}
.hl a:hover{transform:translateY(-3px)}
.hl .ring{width:74px;height:74px}
.hl img{object-fit:cover}
/* post card */
.post{background:var(--white);border-radius:var(--r);box-shadow:0 30px 60px -30px rgba(74,50,38,.45);overflow:hidden;max-width:470px;margin-left:auto;position:relative}
.post .ph-h{display:flex;align-items:center;gap:10px;padding:14px 16px}
.post .ph-h .ring{width:36px;height:36px}
.post .ph-h .ring span{display:grid;place-items:center;background:var(--cocoa);color:#fff;font-family:"Playfair Display",serif;font-style:italic;font-size:15px}
.post .ph-h b{font-size:14px;display:block;line-height:1.1}.post .ph-h small{font-size:12px;color:var(--mut)}
.post .pi{height:min(400px,calc(100vh - 380px));min-height:280px;position:relative}
.post .pi img{width:100%;height:100%;object-fit:cover}
.post .tag{position:absolute;left:16px;bottom:16px;background:rgba(74,50,38,.85);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:10px}
.post .act{display:flex;gap:14px;padding:12px 16px 4px;color:var(--cocoa)}
.post .act .ic{width:26px;height:26px}
.post .act .ic.h{color:#e0475b;fill:#e0475b}
.post .cap{padding:4px 16px 16px;font-size:14px}
.float{position:absolute;right:-12px;top:84px;background:var(--white);border-radius:16px;padding:10px 14px;box-shadow:0 14px 30px -14px rgba(74,50,38,.5);font-weight:800;font-size:13px;display:flex;gap:8px;align-items:center}
.stars{display:inline-flex;gap:1px;color:#f0a93b}
.stars .ic{width:15px;height:15px}
/* advantages */
.adv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.adv article{border-radius:var(--r);padding:28px 24px;transition:transform .3s cubic-bezier(.34,1.4,.5,1)}
.adv article:hover{transform:translateY(-6px) rotate(-1deg)}
.adv article:nth-child(1){background:var(--blush)}.adv article:nth-child(2){background:var(--sage)}.adv article:nth-child(3){background:var(--sand)}.adv article:nth-child(4){background:var(--sky)}
.adv .ib{width:58px;height:58px;border-radius:18px;background:var(--white);display:grid;place-items:center;color:var(--caramel);margin-bottom:40px;box-shadow:0 8px 18px -10px rgba(74,50,38,.4)}
.adv .ib .ic{width:28px;height:28px}
.adv h3{font-size:21px;margin-bottom:6px}
.adv p{font-size:15px;color:#6d5546}
/* catalog feed */
#cat{background:var(--white)}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-radius:var(--r);overflow:hidden}
.feed a{position:relative;height:250px;overflow:hidden;color:#fff;display:block}
.feed img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.feed a:hover img{transform:scale(1.07)}
.feed .lb{position:absolute;left:14px;bottom:14px;background:rgba(255,253,249,.95);color:var(--cocoa);font-weight:900;font-size:15px;padding:8px 14px;border-radius:12px;transition:opacity .3s}
.feed .ov{position:absolute;inset:0;background:rgba(74,50,38,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;opacity:0;transition:opacity .3s}
.feed a:hover .ov,.feed a:focus-visible .ov{opacity:1}
.feed a:hover .lb{opacity:0}
.feed .ov h3{font-size:22px}
.feed .ov p{font-size:14px;opacity:.85}
.feed .ov span{margin-top:8px;background:#25d366;padding:9px 14px;border-radius:12px;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.feed .multi{position:absolute;top:12px;right:12px;width:22px;height:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
/* steps = stories */
.stories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.story{position:relative;border-radius:var(--r);padding:22px 22px 26px;min-height:300px;color:#fff;background:linear-gradient(160deg,var(--caramel2),var(--caramel) 50%,var(--cocoa));display:flex;flex-direction:column;overflow:hidden}
.story:nth-child(2){background:linear-gradient(160deg,#c9a385,#8f6448 55%,#3f2a1f)}
.story:nth-child(3){background:linear-gradient(160deg,#b9a38c,#7b6656 55%,#3b2c22)}
.story:nth-child(4){background:linear-gradient(160deg,#d6ab85,#a46c49 55%,#55372a)}
.bars{display:flex;gap:4px;margin-bottom:22px}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.bars i.f{background:#fff}
.story .ib{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:auto;backdrop-filter:blur(4px)}
.story .ib .ic{width:28px;height:28px}
.story .big{position:absolute;right:-6px;top:30px;font-size:130px;font-weight:900;line-height:1;opacity:.12}
.story h3{font-size:26px;margin:22px 0 6px}
.story p{font-size:15px;opacity:.92}
/* team */
#team{background:var(--sand)}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.member{position:relative;border-radius:var(--r);overflow:hidden;height:380px;color:#fff;isolation:isolate}
.member img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;z-index:-2;transition:transform .7s}
.member:hover img{transform:scale(1.05)}
.member:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 25%,transparent 45%,rgba(40,25,18,.9))}
.member .top{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.member .top .ring{width:30px;height:30px}
.member .top .ring span{display:grid;place-items:center;background:var(--cocoa);font-family:"Playfair Display",serif;font-style:italic;font-size:13px}
.member .bt{position:absolute;left:18px;right:18px;bottom:18px}
.member .role{display:inline-block;background:var(--white);color:var(--cocoa);font-weight:900;font-size:12px;padding:5px 10px;border-radius:9px;margin-bottom:8px}
.member h3{font-size:21px}
.member p{font-size:13.5px;opacity:.88;margin-top:3px}
/* reviews = comments */
.rg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cm{background:var(--white);border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:48px 1fr;gap:14px;box-shadow:0 10px 30px -22px rgba(74,50,38,.5)}
.cm .ring{width:48px;height:48px}
.cm .ring span{display:grid;place-items:center;font-weight:900;color:#fff;font-size:19px}
.cm b{font-size:15px}
.cm .tx{font-size:15.5px;margin:4px 0 8px}
.cm .meta{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--mut);font-weight:700}
.cm .meta .ic{width:16px;height:16px;color:#e0475b;fill:#e0475b}
.cm .rep{grid-column:2;display:flex;gap:10px;align-items:flex-start;background:var(--cream);padding:10px 12px;border-radius:14px;font-size:14px}
.cm .rep .ring{width:28px;height:28px;flex:none}
.cm .rep .ring span{background:var(--cocoa);font-family:"Playfair Display",serif;font-style:italic;font-size:12px}
/* instagram block */
#ig{background:var(--white)}
.igg{display:grid;grid-template-columns:.85fr 1.15fr;gap:50px;align-items:center}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-radius:var(--r);overflow:hidden}
.grid9 a{position:relative;aspect-ratio:1;max-height:190px;overflow:hidden}
.grid9 img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.grid9 a:hover img{transform:scale(1.08)}
.grid9 a:after{content:"";position:absolute;inset:0;background:rgba(74,50,38,0);transition:background .3s}
.grid9 a:hover:after{background:rgba(74,50,38,.25)}
.igbox{background:var(--cream);border-radius:var(--r);padding:30px}
.igbox .prof{margin-bottom:16px}
.igbox .prof .ring{width:84px;height:84px}
.igbox p{font-size:15px;font-weight:600;color:#6d5546;margin-bottom:20px}
.igbtn{background:linear-gradient(90deg,var(--caramel),var(--cocoa));color:#fff}
/* lead dm */
.dm{background:var(--cocoa);color:#fff;border-radius:32px;padding:46px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.dm:after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(210,162,122,.4),transparent 70%)}
.dm .kick{background:rgba(255,255,255,.12);color:#f3d7bf}
.dm .kick:before{background:#f3d7bf}
.dm p.s{opacity:.85;margin-top:12px;font-size:16px}
.bub{display:grid;gap:8px;margin-top:22px;max-width:380px}
.bub span{background:rgba(255,255,255,.12);padding:10px 14px;border-radius:18px 18px 18px 4px;font-size:14px;width:fit-content}
.bub span.me{background:var(--caramel2);color:var(--cocoa);border-radius:18px 18px 4px 18px;justify-self:end;font-weight:700}
form{display:grid;gap:10px;position:relative;z-index:1}
input,select{width:100%;font:700 15px Nunito;padding:16px 18px;border-radius:16px;border:0;background:var(--white);color:var(--cocoa);outline:none}
input:focus,select:focus{box-shadow:0 0 0 3px var(--caramel2)}
form .btn{width:100%;padding:17px}
form small{opacity:.7;font-size:13px;text-align:center}
/* contacts */
.ct{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.cc{background:var(--white);border-radius:var(--r);padding:24px;display:flex;gap:14px;align-items:center}
.cc .ib{width:52px;height:52px;border-radius:16px;background:var(--sand);display:grid;place-items:center;color:var(--caramel);flex:none}
.cc .ib .ic{width:26px;height:26px}
.cc small{display:block;font-size:13px;color:var(--mut);font-weight:700}
.cc b{font-size:17px;font-weight:900}
.mapc{position:relative;border-radius:var(--r);overflow:hidden;height:300px;background:#efe5d6}
.mapc>svg{position:absolute;inset:0;width:100%;height:100%}
.mapc .pin{position:absolute;left:58%;top:48%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.mapc .pin .ring{width:58px;height:58px}
.mapc .pin .ring span{display:grid;place-items:center;background:var(--cocoa);color:#fff;font-family:"Playfair Display",serif;font-style:italic;font-size:22px}
.mapc .pin i{width:3px;height:16px;background:var(--cocoa)}
.mapc .ov{position:absolute;left:24px;top:24px;bottom:24px;background:var(--white);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:360px}
.mapc .ov h3{font-size:24px}
.mapc .row{display:flex;gap:8px;flex-wrap:wrap}
footer{padding:30px 0 40px;font-size:14px;color:var(--mut);font-weight:700}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fab{position:fixed;right:24px;bottom:24px;z-index:30;width:60px;height:60px;border-radius:20px;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.8);transition:transform .2s}
.fab:hover{transform:scale(1.08) rotate(-6deg)}
.fab .ic{width:32px;height:32px}
.mbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1340px){.nav-links{display:none}.burger{display:block}body.menu-open .nav-links{display:flex;flex-direction:column;position:absolute;top:70px;left:0;right:0;background:var(--cream);padding:16px 18px 24px;font-size:18px;border-bottom:1px solid var(--sand)}}
@media(max-width:1100px){
 .nav-links{display:none}.burger{display:block}
 body.menu-open .nav-links{display:flex;flex-direction:column;position:absolute;top:70px;left:0;right:0;background:var(--cream);padding:16px 18px 24px;font-size:18px;border-bottom:1px solid var(--sand)}
 .adv,.stories,.team{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
 section{padding:54px 0}
 .wrap{padding:0 18px}
 .nav{height:62px;gap:10px}
 body.menu-open .nav-links{top:62px}
 .nav .ph,.nav-r>.btn{display:none}
 .logo small{display:none}
 .telm{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--cocoa);color:#fff}
 .hero{padding:22px 0 40px}
 .hero .wrap,.igg,.dm,.rg{grid-template-columns:minmax(0,1fr)}
 .hero .wrap{gap:30px}
 .prof{gap:18px}
 .prof .ring{width:90px;height:90px}
 .prof>div{min-width:0}
 .stats{gap:12px}.stats b{font-size:18px}.stats span{font-size:11.5px;display:block;line-height:1.25}
 .stats>div{min-width:0;flex:1}
 .cta .btn{flex:1 1 auto}
 .hl .ring{width:64px;height:64px}.hl{gap:12px;margin:22px -18px 0;padding:4px 18px}
 .post{max-width:none}
 .post .pi{height:300px}
 .float{right:10px}
 .adv{gap:10px}
 .adv article{padding:20px 16px}
 .adv .ib{margin-bottom:22px;width:48px;height:48px}
 .adv h3{font-size:18px}.adv p{font-size:14px}
 .feed{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
 .feed a{height:170px}
 .feed .lb{left:8px;bottom:8px;font-size:13px;padding:6px 10px}
 .stories{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px;gap:10px;scrollbar-width:none}
 .story{flex:0 0 72%;scroll-snap-align:start;min-height:280px}
 .team{gap:10px}
 .member{height:270px}
 .member .top{display:none}
 .member h3{font-size:17px}
 .member p{display:none}
 .member .role{font-size:10.5px}
 .member .bt{left:12px;right:12px;bottom:12px}
 .cm{padding:18px;grid-template-columns:40px 1fr;gap:10px}
 .cm .ring{width:40px;height:40px}
 .dm{padding:30px 20px;border-radius:26px}
 .ct{grid-template-columns:1fr}
 .mapc{height:auto;display:flex;flex-direction:column}
 .mapc>svg{position:relative;height:200px}
 .mapc .ov{position:relative;inset:auto;max-width:none;border-radius:0}
 .mapc .pin{top:110px}
 .fab{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,249,.95);backdrop-filter:blur(12px);border-top:1px solid var(--sand)}
 .mbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;padding:8px 4px;border-radius:14px;background:var(--sand)}
 .mbar a.w{background:#25d366;color:#fff}
 .mbar .ic{width:22px;height:22px}
 footer{padding-bottom:100px}
}
</style>
</head>
<body>
<header><div class="wrap nav">

LF.init(l=>{

 $('stp').innerHTML=D.steps.map((s,i)=>`<article class="story"><div class="bars">${[0,1,2,3].map(k=>`<i class="${k<=i?'f':''}"></i>`).join('')}</div><span class="big">${i+1}</span><div class="ib">${icon(s.ic)}</div><h3>${s[l][0]}</h3><p>${s[l][1]}</p></article>`).join('');
 $('tm').innerHTML=D.team.map(m=>`<article class="member rv"><img src="${img(m.img,500)}" alt="${m[l][0]}" loading="lazy"><div class="top"><span class="ring"><span>LF</span></span>lafamilia.kg</div><div class="bt"><span class="role">${m[l][1]}</span><h3>${m[l][0]}</h3><p>${m[l][2]}</p></div></article>`).join('');
 $('rvs').innerHTML=D.reviews.map((r,i)=>`<article class="cm rv"><span class="ring"><span style="background:${AV[i]}">${r.n[0]}</span></span><div><b>${r.n}</b> ${stars()}<p class="tx">${r[l]}</p><div class="meta"><span>${r.p}</span><span>2ГИС</span><span style="display:flex;gap:4px;align-items:center">${icon('heart')} ${12+i*7}</span></div></div><div class="rep"><span class="ring"><span style="display:grid;place-items:center;color:#fff">LF</span></span><span><b>lafamilia.kg</b> ${ky?'Рахмат! Сизди дайыма күтөбүз 🤎':'Спасибо! Всегда рады видеть вас 🤎'}</span></div></article>`).join('');
 $('g9').innerHTML=D.feed.map(id=>`<a href="${IG}" target="_blank" rel="noopener" aria-label="Instagram"><img src="${img(id,400)}" alt="" loading="lazy"></a>`).join('');

 $('room').innerHTML=`<option value="">${t('f_room')}</option>`+D.cats.map(c=>`<option>${c[l][0]}</option>`).join('');
});
