<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Familia — Мебель для всей семьи · Бишкек</title>
<meta name="description" content="La Familia KG — мебельный салон в Бишкеке: диваны, спальни, детские, кухни. Доставка, сборка, рассрочка 0%.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ef;--bg2:#efe9e0;--ink:#1f1d1a;--mut:#6d675f;--line:#e2dbd0;--acc:#c8643b;--acc2:#e58a5f;--dark:#24221f;--card:#fff;--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.ic{width:1.25em;height:1.25em;flex:none}
.wrap{max-width:1240px;margin:auto;padding:0 24px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.08}
h2{font-size:clamp(30px,3.6vw,46px)}
em{font-style:italic;color:var(--acc)}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.kick:before{content:"";width:26px;height:2px;background:currentColor}
.sub{color:var(--mut);font-size:17px;max-width:520px;margin-top:10px}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;font:700 15px Manrope,sans-serif;padding:15px 24px;border-radius:99px;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.wa{background:#25d366;color:#fff;box-shadow:0 10px 24px -10px #25d366}
.btn.wa:hover{background:#1fbd5a;transform:translateY(-2px)}
.btn.acc{background:var(--acc);color:#fff}
.btn.acc:hover{background:#b3552f;transform:translateY(-2px)}
.btn.line{border:1.5px solid var(--ink);background:transparent}
.btn.line:hover{background:var(--ink);color:#fff}
.btn.gis{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.gis .ic{color:#2fa84f}
.btn.gis:hover{border-color:#2fa84f}
section{padding:68px 0;scroll-margin-top:70px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
/* top info bar */
.topbar{background:var(--dark);color:#d9d3c9;font-size:13px}
.topbar .wrap{display:flex;gap:22px;align-items:center;height:38px}
.topbar span{display:inline-flex;align-items:center;gap:6px}
.topbar .ic{color:var(--acc2);width:15px;height:15px}
.topbar .sp{margin-left:auto}
.topbar a:hover{color:#fff}
/* header */
header{position:sticky;top:0;z-index:40;background:rgba(247,244,239,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:26px;height:72px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:24px;font-weight:600;letter-spacing:-.02em}
.logo i{font-style:italic;color:var(--acc)}
.logo svg{width:34px;height:34px}
.nav-links{display:flex;gap:20px;white-space:nowrap;font-weight:600;font-size:15px;color:var(--mut)}
.nav-links a:hover{color:var(--ink)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.ph{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.ph b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ph small{white-space:nowrap;font-size:12px;color:#2f9e55;font-weight:700}
.lang{display:flex;background:var(--bg2);border-radius:99px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;font:700 13px Manrope;padding:7px 11px;border-radius:99px;color:var(--mut)}
.lang button.on{background:var(--ink);color:#fff}
.nav .btn{padding:12px 18px}
.telm{display:none;width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;place-items:center}
.burger{display:none;border:0;background:none;cursor:pointer;color:var(--ink)}
.burger .ic{width:28px;height:28px}
/* hero */
.hero{padding:40px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(40px,5.2vw,74px);margin:18px 0 20px}
.hero p{font-size:19px;color:var(--mut);max-width:520px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 36px}
.facts{display:flex;gap:0;border-top:1px solid var(--line);padding-top:22px}
.facts div{flex:1;padding-right:16px}
.facts div+div{padding-left:20px;border-left:1px solid var(--line)}
.facts b{display:block;font-family:Fraunces,serif;font-size:34px;font-weight:600;line-height:1}
.facts span{font-size:14px;color:var(--mut)}
.hv{position:relative;height:min(600px,calc(100vh - 200px));min-height:440px}
.hv .main{position:absolute;inset:0 0 0 12%;border-radius:200px 200px var(--r) var(--r);overflow:hidden}
.hv .main img{width:100%;height:100%;object-fit:cover}
.hv .sm{position:absolute;left:0;bottom:8%;width:38%;aspect-ratio:1;border-radius:var(--r);overflow:hidden;border:6px solid var(--bg);box-shadow:0 20px 40px -20px rgba(0,0,0,.4)}
.hv .sm img{width:100%;height:100%;object-fit:cover}
.chip{position:absolute;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.chip small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.chip.c1{top:10%;right:-14px}
.chip.c2{top:44%;left:2%}
.chip .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fdf0ea;color:var(--acc)}
.stars{display:inline-flex;gap:1px;color:#f2b33d}
.stars .ic{width:15px;height:15px}
/* advantages */
.adv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.adv article{background:var(--card);border-radius:var(--r);padding:30px 26px;position:relative;border:1px solid var(--line);transition:transform .3s,box-shadow .3s}
.adv article:hover{transform:translateY(-6px);box-shadow:0 24px 40px -26px rgba(0,0,0,.3)}
.adv .n{position:absolute;top:22px;right:24px;font-family:Fraunces,serif;font-size:15px;color:#c7bfb3}
.adv .ib{width:56px;height:56px;border-radius:16px;background:#fdf0ea;color:var(--acc);display:grid;place-items:center;margin-bottom:22px}
.adv .ib .ic{width:28px;height:28px}
.adv h3{font-size:22px;margin-bottom:8px}
.adv p{color:var(--mut);font-size:15px}
/* catalog bento */
#cat{background:var(--bg2)}
.bento{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;grid-template-rows:230px 230px;gap:16px}
.bento a{position:relative;border-radius:var(--r);overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;isolation:isolate}
.bento a:first-child,.bento a:last-child{grid-row:span 2}
.bento img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.bento a:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(20,16,12,.78))}
.bento a:hover img{transform:scale(1.06)}
.bento h3{font-size:24px}
.bento a:first-child h3{font-size:34px}
.bento p{font-size:14px;opacity:.85}
.bento .go{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.92);color:var(--ink);font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.bento a:hover .go{background:var(--acc);color:#fff}
.bento .go .ic{width:15px;height:15px}
/* steps */
#steps{background:var(--dark);color:#f3eee6}
#steps .sub{color:#aaa197}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s;position:relative}
.steps:before{content:"";position:absolute;left:4%;right:4%;top:34px;border-top:1.5px dashed #57524b}
.steps article{position:relative}
.steps .ib{width:68px;height:68px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;margin-bottom:22px;box-shadow:0 0 0 8px var(--dark)}
.steps .ib .ic{width:30px;height:30px}
.steps small{font-size:13px;letter-spacing:.14em;color:var(--acc2);font-weight:700}
.steps h3{font-size:26px;margin:6px 0 8px}
.steps p{color:#bdb5aa;font-size:15px;max-width:250px}
.steps-cta{margin-top:44px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:22px 26px;border-radius:var(--r);background:#2f2c28}
.steps-cta p{flex:1;font-size:18px;font-weight:600}
/* team */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.team article{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.team .ph-i{height:250px;overflow:hidden}
.team img{width:100%;height:100%;object-fit:cover;object-position:center 25%;transition:transform .6s}
.team article:hover img{transform:scale(1.05)}
.team .b{padding:18px 20px 22px}
.team h3{font-size:21px}
.role{display:inline-block;margin:8px 0 8px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);background:#fdf0ea;padding:5px 10px;border-radius:99px}
.team p{font-size:14px;color:var(--mut)}
/* reviews */
#rev{background:var(--bg2)}
.revs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.revs article{background:var(--card);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:14px;position:relative}
.revs article:before{content:"“";position:absolute;right:20px;top:4px;font-family:Fraunces,serif;font-size:80px;color:#f1e3da;line-height:1}
.revs p{font-size:15.5px;flex:1}
.who{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--acc)}
.who b{display:block;font-size:15px}.who small{color:var(--mut);font-size:13px}
.gisbar{display:flex;align-items:center;gap:14px;background:#fff;border-radius:99px;padding:8px 8px 8px 20px;font-weight:700}
/* cta form */
.ctab{background:var(--acc);color:#fff;border-radius:32px;padding:52px;display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;position:relative;overflow:hidden}
.ctab:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:70px solid rgba(255,255,255,.08);right:-140px;top:-180px}
.ctab .kick{color:#ffe1d3}
.ctab h2{margin:12px 0}
.ctab p{opacity:.9;font-size:17px}
form{display:grid;gap:12px;position:relative}
input,select{width:100%;font:500 16px Manrope;padding:16px 18px;border-radius:14px;border:0;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{box-shadow:0 0 0 3px #ffd2bd}
form .btn{width:100%;padding:17px}
form small{opacity:.8;font-size:13px;text-align:center}
/* contacts */
.ct{display:grid;grid-template-columns:1fr 1.15fr;gap:24px}
.ci{background:var(--card);border-radius:var(--r);padding:36px;border:1px solid var(--line)}
.ci h2{margin:12px 0 10px}
.ci ul{list-style:none;margin:26px 0;display:grid;gap:18px}
.ci li{display:flex;gap:14px;align-items:flex-start}
.ci li .ib{width:44px;height:44px;border-radius:12px;background:#fdf0ea;color:var(--acc);display:grid;place-items:center;flex:none}
.ci li small{display:block;color:var(--mut);font-size:13px}
.ci li b{font-size:17px}
.ci .row{display:flex;gap:10px;flex-wrap:wrap}
.map{border-radius:var(--r);overflow:hidden;position:relative;min-height:420px;background:#e9e2d6}
.map svg.grid{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.map .pin span{background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;white-space:nowrap}
.map .pin i{width:22px;height:22px;background:var(--acc);border:4px solid #fff;border-radius:50%;margin-top:8px;box-shadow:0 0 0 10px rgba(200,100,59,.25)}
.map .btn{position:absolute;left:20px;bottom:20px}
footer{padding:30px 0 40px;color:var(--mut);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* floating + mobile bar */
.fab{position:fixed;right:24px;bottom:24px;z-index:30;width:62px;height:62px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.8)}
.fab .ic{width:32px;height:32px}
.fab:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:pulse 2.2s infinite}
@keyframes pulse{to{transform:scale(1.5);opacity:0}}
.mbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* responsive */
@media(max-width:1100px){
 .nav-links{display:none}.burger{display:block}
 body.menu-open .nav-links{display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:var(--bg);padding:20px 24px 28px;border-bottom:1px solid var(--line);font-size:18px;gap:18px}
 .adv,.team,.revs{grid-template-columns:repeat(2,minmax(0,1fr))}
 .nav-r .ph{display:none}
}
@media(max-width:820px){
 section{padding:60px 0}
 .topbar{display:none}
 .nav{height:62px;gap:12px}
 .nav .ph,.nav .btn{display:none}
 .telm{display:grid}
 body.menu-open .nav-links{top:62px}
 .logo{font-size:21px}
 .hero{padding:24px 0 40px}
 .hero .wrap,.ctab,.ct{grid-template-columns:minmax(0,1fr)}
 .hero .wrap{gap:30px}
 .hv{height:380px;min-height:0}
 .hv .sm{width:34%}
 .chip.c2{display:none}
 .chip.c1{right:6px;top:6%}
 .cta .btn{flex:1}
 .facts b{font-size:26px}
 .bento{grid-template-columns:1fr 1fr;grid-template-rows:auto}
 .bento a{height:180px;padding:16px}
 .bento a:first-child{grid-column:span 2;grid-row:auto;height:240px}
 .bento a:last-child{grid-row:auto}
 .adv{gap:12px}.adv article{padding:20px 16px}.adv h3{font-size:18px}.adv p{font-size:14px}.adv .ib{width:46px;height:46px;margin-bottom:14px}
 .bento h3,.bento a:first-child h3{font-size:19px}
 .bento p{display:none}
 .bento .go{font-size:0;padding:8px}
 .steps{grid-template-columns:1fr;gap:26px}
 .steps:before{left:33px;right:auto;top:10px;bottom:10px;border-top:0;border-left:1.5px dashed #57524b}
 .steps article{display:grid;grid-template-columns:68px 1fr;column-gap:18px}
 .steps .ib{grid-row:span 3;margin:0}
 .steps h3{font-size:22px}
 .team{grid-template-columns:1fr 1fr;gap:12px}
 .team .ph-i{height:180px}
 .team .b{padding:14px}
 .team h3{font-size:17px}
 .team p{display:none}
 .revs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -24px;padding:0 24px 6px;scrollbar-width:none}
 .revs article{flex:0 0 84%;scroll-snap-align:center}
 .ctab{padding:32px 22px;border-radius:24px}
 .ci{padding:26px 22px}
 .map{min-height:280px}
 .fab{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
 .mbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:8px 4px;border-radius:14px;background:var(--bg2)}
 .mbar a.w{background:#25d366;color:#fff}
 .mbar .ic{width:22px;height:22px}
 footer{padding-bottom:100px}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
 <span data-ic="pin" data-i="addr"></span>
 <span data-ic="clock" data-i="hours"></span>
 <a class="sp" data-href="ig" data-ic="ig" style="display:inline-flex;gap:6px;align-items:center">@lafamilia.kg</a>
 <a data-href="gis" data-ic="gis" style="display:inline-flex;gap:6px;align-items:center">2ГИС</a>
</div></div>

<header><div class="wrap nav">
 <a href="#" class="logo" aria-label="La Familia">
  <svg viewBox="0 0 40 40" fill="none"><path d="M6 19 20 7l14 12v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V19Z" fill="#c8643b"/><path d="M20 30s-6-3.6-6-8a3.4 3.4 0 0 1 6-2 3.4 3.4 0 0 1 6 2c0 4.4-6 8-6 8Z" fill="#fff"/></svg>
  <span>La <i>Familia</i></span>
 </a>
 <nav class="nav-links">
  <a href="#cat" data-i="nav_cat"></a><a href="#why" data-i="nav_why"></a><a href="#steps" data-i="nav_steps"></a><a href="#team" data-i="nav_team"></a><a href="#rev" data-i="nav_rev"></a><a href="#contacts" data-i="nav_contacts"></a>
 </nav>
 <div class="nav-r">
  <a class="ph" data-href="tel"><b data-phone></b><small data-i="open_now"></small></a>
  <div class="lang" role="group" aria-label="Язык"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
  <a class="btn wa" data-href="wa" data-ic="wa"><span>WhatsApp</span></a>
  <a class="telm" data-href="tel" aria-label="Позвонить" data-ic="phone"></a>
  <button class="burger" data-menu aria-label="Меню" data-ic="menu"></button>
 </div>
</div></header>

<main>
<section class="hero"><div class="wrap">
 <div class="rv">
  <span class="kick" data-i="hero_tag"></span>
  <h1 data-i="hero_h"></h1>
  <p data-i="hero_p"></p>
  <div class="cta">
   <a class="btn wa" data-href="wa" data-ic="wa"><span data-i="btn_wa"></span></a>
   <a class="btn line" href="#cat"><span data-i="btn_cat"></span></a>
  </div>
  <div class="facts">
   <div><b data-i="f1n"></b><span data-i="f1"></span></div>
   <div><b data-i="f2n"></b><span data-i="f2"></span></div>
   <div><b data-i="f3n"></b><span data-i="f3"></span></div>
  </div>
 </div>
 <div class="hv rv">
  <div class="main"><img src="https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=1100&q=75" alt="Гостиная La Familia"></div>
  <div class="sm"><img src="https://images.unsplash.com/photo-1567016432779-094069958ea5?auto=format&fit=crop&w=500&q=70" alt="Диван"></div>
  <a class="chip c1" data-href="gis"><span class="dot" data-ic="gis"></span><span><span class="stars" id="hs"></span><small data-i="rev_more"></small></span></a>
  <div class="chip c2"><span class="dot" data-ic="truck"></span><span data-i="btn_route" id="chip2"></span></div>
 </div>
</div></section>

<section id="why"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="why_k"></span><h2 data-i="why_h" style="margin-top:12px"></h2></div></div>
 <div class="adv" id="adv"></div>
</div></section>

<section id="cat"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="cat_k"></span><h2 data-i="cat_h" style="margin-top:12px"></h2><p class="sub" data-i="cat_p"></p></div>
  <a class="btn wa" data-href="wa" data-ic="wa"><span data-i="btn_wa"></span></a></div>
 <div class="bento rv" id="bento"></div>
</div></section>

<section id="steps"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="steps_k"></span><h2 data-i="steps_h" style="margin-top:12px"></h2><p class="sub" data-i="steps_p"></p></div></div>
 <div class="steps rv" id="stp"></div>
 <div class="steps-cta rv"><p data-i="cta_h"></p><a class="btn wa" data-href="wa" data-ic="wa"><span data-i="btn_wa"></span></a><a class="btn acc" data-href="tel" data-ic="phone"><span data-phone></span></a></div>
</div></section>

<section id="team"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="team_k"></span><h2 data-i="team_h" style="margin-top:12px"></h2><p class="sub" data-i="team_p"></p></div></div>
 <div class="team" id="tm"></div>
</div></section>

<section id="rev"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="rev_k"></span><h2 data-i="rev_h" style="margin-top:12px"></h2></div>
  <a class="gisbar" data-href="gis"><span class="stars" id="gs"></span><span data-i="rev_more"></span><span class="btn acc" style="padding:10px 14px" data-ic="arrow"></span></a></div>
 <div class="revs" id="rvs"></div>
</div></section>

<section id="lead"><div class="wrap">
 <div class="ctab rv">
  <div><span class="kick" data-i="cta_k"></span><h2 data-i="cta_h"></h2><p data-i="cta_p"></p></div>
  <form data-wa-form>
   <input name="name" data-ip="f_name" required autocomplete="name">
   <input name="phone" type="tel" data-ip="f_phone" required autocomplete="tel" inputmode="tel">
   <select name="room" id="room"></select>
   <button class="btn wa" type="submit" data-ic="wa"><span data-i="f_send"></span></button>
   <small data-i="f_note"></small>
  </form>
 </div>
</div></section>

<section id="contacts" style="padding-top:0"><div class="wrap ct">
 <div class="ci rv">
  <span class="kick" data-i="ct_k"></span><h2 data-i="ct_h"></h2><p class="sub" data-i="ct_p"></p>
  <ul>
   <li><span class="ib" data-ic="phone"></span><div><small data-i="lbl_phone"></small><a data-href="tel"><b data-phone></b></a></div></li>
   <li><span class="ib" data-ic="pin"></span><div><small data-i="lbl_addr"></small><b data-i="addr"></b></div></li>
   <li><span class="ib" data-ic="clock"></span><div><small data-i="lbl_hours"></small><b data-i="hours"></b></div></li>
  </ul>
  <div class="row">
   <a class="btn wa" data-href="wa" data-ic="wa"><span>WhatsApp</span></a>
   <a class="btn gis" data-href="gis" data-ic="gis"><span data-i="btn_2gis"></span></a>
   <a class="btn line" data-href="ig" data-ic="ig"><span>Instagram</span></a>
  </div>
 </div>
 <div class="map rv">
  <svg class="grid" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
   <rect width="600" height="420" fill="#ece5da"/>
   <g stroke="#fff" stroke-width="14" fill="none"><path d="M-20 140 L620 110"/><path d="M-20 300 L620 330"/><path d="M180 -20 L220 440"/><path d="M430 -20 L400 440"/></g>
   <g stroke="#fff" stroke-width="6" fill="none" opacity=".8"><path d="M-20 220 L620 215"/><path d="M80 -20 L110 440"/><path d="M310 -20 L305 440"/><path d="M520 -20 L540 440"/></g>
   <rect x="232" y="150" width="60" height="55" rx="6" fill="#dcd2c3"/><rect x="320" y="232" width="70" height="60" rx="6" fill="#dcd2c3"/><rect x="120" y="235" width="50" height="50" rx="6" fill="#cfe0c4"/><rect x="440" y="140" width="70" height="60" rx="6" fill="#cfe0c4"/>
  </svg>
  <div class="pin"><span>La Familia · Токомбаева 27/3</span><i></i></div>
  <a class="btn acc" data-href="gis" data-ic="gis"><span data-i="btn_route"></span></a>
 </div>
</div></section>
</main>

<footer><div class="wrap"><span data-i="foot"></span><a data-href="tel" data-phone></a></div></footer>

<a class="fab" data-href="wa" aria-label="WhatsApp" data-ic="wa"></a>
<nav class="mbar" aria-label="Быстрые действия">
 <a data-href="tel" data-ic="phone"><span data-i="btn_call"></span></a>
 <a class="w" data-href="wa" data-ic="wa"><span>WhatsApp</span></a>
 <a data-href="gis" data-ic="gis"><span>2ГИС</span></a>
</nav>

<script src="common.js"></script>
<script>
const {D,img,icon,stars,wa,t}=LF;
const $=id=>document.getElementById(id);
LF.init(l=>{
 $('hs').innerHTML=$('gs').innerHTML=stars();
 $('chip2').innerHTML=l==='ky'?'Эртең жеткирүү<small>Бишкек боюнча</small>':'Доставка завтра<small>по Бишкеку</small>';
 $('adv').innerHTML=D.adv.map((a,i)=>`<article class="rv"><span class="n">0${i+1}</span><div class="ib">${icon(a.ic)}</div><h3>${a[l][0]}</h3><p>${a[l][1]}</p></article>`).join('');
 $('bento').innerHTML=D.cats.map((c,i)=>`<a href="${wa(t('wa_cat')+' '+c[l][0])}" target="_blank" rel="noopener"><img src="${img(c.img,i?600:900)}" alt="${c[l][0]}" loading="lazy"><span class="go">${t('cat_more')} ${icon('arrow')}</span><h3>${c[l][0]}</h3><p>${c[l][1]}</p></a>`).join('');
 $('stp').innerHTML=D.steps.map((s,i)=>`<article><div class="ib">${icon(s.ic)}</div><small>0${i+1}</small><h3>${s[l][0]}</h3><p>${s[l][1]}</p></article>`).join('');
 $('tm').innerHTML=D.team.map(m=>`<article class="rv"><div class="ph-i"><img src="${img(m.img,500)}" alt="${m[l][0]}" loading="lazy"></div><div class="b"><h3>${m[l][0]}</h3><span class="role">${m[l][1]}</span><p>${m[l][2]}</p></div></article>`).join('');
 $('rvs').innerHTML=D.reviews.map((r,i)=>`<article class="rv">${stars()}<p>${r[l]}</p><div class="who"><span class="av" style="background:${['#c8643b','#8a9a5b','#3f6e8c','#b0865a'][i]}">${r.n[0]}</span><div><b>${r.n}</b><small>${r.p} · 2ГИС</small></div></div></article>`).join('');
 $('room').innerHTML=`<option value="">${t('f_room')}</option>`+D.cats.map(c=>`<option>${c[l][0]}</option>`).join('');
});
</script>
</body>
</html>
