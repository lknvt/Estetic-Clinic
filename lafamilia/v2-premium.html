<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Familia — Премиальная мебель · Бишкек</title>
<meta name="description" content="La Familia KG — мебельный салон в Бишкеке: диваны, спальни, детские, кухни. Доставка, сборка, рассрочка 0%.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121110;--bg2:#1a1917;--card:#211f1c;--ink:#efe8dc;--mut:#a59d90;--line:#34302a;--gold:#c9a45c;--gold2:#e3c68a;--r:6px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.ic{width:1.2em;height:1.2em;flex:none}
.wrap{max-width:1260px;margin:auto;padding:0 28px}
h1,h2,h3,.strip b,.adv .n,.st b{font-variant-numeric:lining-nums}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.02;letter-spacing:-.01em}
h2{font-size:clamp(36px,4.2vw,58px)}
em{font-style:italic;color:var(--gold2)}
.kick{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600;display:block;margin-bottom:14px}
.sub{color:var(--mut);max-width:500px;margin-top:12px;font-size:16px}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;font:600 14px Inter,sans-serif;letter-spacing:.04em;padding:16px 26px;border-radius:var(--r);transition:.25s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408}
.btn.gold:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn.wa{background:#25d366;color:#fff}
.btn.wa:hover{background:#1fbd5a;transform:translateY(-2px)}
.btn.ghost{border:1px solid rgba(239,232,220,.35);color:var(--ink);background:rgba(18,17,16,.25);backdrop-filter:blur(6px)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
section{padding:80px 0;scroll-margin-top:70px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:40;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.s{background:rgba(18,17,16,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.nav{display:flex;align-items:center;gap:30px;height:78px}
.logo{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:10px}
.logo b{width:38px;height:38px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:20px;border-radius:50%;font-weight:600}
.nav-links{display:flex;gap:26px;font-size:14px;color:#cfc7ba;white-space:nowrap}
.nav-links a{position:relative}
.nav-links a:after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1px;background:var(--gold);transition:right .3s}
.nav-links a:hover:after{right:0}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.ph{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.ph .ic{color:var(--gold);width:20px;height:20px}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r)}
.lang button{border:0;background:none;cursor:pointer;color:var(--mut);font:600 12px Inter;padding:8px 11px;letter-spacing:.06em}
.lang button.on{color:#1a1408;background:var(--gold)}
.nav .btn{padding:12px 18px}
.burger{display:none;border:0;background:none;color:var(--ink);cursor:pointer}
.burger .ic{width:28px;height:28px}
.telm{display:none}
/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:110px 0 150px;isolation:isolate;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:kb 18s ease-out forwards}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(12,11,10,.92) 0%,rgba(12,11,10,.7) 42%,rgba(12,11,10,.15) 100%),linear-gradient(0deg,rgba(12,11,10,.9),transparent 40%)}
.hero h1{font-size:clamp(46px,6.6vw,96px);max-width:760px;margin:6px 0 22px}
.hero p{max-width:520px;font-size:18px;color:#d3cbbe}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.strip{position:absolute;left:0;right:0;bottom:0;border-top:1px solid rgba(239,232,220,.14);background:rgba(18,17,16,.55);backdrop-filter:blur(10px)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.strip div{padding:22px 0;display:flex;align-items:center;gap:14px}
.strip div+div{padding-left:26px;border-left:1px solid rgba(239,232,220,.14)}
.strip b{font-family:"Cormorant Garamond",serif;font-size:38px;color:var(--gold2);font-weight:500;line-height:1}
.strip span{font-size:13px;color:#c8bfb1;line-height:1.3}
.strip a{font-weight:600}
.strip .ic{width:28px;height:28px;color:var(--gold)}
.stars{display:inline-flex;gap:2px;color:var(--gold2)}
.stars .ic{width:14px;height:14px}
/* advantages */
.adv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.adv article{padding:38px 30px 40px;position:relative;transition:background .4s}
.adv article+article{border-left:1px solid var(--line)}
.adv article:hover{background:var(--bg2)}
.adv .n{font-family:"Cormorant Garamond",serif;font-size:64px;color:transparent;-webkit-text-stroke:1px var(--gold);line-height:1;display:block;margin-bottom:26px}
.adv .ic{position:absolute;top:40px;right:30px;width:30px;height:30px;color:var(--gold)}
.adv h3{font-size:28px;margin-bottom:10px}
.adv p{font-size:14.5px;color:var(--mut)}
/* catalog accordion */
#cat{background:var(--bg2)}
.acc{display:flex;gap:10px;height:480px}
.acc a{position:relative;flex:1;border-radius:var(--r);overflow:hidden;transition:flex .7s cubic-bezier(.2,.7,.2,1);isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;min-width:0}
.acc a.on,.acc:hover a:hover{flex:3.2}
.acc:hover a.on:not(:hover){flex:1}
.acc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.85)}
.acc a:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(10,9,8,.92),rgba(10,9,8,.15) 60%)}
.acc .num{position:absolute;top:20px;left:22px;font-size:12px;letter-spacing:.2em;color:var(--gold2)}
.acc h3{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc h3 .lg{display:none}.acc a.on h3 .lg,.acc:hover a:hover h3 .lg{display:inline}.acc a.on h3 .sh,.acc:hover a:hover h3 .sh{display:none}
.acc:hover a.on:not(:hover) h3 .lg{display:none}.acc:hover a.on:not(:hover) h3 .sh{display:inline}
.acc .more{max-height:0;opacity:0;overflow:hidden;transition:max-height .6s,opacity .4s}
.acc a.on .more,.acc:hover a:hover .more{max-height:120px;opacity:1}
.acc:hover a.on:not(:hover) .more{max-height:0;opacity:0}
.acc p{color:#cfc7ba;font-size:14px;margin:8px 0 14px}
.acc .go{display:inline-flex;align-items:center;gap:8px;color:var(--gold2);font-weight:600;font-size:14px;border-bottom:1px solid var(--gold);padding-bottom:3px}
/* steps */
.sg{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:center}
.sg .pic{position:relative;height:560px;border-radius:var(--r);overflow:hidden}
.sg .pic img{width:100%;height:100%;object-fit:cover}
.sg .pic .badge{position:absolute;left:24px;bottom:24px;right:24px;background:rgba(18,17,16,.8);backdrop-filter:blur(10px);padding:18px 22px;border-left:2px solid var(--gold);display:flex;align-items:center;gap:14px;font-size:15px}
.sg .pic .badge .ic{color:var(--gold);width:28px;height:28px}
.st{list-style:none;margin-top:30px}
.st li{display:grid;grid-template-columns:70px 1fr;gap:18px;padding:20px 0;border-top:1px solid var(--line);align-items:start;transition:padding .3s}
.st li:hover{padding-left:10px}
.st li:last-child{border-bottom:1px solid var(--line)}
.st b{font-family:"Cormorant Garamond",serif;font-size:46px;line-height:.9;color:var(--gold);font-weight:500}
.st h3{font-size:27px}
.st p{color:var(--mut);font-size:14.5px}
/* team */
#team{background:var(--bg2)}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
.team article{text-align:center}
.team .fr{height:300px;border-radius:200px 200px var(--r) var(--r);overflow:hidden;border:1px solid var(--line);padding:8px;margin-bottom:18px;transition:border-color .3s}
.team img{width:100%;height:100%;object-fit:cover;object-position:center 25%;border-radius:200px 200px 2px 2px;filter:grayscale(1) contrast(1.05);transition:filter .6s}
.team article:hover img{filter:none}
.team article:hover .fr{border-color:var(--gold)}
.team h3{font-size:26px}
.team .role{color:var(--gold);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin:6px 0 6px;display:block}
.team p{color:var(--mut);font-size:14px}
/* reviews */
.rg{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.big{background:linear-gradient(160deg,#2a251d,#1a1815);border:1px solid var(--line);border-radius:var(--r);padding:44px;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.big:before{content:"“";position:absolute;top:-10px;right:30px;font-family:"Cormorant Garamond",serif;font-size:200px;line-height:1;color:var(--gold);opacity:.25}
.big p{font-family:"Cormorant Garamond",serif;font-size:32px;line-height:1.25;font-style:italic}
.who{display:flex;align-items:center;gap:14px}
.av{width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);color:var(--gold2);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:24px}
.who b{display:block}.who small{color:var(--mut);font-size:13px}
.sm{display:grid;gap:14px}
.sm article{background:var(--card);border-radius:var(--r);padding:22px 24px;border:1px solid var(--line);display:grid;gap:10px}
.sm p{font-size:14.5px;color:#d8d0c3}
.sm .who .av{width:38px;height:38px;font-size:19px}
.sm .top{display:flex;justify-content:space-between;align-items:center}
/* cta */
.lead{position:relative;isolation:isolate;padding:90px 0;overflow:hidden}
.lead>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.lead:after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(12,11,10,.78)}
.lead .wrap{display:grid;grid-template-columns:1fr 440px;gap:60px;align-items:center}
.lead p{color:#d3cbbe;font-size:17px;margin-top:14px;max-width:480px}
form{display:grid;gap:12px;background:rgba(26,25,23,.75);backdrop-filter:blur(12px);border:1px solid rgba(201,164,92,.35);padding:30px;border-radius:var(--r)}
input,select{width:100%;font:500 15px Inter;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:#141311;color:var(--ink);outline:none}
input::placeholder{color:#8c8478}
input:focus,select:focus{border-color:var(--gold)}
form .btn{width:100%}
form small{color:var(--mut);font-size:12.5px;text-align:center}
/* contacts */
.ct{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.ci ul{list-style:none;margin:30px 0;display:grid}
.ci li{display:flex;gap:16px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.ci li:last-child{border-bottom:1px solid var(--line)}
.ci li .ic{width:24px;height:24px;color:var(--gold)}
.ci li small{display:block;color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.ci li b{font-size:18px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.map{position:relative;border-radius:var(--r);overflow:hidden;min-height:440px;border:1px solid var(--line);background:#191816}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:50%;top:45%;transform:translate(-50%,-100%);text-align:center}
.map .pin span{display:block;background:var(--gold);color:#1a1408;font-weight:700;font-size:14px;padding:10px 16px;border-radius:var(--r);white-space:nowrap}
.map .pin i{display:block;width:16px;height:16px;margin:10px auto 0;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 10px rgba(201,164,92,.2),0 0 0 22px rgba(201,164,92,.08)}
.map .btn{position:absolute;right:20px;bottom:20px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mut);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fab{position:fixed;right:26px;bottom:26px;z-index:30;display:flex;align-items:center;gap:10px;background:#25d366;color:#fff;font-weight:600;padding:14px 20px 14px 16px;border-radius:99px;box-shadow:0 14px 30px -10px rgba(37,211,102,.7)}
.fab .ic{width:26px;height:26px}
.mbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1300px){.nav-links{display:none}.burger{display:block}body.menu-open header{background:var(--bg)}body.menu-open .nav-links{display:flex;flex-direction:column;position:absolute;top:78px;left:0;right:0;background:var(--bg);padding:20px 28px 30px;font-size:18px;gap:20px;border-bottom:1px solid var(--line)}}
@media(max-width:1140px){
 .nav-links{display:none}.burger{display:block}
 body.menu-open header{background:var(--bg)}
 body.menu-open .nav-links{display:flex;flex-direction:column;position:absolute;top:78px;left:0;right:0;background:var(--bg);padding:20px 28px 30px;font-size:18px;gap:20px;border-bottom:1px solid var(--line)}
 .adv,.team{grid-template-columns:repeat(2,minmax(0,1fr))}
 .adv article:nth-child(3){border-left:0}
 .adv article:nth-child(n+3){border-top:1px solid var(--line)}
}
@media(max-width:820px){
 .wrap{padding:0 20px}
 section{padding:60px 0}
 .nav{height:64px;gap:12px}
 .nav .ph,.nav .btn{display:none}
 body.menu-open .nav-links{top:64px}
 .logo{font-size:25px}.logo b{width:32px;height:32px;font-size:17px}
 .telm{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1a1408}
 .hero{padding:96px 0 230px;align-items:flex-start}
 .hero:after{background:linear-gradient(180deg,rgba(12,11,10,.75),rgba(12,11,10,.55) 45%,rgba(12,11,10,.95))}
 .hero p{font-size:16px}
 .cta .btn{flex:1 1 100%}
 .strip .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .strip div{flex-direction:column;align-items:flex-start;gap:4px!important}
 .strip div{padding:14px 0;gap:10px}
 .strip div+div{padding-left:0;border-left:0}
 .strip div:nth-child(even){padding-left:16px;border-left:1px solid rgba(239,232,220,.14)}
 .strip b{font-size:28px}
 .adv article{padding:24px 18px}
 .adv .n{font-size:44px;margin-bottom:14px}
 .adv .ic{top:24px;right:18px;width:24px;height:24px}
 .adv h3{font-size:22px}
 .acc{flex-direction:column;height:auto}
 .acc a,.acc a.on,.acc:hover a:hover{flex:none;height:150px;padding:18px}
 .acc a.on{height:240px}
 .acc .more{max-height:0!important;opacity:0!important}
 .acc a.on .more{max-height:120px!important;opacity:1!important}
 .acc h3{font-size:26px}
 .acc h3 .lg{display:inline!important}.acc h3 .sh{display:none!important}
 .sg{grid-template-columns:1fr;gap:30px}
 .sg .pic{height:260px;order:2}
 .team{gap:14px}
 .team .fr{height:210px;padding:5px}
 .team h3{font-size:21px}
 .team p{display:none}
 .team .role{font-size:10px;letter-spacing:.1em}
 .rg,.lead .wrap,.ct{grid-template-columns:minmax(0,1fr)}
 .big{padding:28px 22px}
 .big p{font-size:24px}
 .lead{padding:60px 0}
 .lead .wrap{gap:28px}
 form{padding:20px}
 .map{min-height:300px}
 .fab{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(18,17,16,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
 .mbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:8px 4px;border-radius:var(--r);border:1px solid var(--line)}
 .mbar a.w{background:#25d366;border-color:#25d366;color:#fff}
 .mbar .ic{width:22px;height:22px;color:var(--gold)}
 .mbar a.w .ic{color:#fff}
 footer{padding-bottom:100px}
}
</style>
</head>
<body>
<header id="hd"><div class="wrap nav">
 <a href="#" class="logo"><b>F</b>La Familia</a>
 <nav class="nav-links">
  <a href="#cat" data-i="nav_cat"></a><a href="#why" data-i="nav_why"></a><a href="#steps" data-i="nav_steps"></a><a href="#team" data-i="nav_team"></a><a href="#rev" data-i="nav_rev"></a><a href="#contacts" data-i="nav_contacts"></a>
 </nav>
 <div class="nav-r">
  <a class="ph" data-href="tel" data-ic="phone"><span data-phone></span></a>
  <div class="lang" role="group" aria-label="Язык"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
  <a class="btn gold" data-href="wa" data-ic="wa"><span>WhatsApp</span></a>
  <a class="telm" data-href="tel" aria-label="Позвонить" data-ic="phone"></a>
  <button class="burger" data-menu aria-label="Меню" data-ic="menu"></button>
 </div>
</div></header>

<main>
<section class="hero">
 <img src="img/1600210492486-724fe5c67fb0.jpg" alt="Интерьер с мебелью La Familia">
 <div class="wrap rv">
  <span class="kick" data-i="hero_tag"></span>
  <h1 data-i="hero_h"></h1>
  <p data-i="hero_p"></p>
  <div class="cta">
   <a class="btn wa" data-href="wa" data-ic="wa"><span data-i="btn_wa"></span></a>
   <a class="btn ghost" href="#cat"><span data-i="btn_cat"></span></a>
  </div>
 </div>
 <div class="strip"><div class="wrap">
  <div><b data-i="f1n"></b><span data-i="f1"></span></div>
  <div><b data-i="f2n"></b><span data-i="f2"></span></div>
  <div><b data-i="f3n"></b><span data-i="f3"></span></div>
  <div><a data-href="gis" style="display:flex;gap:12px;align-items:center"><span data-ic="gis" style="display:flex"></span><span><span class="stars" id="hs"></span><br><span data-i="rev_more"></span></span></a></div>
 </div></div>
</section>

<section id="why"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="why_k"></span><h2 data-i="why_h"></h2></div></div>
 <div class="adv rv" id="adv"></div>
</div></section>

<section id="cat"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="cat_k"></span><h2 data-i="cat_h"></h2><p class="sub" data-i="cat_p"></p></div>
  <a class="btn gold" data-href="wa" data-ic="wa"><span data-i="btn_wa"></span></a></div>
 <div class="acc rv" id="acc"></div>
</div></section>

<section id="steps"><div class="wrap sg">
 <div class="pic rv"><img src="img/1616594039964-ae9021a400a0.jpg" alt="Спальня" loading="lazy">
  <div class="badge" data-ic="truck"><span id="sbadge"></span></div></div>
 <div class="rv"><span class="kick" data-i="steps_k"></span><h2 data-i="steps_h"></h2><p class="sub" data-i="steps_p"></p><ul class="st" id="stp"></ul></div>
</div></section>

<section id="team"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="team_k"></span><h2 data-i="team_h"></h2><p class="sub" data-i="team_p"></p></div></div>
 <div class="team" id="tm"></div>
</div></section>

<section id="rev"><div class="wrap">
 <div class="head rv"><div><span class="kick" data-i="rev_k"></span><h2 data-i="rev_h"></h2></div>
  <a class="btn ghost" data-href="gis" data-ic="gis"><span data-i="rev_more"></span></a></div>
 <div class="rg rv" id="rvs"></div>
</div></section>

<section class="lead" id="lead">
 <img src="img/1556228453-efd6c1ff04f6.jpg" alt="" loading="lazy">
 <div class="wrap">
  <div class="rv"><span class="kick" data-i="cta_k"></span><h2 data-i="cta_h"></h2><p data-i="cta_p"></p></div>
  <form data-wa-form class="rv">
   <input name="name" data-ip="f_name" required autocomplete="name">
   <input name="phone" type="tel" data-ip="f_phone" required autocomplete="tel" inputmode="tel">
   <select name="room" id="room"></select>
   <button class="btn gold" type="submit" data-ic="wa"><span data-i="f_send"></span></button>
   <small data-i="f_note"></small>
  </form>
 </div>
</section>

<section id="contacts"><div class="wrap ct">
 <div class="ci rv">
  <span class="kick" data-i="ct_k"></span><h2 data-i="ct_h"></h2><p class="sub" data-i="ct_p"></p>
  <ul>
   <li data-ic="phone"><div><small data-i="lbl_phone"></small><a data-href="tel"><b data-phone></b></a></div></li>
   <li data-ic="pin"><div><small data-i="lbl_addr"></small><b data-i="addr"></b></div></li>
   <li data-ic="clock"><div><small data-i="lbl_hours"></small><b data-i="hours"></b></div></li>
  </ul>
  <div class="row">
   <a class="btn wa" data-href="wa" data-ic="wa"><span>WhatsApp</span></a>
   <a class="btn ghost" data-href="gis" data-ic="gis"><span data-i="btn_2gis"></span></a>
   <a class="btn ghost" data-href="ig" data-ic="ig"><span>Instagram</span></a>
  </div>
 </div>
 <div class="map rv">
  <svg viewBox="0 0 600 440" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
   <g stroke="#2a2723" stroke-width="16" fill="none"><path d="M-20 150 L620 120"/><path d="M-20 320 L620 345"/><path d="M190 -20 L230 460"/><path d="M440 -20 L410 460"/></g>
   <g stroke="#24211e" stroke-width="6" fill="none"><path d="M-20 235 L620 230"/><path d="M90 -20 L120 460"/><path d="M320 -20 L315 460"/><path d="M530 -20 L550 460"/></g>
   <path d="M-20 150 L620 120" stroke="#c9a45c" stroke-width="2" opacity=".5"/>
   <rect x="245" y="160" width="58" height="55" rx="3" fill="#221f1b"/><rect x="330" y="245" width="66" height="60" rx="3" fill="#221f1b"/><rect x="128" y="250" width="48" height="50" rx="3" fill="#1e2a1f"/>
  </svg>
  <div class="pin"><span>La Familia · Токомбаева 27/3</span><i></i></div>
  <a class="btn gold" data-href="gis" data-ic="gis"><span data-i="btn_route"></span></a>
 </div>
</div></section>
</main>

<footer><div class="wrap"><span data-i="foot"></span><a data-href="tel" data-phone></a></div></footer>

<a class="fab" data-href="wa" data-ic="wa"><span>WhatsApp</span></a>
<nav class="mbar" aria-label="Быстрые действия">
 <a data-href="tel" data-ic="phone"><span data-i="btn_call"></span></a>
 <a class="w" data-href="wa" data-ic="wa"><span>WhatsApp</span></a>
 <a data-href="gis" data-ic="gis"><span>2ГИС</span></a>
</nav>

<script src="common.js"></script>
<script>
const {D,img,icon,stars,wa,t}=LF;
const $=id=>document.getElementById(id);
const hd=$('hd');addEventListener('scroll',()=>hd.classList.toggle('s',scrollY>40),{passive:true});
let openCat=0;
LF.init(l=>{
 $('hs').innerHTML=stars();
 $('sbadge').innerHTML=l==='ky'?'Бишкек боюнча эртең жеткирүү жана акысыз куроо':'Доставка завтра и сборка по Бишкеку';
 $('adv').innerHTML=D.adv.map((a,i)=>`<article><span class="n">0${i+1}</span>${icon(a.ic)}<h3>${a[l][0]}</h3><p>${a[l][1]}</p></article>`).join('');
 $('acc').innerHTML=D.cats.map((c,i)=>`<a href="${wa(t('wa_cat')+' '+c[l][0])}" target="_blank" rel="noopener" class="${i===openCat?'on':''}" data-k="${i}"><img src="${img(c.img,900)}" alt="${c[l][0]}" loading="lazy"><span class="num">0${i+1}</span><h3><span class="lg">${c[l][0]}</span><span class="sh">${c[l][2]}</span></h3><div class="more"><p>${c[l][1]}</p><span class="go">${t('cat_more')} ${icon('arrow')}</span></div></a>`).join('');
 $('stp').innerHTML=D.steps.map((s,i)=>`<li><b>0${i+1}</b><div><h3>${s[l][0]}</h3><p>${s[l][1]}</p></div></li>`).join('');
 $('tm').innerHTML=D.team.map(m=>`<article class="rv"><div class="fr"><img src="${img(m.img,500)}" alt="${m[l][0]}" loading="lazy"></div><h3>${m[l][0]}</h3><span class="role">${m[l][1]}</span><p>${m[l][2]}</p></article>`).join('');
 const R=D.reviews,who=r=>`<div class="who"><span class="av">${r.n[0]}</span><div><b>${r.n}</b><small>${r.p} · 2ГИС</small></div></div>`;
 $('rvs').innerHTML=`<article class="big">${stars()}<p>«${R[0][l]}»</p>${who(R[0])}</article><div class="sm">${R.slice(1).map(r=>`<article><div class="top">${who(r)}${stars()}</div><p>${r[l]}</p></article>`).join('')}</div>`;
 $('room').innerHTML=`<option value="">${t('f_room')}</option>`+D.cats.map(c=>`<option>${c[l][0]}</option>`).join('');
});
// mobile: first tap on a catalog panel expands it, second tap opens WhatsApp
$('acc').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;
 if(matchMedia('(max-width:820px)').matches&&!a.classList.contains('on')){e.preventDefault();openCat=+a.dataset.k;$('acc').querySelectorAll('a').forEach(x=>x.classList.toggle('on',x===a));}});
</script>
</body>
</html>
