<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estetic Clinic — 3 варианта дизайна</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;font-family:system-ui,sans-serif;background:#1a1d4d}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1a1d4d;color:#fff;flex-wrap:wrap}
.bar b{font-size:15px;margin-right:6px;white-space:nowrap}
.bar b i{color:#f28a1f;font-style:normal}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tabs button{border:0;cursor:pointer;font:600 14px system-ui;padding:9px 16px;border-radius:99px;background:#ffffff1f;color:#fff;transition:.2s}
.tabs button:hover{background:#ffffff38}
.tabs button.on{background:#f28a1f}
.dev{display:flex;gap:4px}
.dev button{border:0;cursor:pointer;background:#ffffff1f;color:#fff;font-size:16px;padding:7px 11px;border-radius:10px}
.dev button.on{background:#fff;color:#1a1d4d}
.stage{flex:1;display:flex;justify-content:center;background:#0d0f2b;min-height:0}
iframe{border:0;width:100%;height:100%;background:#fff;transition:width .3s}
.stage.m iframe{width:390px;max-width:100%;border-radius:18px;margin:10px 0;height:calc(100% - 20px)}
@media(max-width:700px){.dev{display:none}}
</style>
</head>
<body>
<div class="bar">
 <b>Estetic <i>Clinic</i></b>
 <div class="tabs" id="tabs">
  <button data-f="variant-1-bold.html">1 · Bold Brand</button>
  <button data-f="variant-2-noir.html">2 · Ivory Luxe</button>
  <button data-f="variant-3-stories.html">3 · Stories &amp; Friendly</button>
 </div>
 <div class="dev"><button id="d" class="on" title="Компьютер">🖥</button><button id="m" title="Телефон">📱</button></div>
</div>
<div class="stage" id="stage"><iframe id="fr" title="Вариант дизайна"></iframe></div>
<script>
const $=s=>document.querySelector(s),btns=[...document.querySelectorAll('#tabs button')];
function show(i){btns.forEach((b,k)=>b.classList.toggle('on',k===i));$('#fr').src=btns[i].dataset.f;try{localStorage.setItem('ec-v',i)}catch(e){}}
btns.forEach((b,i)=>b.onclick=()=>show(i));
$('#d').onclick=()=>{$('#stage').classList.remove('m');$('#d').classList.add('on');$('#m').classList.remove('on')};
$('#m').onclick=()=>{$('#stage').classList.add('m');$('#m').classList.add('on');$('#d').classList.remove('on')};
let s=0;try{s=+localStorage.getItem('ec-v')||0}catch(e){}
show(s);
</script>
</body>
</html>
