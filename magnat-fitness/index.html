<title>Magnat Fitness Концепции</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,600;0,800;0,900;1,800;1,900&family=Onest:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Golos+Text:wght@400;500;600;700&family=Tilt+Neon&display=swap">
<style>
/* Layout: fixed concept switcher; three brand concepts (black · neon red · white) with sticky headers, compact one-screen sections, scroll reveals; mobile gets a bottom call / WhatsApp / 2GIS bar */
:root{
  --bar-h:56px; --sw-bg:#070707; --sw-fg:#eeeeee; --sw-mut:#8a8a8a;
  --brand-red:#e3161e; --neon:#ff2b2b;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:#0a0a0b;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
img,svg{max-width:100%;display:block}
:focus-visible{outline:2px solid #ff5b5b;outline-offset:3px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sw-bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Switcher ===== */
.sw{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:60;background:var(--sw-bg);color:var(--sw-fg);border-bottom:1px solid #1f1f1f;font-family:'Onest',system-ui,sans-serif}
.sw .wrap{height:var(--bar-h);display:flex;align-items:center;gap:14px;max-width:none}
.sw-brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sw-mut);white-space:nowrap}
.sw-brand b{color:#fff}
.sw-tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.sw-tabs::-webkit-scrollbar{display:none}
.sw-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid #2a2a2a;background:transparent;color:var(--sw-fg);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s,border-color .2s}
.sw-tab i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-style:normal;font-size:11px;font-weight:800;background:var(--brand-red);color:#fff}
.sw-tab small{font-weight:500;color:var(--sw-mut);font-size:11px}
.sw-tab:hover{border-color:#555}
.sw-tab[aria-pressed="true"]{background:#fff;color:#0a0a0a;border-color:#fff}
.sw-tab[aria-pressed="true"] small{color:#555}
.sw-lang{display:flex;border:1px solid #2a2a2a;border-radius:999px;padding:3px;flex:0 0 auto}
.sw-lang button{border:0;background:transparent;color:var(--sw-mut);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700}
.sw-lang button[aria-pressed="true"]{background:var(--brand-red);color:#fff}
@media (max-width:860px){.sw-brand{display:none}.sw-tabs{justify-content:flex-start}.sw-tab small{display:none}}

#app{padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px))}
.v section{scroll-margin-top:140px}
.v .hdr{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));z-index:40}
.v .hdr .wrap{display:flex;align-items:center;gap:22px;height:70px}
.v .nav{display:flex;gap:22px;flex:1;justify-content:center;font-size:14px;font-weight:600}
.v .nav a{position:relative;opacity:.72;transition:opacity .2s}
.v .nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--brand-red);transform:scaleX(0);transition:transform .25s}
.v .nav a:hover{opacity:1}.v .nav a:hover::after{transform:scaleX(1)}
.v .hphone{display:flex;flex-direction:column;line-height:1.15;text-align:right;white-space:nowrap}
.v .hphone small{font-size:11px;opacity:.65}
.v .hphone b{font-size:16px;font-variant-numeric:tabular-nums}
.logo{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.logo svg{width:46px;height:46px}
.logo b{font:800 14px/1.05 'Unbounded',sans-serif;letter-spacing:.14em}
.logo b small{display:block;font:600 9.5px 'Onest',sans-serif;letter-spacing:.32em;opacity:.6;margin-top:3px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 22px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .18s cubic-bezier(.2,.7,.2,1),background .2s,box-shadow .25s,border-color .2s;overflow:hidden}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.btn-red{background:var(--brand-red);color:#fff;box-shadow:0 10px 30px -8px rgba(227,22,30,.65)}
.btn-red:hover{box-shadow:0 14px 40px -6px rgba(255,43,43,.85)}
.btn-red::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:12px;opacity:.6;margin:0}
.stars{display:flex;gap:2px;color:#ffb21e}
.stars svg{width:15px;height:15px;fill:currentColor}
.copy{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;opacity:.7}
.copy:hover{opacity:1}
.who{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:14px}
.who i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px;background:var(--brand-red);color:#fff;flex:0 0 auto}
.who small{display:block;opacity:.6;font-size:12px}
.res{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(227,22,30,.12);color:var(--brand-red)}
.photo{position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.cred{position:absolute;right:10px;bottom:8px;font-size:10px;color:#fff;opacity:.75;text-shadow:0 1px 3px #000}

/* reveal: content is visible at rest; animation plays when a block enters the viewport */
.rv.in{animation:rise .85s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
.neon{color:var(--neon);text-shadow:0 0 4px rgba(255,80,80,.9),0 0 14px rgba(255,43,43,.8),0 0 38px rgba(255,43,43,.55),0 0 80px rgba(255,43,43,.35);animation:flick 6s infinite}
@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.45}}
.tick{overflow:hidden;white-space:nowrap}
.tick>div{display:inline-flex;animation:tick 30s linear infinite}
.tick span{padding-right:44px}
@keyframes tick{to{transform:translateX(-50%)}}

/* neon tubes & signs */
.nsign{font-family:'Tilt Neon','Onest',sans-serif;font-weight:400;color:#fff4f4;letter-spacing:.04em;line-height:1;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 7px #ff4a4a,0 0 16px #ff2020,0 0 34px #ff1a1a,0 0 64px #e3161e;animation:flick 7s infinite}
.nsign.w{color:#fff;text-shadow:0 0 2px #fff,0 0 9px #fff,0 0 22px rgba(255,255,255,.75),0 0 48px rgba(255,90,90,.55)}
.nbox{border:2px solid #ff5a5a;box-shadow:0 0 6px #ff2b2b,0 0 22px rgba(255,43,43,.6),inset 0 0 10px rgba(255,43,43,.45);animation:hum 3s ease-in-out infinite}
@keyframes hum{50%{box-shadow:0 0 4px #ff2b2b,0 0 12px rgba(255,43,43,.4),inset 0 0 6px rgba(255,43,43,.3)}}
.ntube{display:block;height:4px;border-radius:4px;background:#ff5252;box-shadow:0 0 6px #ff2b2b,0 0 16px #e3161e,0 0 34px rgba(227,22,30,.6)}
.pic{position:relative;overflow:hidden}
.pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.pic:hover>img{transform:scale(1.06)}

/* Floating + mobile bar */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:column;gap:10px}
.fab a{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .2s;position:relative}
.fab a:hover{transform:scale(1.08)}
.fab .wa{background:#25d366;color:#fff}
.fab .wa::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:ping 2.2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.fab .gis{background:#19aa4c;color:#fff;font:800 13px 'Onest',sans-serif}
.fab .tel{background:var(--brand-red);color:#fff}
.fab svg{width:26px;height:26px}
.mbar{display:none}
@media (max-width:860px){
  .fab{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--mb-bg);border-top:1px solid var(--mb-line)}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;font:700 12px 'Onest',sans-serif;color:var(--mb-fg);background:var(--mb-btn)}
  .mbar a.wa{background:#25d366;color:#fff}
  .mbar a.tel{background:var(--brand-red);color:#fff}
  .mbar a svg{width:20px;height:20px}
  .v{padding-bottom:84px}
  .v .nav,.v .hphone{display:none}
  .v .hdr .wrap{height:62px;gap:12px;justify-content:space-between}
  .v .hdr .btn{padding:10px 14px;font-size:13px}
  .logo svg{width:40px;height:40px}
}
.map{display:block;border-radius:22px;overflow:hidden;position:relative;min-height:300px}
.map>svg{width:100%;height:100%;position:absolute;inset:0}
.map span{position:absolute;left:16px;bottom:16px;background:#19aa4c;color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:10px;display:flex;gap:8px;align-items:center}
.map span svg{width:18px;height:18px}
.map .pinp{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* =================== 1 · NEON CLUB =================== */
.v-neon{--bg:#0a0a0b;--s1:#131314;--s2:#1b1b1d;--line:#2a2a2d;--fg:#f6f6f5;--mut:#a0a0a6;--red:#e3161e;
  background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;color-scheme:dark;
  --mb-bg:#0a0a0b;--mb-line:#2a2a2d;--mb-fg:#f6f6f5;--mb-btn:#1b1b1d}
.v-neon .disp{font-family:'Unbounded','Manrope',sans-serif;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.v-neon .hdr{background:rgba(10,10,11,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.v-neon .hphone b{color:#fff}
.v-neon .btn-gh{border-color:var(--line);background:rgba(255,255,255,.04);color:var(--fg)}
.v-neon .btn-gh:hover{border-color:var(--red)}
.n-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);isolation:isolate}
.n-rings{position:absolute;inset:-40px 0 auto;height:260px;perspective:700px;pointer-events:none;z-index:1}
.n-rings i{position:absolute;left:50%;top:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.9),0 0 40px rgba(255,255,255,.35),inset 0 0 12px rgba(255,255,255,.6);transform:translateX(-50%) rotateX(76deg);animation:breathe 5s ease-in-out infinite}
.n-rings i:nth-child(1){width:520px;height:520px;margin-left:-260px;top:-150px}
.n-rings i:nth-child(2){width:300px;height:300px;margin-left:330px;top:-60px;animation-delay:-1.6s}
.n-rings i:nth-child(3){width:220px;height:220px;margin-left:-620px;top:-30px;animation-delay:-3.2s}
@keyframes breathe{50%{opacity:.55;box-shadow:0 0 6px rgba(255,255,255,.6),0 0 20px rgba(255,255,255,.2),inset 0 0 6px rgba(255,255,255,.4)}}
.n-photo{position:absolute;right:0;top:0;bottom:0;width:56%;z-index:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 38%);mask-image:linear-gradient(90deg,transparent,#000 38%)}
.n-photo img{width:100%;height:100%;object-fit:cover;object-position:60% 40%;animation:kb 22s ease-in-out infinite alternate;filter:saturate(1.1) contrast(1.05)}
@keyframes kb{to{transform:scale(1.12) translate(-2%,1%)}}
.n-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,.2),rgba(10,10,11,.75)),radial-gradient(70% 60% at 70% 60%,rgba(227,22,30,.25),transparent)}
.n-hero .wrap{position:relative;z-index:2;padding-block:120px 54px;min-height:min(690px,calc(100vh - 126px));display:flex;flex-direction:column;justify-content:center}
.n-kick{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#fff}
.n-kick::before{content:"";width:28px;height:2px;background:var(--red);box-shadow:0 0 10px var(--red)}
.n-hero h1{font-size:clamp(36px,5.6vw,82px);line-height:1;margin:20px 0 22px;max-width:11.5em;text-wrap:balance}
.n-hero p.lead{font-size:18px;line-height:1.55;color:#cfcfd3;max-width:31em;margin:0 0 30px}
.n-hero p.lead b{color:#fff}
.n-ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.n-phone{display:flex;align-items:center;gap:12px;margin-left:8px}
.n-phone b{font:700 20px 'Unbounded',sans-serif;font-variant-numeric:tabular-nums}
.n-phone small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.n-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:46px;max-width:780px}
.n-stats div{padding:18px 18px 0 0}
.n-stats div+div{padding-left:18px;border-left:1px solid var(--line)}
.n-stats b{display:block;font:800 30px 'Unbounded',sans-serif;font-variant-numeric:tabular-nums}
.n-stats b em{font-style:normal;color:var(--red)}
.n-stats div>span{font-size:13px;color:var(--mut);line-height:1.35;display:block;margin-top:4px}
.n-sign{position:absolute;right:7%;top:24%;z-index:2;font-size:clamp(44px,6.4vw,100px);transform:rotate(-6deg)}
.n-halo{position:absolute;right:16%;top:12%;width:min(300px,24vw);aspect-ratio:1;border-radius:50%;z-index:2;border-color:#fff;box-shadow:0 0 8px #fff,0 0 30px rgba(255,255,255,.55),inset 0 0 14px rgba(255,255,255,.5);animation:breathe 5s ease-in-out infinite}
.v-neon .n-sh h2::after{content:"";display:block;width:84px;height:4px;margin-top:18px;border-radius:4px;background:#ff5252;box-shadow:0 0 6px #ff2b2b,0 0 16px #e3161e,0 0 34px rgba(227,22,30,.6)}
.n-cyc-sign{position:absolute;right:26px;top:24px;z-index:2;font-size:clamp(34px,4vw,60px);transform:rotate(-4deg)}
.n-dir:hover{box-shadow:0 0 0 1px #ff4a4a,0 0 26px rgba(255,43,43,.35)}
.n-gb.trial{box-shadow:0 0 0 2px #ff6a6a,0 0 40px rgba(255,43,43,.55)}
.n-tick{background:var(--red);color:#fff;font:800 20px 'Unbounded',sans-serif;text-transform:uppercase;padding:14px 0;border-block:1px solid #ff4b4b}
.n-tick span::after{content:"✕";margin-left:44px;opacity:.6;font-size:14px;vertical-align:middle}
.n-sec{padding-block:76px;border-bottom:1px solid var(--line);position:relative}
.n-sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.n-eb{display:flex;align-items:center;gap:10px;color:var(--red);font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.n-eb .ico{width:34px;height:34px;padding:7px;border-radius:10px;background:rgba(227,22,30,.12);border:1px solid rgba(227,22,30,.4)}
.n-sh h2{font-size:clamp(26px,3.2vw,44px);margin:14px 0 0;line-height:1.05;text-wrap:balance}
.n-dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.spot{position:relative;overflow:hidden;--mx:50%;--my:50%}
.spot::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(227,22,30,.22),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.spot:hover::before{opacity:1}
.n-dir{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:210px;transition:border-color .25s,transform .25s}
.n-dir:hover{border-color:rgba(227,22,30,.7);transform:translateY(-4px)}
.n-dir .top{display:flex;justify-content:space-between;align-items:start}
.n-dir .ico{width:48px;height:48px;padding:11px;border-radius:14px;background:#0a0a0b;border:1px solid var(--line);color:#fff;transition:color .25s,box-shadow .25s}
.n-dir:hover .ico{color:var(--red);box-shadow:0 0 24px rgba(227,22,30,.45)}
.n-dir .tg{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.n-dir .tg.au{background:var(--red);border-color:var(--red);color:#fff}
.n-dir h3{margin:auto 0 0;font:800 17px 'Unbounded',sans-serif;text-transform:uppercase}
.n-dir p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
.n-cycle{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.n-cphoto{border-radius:24px;min-height:440px;border:1px solid var(--line)}
.n-cphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,11,.95),rgba(10,10,11,0) 55%)}
.n-cphoto .ncap{position:absolute;left:28px;right:28px;bottom:26px;z-index:1}
.n-cphoto .ncap h3{font:900 clamp(30px,4vw,54px)/1 'Unbounded',sans-serif;text-transform:uppercase;margin:8px 0 10px}
.n-cphoto .ncap p{margin:0;color:#d6d6da;max-width:32em;line-height:1.5}
.n-cphoto img{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.n-cphoto:hover img{transform:scale(1.05)}
.n-kcal{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center}
.ring{width:min(240px,100%)}
.ring .arc{stroke-dasharray:629;stroke-dashoffset:629;transition:stroke-dashoffset 2s cubic-bezier(.2,.7,.2,1)}
.in .ring .arc{stroke-dashoffset:126}
.n-kcal small{color:var(--mut);font-size:14px;line-height:1.45}
.n-prices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch}
.n-p{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.n-p h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.n-p .amt{font:800 32px 'Unbounded',sans-serif;font-variant-numeric:tabular-nums;line-height:1.05}
.n-p .amt small{font:600 14px 'Manrope',sans-serif;color:var(--mut);margin-left:4px}
.n-p ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14px;flex:1;align-content:start}
.n-p li{display:flex;gap:9px}
.n-p li svg{width:17px;height:17px;color:var(--red);flex:0 0 auto;margin-top:1px}
.n-p.hot{background:radial-gradient(120% 80% at 50% 0%,rgba(227,22,30,.35),transparent 70%),var(--s2);border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 20px 60px -20px rgba(227,22,30,.6);transform:translateY(-10px)}
.n-p.hot li svg{color:#fff}
.n-tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--red);color:#fff;padding:4px 10px;border-radius:999px}
.n-team{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.n-tm{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .3s}
.n-tm:hover{transform:translateY(-4px)}
.n-tm .ph{aspect-ratio:1/1.05;position:relative;overflow:hidden}

.s-eb{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.s-eb .ico{width:32px;height:32px;padding:7px;border-radius:50%;background:var(--blush)}
.s-sh h2{font-size:clamp(30px,3.8vw,54px);line-height:1.05;margin:12px 0 0;text-wrap:balance}
.s-dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.s-dir{background:var(--s1);padding:26px;display:flex;flex-direction:column;gap:10px;min-height:200px;transition:background .3s,color .3s}
.s-dir .ico{width:44px;height:44px;color:var(--red);transition:transform .4s}
.s-dir h3{margin:auto 0 0;font:500 24px 'Playfair Display',serif}
.s-dir h3 sup{font:700 10px 'Golos Text',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-left:6px;vertical-align:top}
.s-dir p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
.s-dir:hover{background:var(--ink);color:#fff}
.s-dir:hover p{color:#bdb6b5}
.s-dir:hover .ico{transform:rotate(-8deg) scale(1.1)}
.s-dir:hover h3 sup{color:#ff6b6b}
.s-life{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:auto auto;gap:16px}
.s-l{border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end;min-height:220px;position:relative;overflow:hidden}
.s-l h3{margin:0;font:500 26px 'Playfair Display',serif}
.s-l p{margin:0;font-size:14px;line-height:1.5;opacity:.85}
.s-l.ph{grid-row:span 2;color:#fff}
.s-l.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform 1s}
.s-l.ph:hover img{transform:scale(1.05)}
.s-l.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 60%)}
.s-l.ph>*:not(img){position:relative;z-index:1}
.s-l.brick{background-color:var(--brick);color:#fff;background-image:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.18) 2px,transparent 2px);background-size:60px 26px,60px 52px,60px 52px;background-position:0 0,0 0,30px 26px}
.s-l.ink{background:var(--ink);color:#fff}
.s-l.bl{background:var(--blush)}
.s-l.wh{background:#fff;border:1px solid var(--line)}
.s-l .ico{width:36px;height:36px;margin-bottom:auto}
.s-team{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.s-tm .ph{aspect-ratio:3/3.6;border-radius:200px 200px 22px 22px;overflow:hidden;margin-bottom:14px;position:relative}
.s-tm .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.s-tm:hover .ph img{transform:scale(1.06)}
.s-tm:hover .ph{box-shadow:0 0 0 2px #ff5a5a,0 0 26px rgba(255,43,43,.45)}
.s-tm .ph{transition:box-shadow .3s}
.s-tm h3{margin:0 0 4px;font:500 22px 'Playfair Display',serif}
.s-tm p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
.s-tm .yr{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--red);border:1px solid currentColor;border-radius:999px;padding:3px 10px}
.s-prices{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}
.s-cert{border-radius:26px;padding:30px;color:#fff;background:linear-gradient(135deg,#d11a21,#7e0d12);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:360px}
.s-cert::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
.s-cert .top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.s-cert h3{font:500 italic clamp(28px,3vw,40px)/1.05 'Playfair Display',serif;margin:0}
.s-cert p{margin:0;opacity:.9;line-height:1.5}
.s-cert .btn{background:#fff;color:var(--ink);align-self:flex-start;position:relative;z-index:1}
.s-plist{background:#fff;border:1px solid var(--line);border-radius:26px;padding:10px}
.s-prow{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:20px 22px;border-radius:18px;transition:background .2s}
.s-prow + .s-prow{border-top:1px solid var(--line)}
.s-prow:hover{background:var(--bg)}
.s-prow h4{margin:0;font:500 21px 'Playfair Display',serif}
.s-prow h4 small{display:block;font:400 13px 'Golos Text',sans-serif;color:var(--mut);margin-top:4px}
.s-prow .amt{font:500 28px 'Playfair Display',serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-prow .amt small{font:500 13px 'Golos Text',sans-serif;color:var(--mut)}
.s-prow.hot{background:var(--blush);border-color:transparent}
.s-prow.hot + .s-prow{border-color:transparent}
.s-prow .tg{font:700 10px 'Golos Text',sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:#fff;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.s-rev{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.s-r{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px}
.s-r.big{grid-row:span 2;background:var(--ink);color:#fff;border:0;align-self:stretch}
.s-r.big p{font:500 italic 24px/1.4 'Playfair Display',serif}
.s-r p{margin:0;font-size:15px;line-height:1.6}
.s-contact{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.s-cbox{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:18px}
.s-cbox h2{margin:0;font-size:clamp(30px,3vw,42px)}
.s-crow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.s-crow .ico{width:44px;height:44px;padding:10px;border-radius:50%;background:var(--blush);color:var(--red);flex:0 0 auto}
.s-crow small{display:block;color:var(--mut);font-size:12px}
.s-crow b{font-size:17px}
.s-form{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.s-form input{flex:1 1 180px;border:1px solid var(--line);border-radius:999px;padding:14px 18px;font-size:15px;background:var(--bg);color:var(--ink)}
.s-form input:focus{outline:0;border-color:var(--red)}
.v-soul .map{border:1px solid var(--line);border-radius:26px}
.s-foot{padding-block:28px;font-size:13px;color:var(--mut);border-top:1px solid var(--line)}
.s-foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

/* ===== App ===== */
const V={neon:vNeon,cycle:vCycle,soul:vSoul};
const BG={neon:'#0a0a0b',cycle:'#f1f1f2',soul:'#f6f5f3'};
const app=document.getElementById('app');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let io;
function countUp(el){
  if(el.dataset.done)return;el.dataset.done=1;
  const to=parseFloat(el.dataset.count),dec=+(el.dataset.dec||0),dur=1600,t0=performance.now();
  const fmt=v=>dec?v.toFixed(dec).replace('.',','):Math.round(v).toString();
  if(reduce){el.textContent=fmt(to);return}
  const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function observe(){
  io&&io.disconnect();
  const all=document.querySelectorAll('.rv,.ring');
  if(!('IntersectionObserver' in window)){all.forEach(e=>e.classList.add('in'));return}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;
    e.target.classList.add('in');e.target.querySelectorAll('[data-count]').forEach(countUp);
    io.unobserve(e.target)}),{threshold:.15,rootMargin:'0px 0px -40px 0px'});
  all.forEach(e=>io.observe(e));
}
function render(scrollTop){
  gid=0;
  app.innerHTML=V[cur]();
  document.body.style.background=BG[cur];
  document.documentElement.lang=lang==='ky'?'ky':'ru';
  document.querySelectorAll('[data-k]').forEach(el=>el.textContent=t(el.dataset.k));
  document.querySelectorAll('.sw-tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===cur));
  document.querySelectorAll('.sw-lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  if(scrollTop)window.scrollTo(0,0);
  observe();
}
document.querySelectorAll('.sw-tab').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.v;location.hash=cur;render(true)}));
document.querySelectorAll('.sw-lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;try{localStorage.setItem('mf_lang',lang)}catch(e){}render(false)}));
app.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');
  if(c){const done=()=>{c.textContent=t('copied');setTimeout(()=>c.textContent=t('copy'),1600)};
    try{navigator.clipboard.writeText(CFG.phone).then(done,done)}catch(err){done()}}
  const a=e.target.closest('.nav a,.logo');
  if(a&&a.getAttribute('href').startsWith('#')){e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el)el.scrollIntoView({behavior:reduce?'auto':'smooth'})}
});
app.addEventListener('pointermove',e=>{const s=e.target.closest('.spot');if(!s)return;const r=s.getBoundingClientRect();s.style.setProperty('--mx',(e.clientX-r.left)+'px');s.style.setProperty('--my',(e.clientY-r.top)+'px')});
app.addEventListener('input',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;
  const n=e.target.value.trim();f.querySelector('[data-wa]').href=wa(n?t('wa_from')+' '+n+'.':'');
});
app.addEventListener('submit',e=>e.preventDefault());
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==cur){cur=h;render(true)}});
const h0=location.hash.slice(1);if(V[h0])cur=h0;
render(false);
</script>
