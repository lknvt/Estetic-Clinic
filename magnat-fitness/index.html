<title>Magnat Fitness Концепции</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=Dela+Gothic+One&family=Onest:wght@400;500;600;700;800&family=Prata&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed concept switcher on top; each concept = its own sticky header + compact sections sized to fit one desktop screen; mobile gets a bottom call/WhatsApp/2GIS bar */
:root{
  --bar-h:56px;
  --sw-bg:#0a0a0b; --sw-fg:#ededee; --sw-mut:#8b8b92; --sw-on:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:#0a0a0b;color:#111;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
img,svg{max-width:100%;display:block}
:focus-visible{outline:2px solid #4f8cff;outline-offset:3px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sw-bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Switcher ===== */
.sw{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:60;background:var(--sw-bg);color:var(--sw-fg);border-bottom:1px solid #222;font-family:'Onest',system-ui,sans-serif}
.sw .wrap{height:var(--bar-h);display:flex;align-items:center;gap:14px;max-width:none}
.sw-brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sw-mut);white-space:nowrap}
.sw-brand b{color:var(--sw-fg);font-weight:700}
.sw-tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.sw-tabs::-webkit-scrollbar{display:none}
.sw-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid #2a2a2e;background:transparent;color:var(--sw-fg);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.sw-tab i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-style:normal;font-size:11px;font-weight:800;color:#0a0a0b}
.sw-tab small{font-weight:500;color:var(--sw-mut);font-size:11px}
.sw-tab[aria-pressed="true"]{background:#fff;color:#0a0a0b;border-color:#fff}
.sw-tab[aria-pressed="true"] small{color:#55555c}
.sw-lang{display:flex;border:1px solid #2a2a2e;border-radius:999px;padding:3px;flex:0 0 auto}
.sw-lang button{border:0;background:transparent;color:var(--sw-mut);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.04em}
.sw-lang button[aria-pressed="true"]{background:#fff;color:#0a0a0b}
@media (max-width:860px){.sw-brand{display:none}.sw-tabs{justify-content:flex-start}.sw-tab small{display:none}}

#app{padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px))}
.v section{scroll-margin-top:140px}
.v .hdr{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));z-index:40}
.v .hdr .wrap{display:flex;align-items:center;gap:22px;height:68px}
.v .nav{display:flex;gap:22px;flex:1;justify-content:center;font-size:14px;font-weight:500}
.v .hphone{display:flex;flex-direction:column;line-height:1.15;text-align:right;white-space:nowrap}
.v .hphone small{font-size:11px;opacity:.7}
.v .hphone b{font-size:16px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .15s ease,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:12px;opacity:.65;margin-top:14px}
.ex{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px dashed currentColor;opacity:.7;vertical-align:middle}
.stars{display:flex;gap:2px;color:#ffb21e}
.stars svg{width:15px;height:15px;fill:currentColor;stroke:none}

/* Floating actions (desktop) + bottom bar (mobile) */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:column;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25);transition:transform .15s}
.fab a:hover{transform:scale(1.06)}
.fab .wa{background:#25d366;color:#fff}
.fab .gis{background:#1dae4f;color:#fff;font:800 13px 'Onest',sans-serif}
.fab svg{width:26px;height:26px}
.mbar{display:none}
@media (max-width:860px){
  .fab{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--mb-bg);border-top:1px solid var(--mb-line)}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;font:700 12px 'Onest',sans-serif;color:var(--mb-fg);background:var(--mb-btn)}
  .mbar a.wa{background:#25d366;color:#fff}
  .mbar a svg{width:20px;height:20px}
  .v{padding-bottom:84px}
  .v .nav,.v .hphone{display:none}
  .v .hdr .wrap{height:60px;gap:12px}
  .v .hdr .btn{padding:10px 14px;font-size:13px}
}

/* =================== 1 · MAGNAT GOLD =================== */
.v-gold{--bg:#0d0c0a;--s1:#15130f;--s2:#1c1913;--line:#2d281d;--fg:#f4eee1;--mut:#a89f8b;--gold:#d8b45f;--gold2:#a07c30;--ink:#17130a;
  background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;color-scheme:dark}
.v-gold .disp{font-family:'Unbounded','Manrope',sans-serif;letter-spacing:-.01em}
.v-gold .hdr{background:rgba(13,12,10,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.v-gold .logo{display:flex;align-items:center;gap:11px;font-family:'Unbounded',sans-serif;font-weight:700;letter-spacing:.2em;font-size:15px}
.v-gold .logo i{width:38px;height:38px;border:1.5px solid var(--gold);display:grid;place-items:center;font-style:normal;color:var(--gold);font-size:17px;letter-spacing:0;transform:rotate(45deg);border-radius:4px}
.v-gold .logo i span{transform:rotate(-45deg)}
.v-gold .logo small{display:block;font:500 10px 'Manrope',sans-serif;letter-spacing:.3em;color:var(--mut)}
.v-gold .nav a{color:var(--mut)}.v-gold .nav a:hover{color:var(--gold)}
.v-gold .hphone b{color:var(--gold)}
.v-gold .btn-g{background:linear-gradient(135deg,#ecd08a,var(--gold) 45%,var(--gold2));color:var(--ink);box-shadow:0 8px 26px rgba(216,180,95,.22)}
.v-gold .btn-o{border-color:var(--line);color:var(--fg);background:var(--s1)}
.v-gold .btn-o:hover{border-color:var(--gold)}
.g-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.g-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at 80% 30%,rgba(216,180,95,.16),transparent 70%),linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 80px;opacity:.9;pointer-events:none}
.g-hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:56px 60px}
.g-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(216,180,95,.35);padding:7px 12px;border-radius:999px}
.g-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(216,180,95,.2);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(216,180,95,0)}}
.g-hero h1{font-size:clamp(34px,4.6vw,64px);line-height:1.04;margin:22px 0 18px;font-weight:700;text-wrap:balance}
.g-hero h1 em{font-style:normal;background:linear-gradient(120deg,#f3dc9c,var(--gold) 50%,#b88d38);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-hero p.lead{font-size:18px;line-height:1.55;color:var(--mut);max-width:34em;margin:0 0 28px}
.g-ctas{display:flex;flex-wrap:wrap;gap:12px}
.g-callrow{display:flex;align-items:center;gap:14px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.g-callrow .ph{font-family:'Unbounded',sans-serif;font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.g-callrow small{color:var(--mut);display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.copy{border:1px solid var(--line);background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.g-panel{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;padding:28px;position:relative}
.g-ring{width:min(260px,100%);margin:0 auto}
.g-ring text{font-family:'Unbounded',sans-serif}
.g-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.g-stats div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.g-stats b{display:block;font:700 22px 'Unbounded',sans-serif;color:var(--gold)}
.g-stats span{font-size:11.5px;color:var(--mut);line-height:1.3;display:block;margin-top:4px}
.g-offer{position:absolute;left:-26px;top:22px;background:var(--gold);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;transform:rotate(-4deg);box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:190px;line-height:1.25}
.g-sec{padding-block:72px;border-bottom:1px solid var(--line)}
.g-sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:34px;flex-wrap:wrap}
.g-eb{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.g-eb .ico{width:34px;height:34px;padding:7px;border:1px solid rgba(216,180,95,.4);border-radius:10px}
.g-sh h2{font-size:clamp(26px,3vw,40px);margin:12px 0 0;font-weight:700;line-height:1.1;text-wrap:balance}
.g-zones{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g-zone{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;transition:border-color .2s,transform .2s}
.g-zone:hover{border-color:var(--gold);transform:translateY(-3px)}
.g-zone .ico{width:48px;height:48px;padding:11px;border-radius:14px;background:rgba(216,180,95,.1);color:var(--gold);grid-row:span 3}
.g-zone h3{margin:2px 0 0;font-size:18px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.g-zone h3 span{font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(216,180,95,.35);border-radius:999px;padding:3px 8px;white-space:nowrap;align-self:start}
.g-zone p{margin:0;color:var(--mut);font-size:14.5px;line-height:1.5}
.g-prices{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch}
.g-price{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.g-price h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.g-price .amt{font:700 34px 'Unbounded',sans-serif;font-variant-numeric:tabular-nums}
.g-price .amt small{font:500 14px 'Manrope',sans-serif;color:var(--mut);margin-left:4px}
.g-price ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14px;flex:1;align-content:start}
.g-price li{display:flex;gap:9px;align-items:start}
.g-price li svg{width:17px;height:17px;color:var(--gold);flex:0 0 auto;margin-top:1px}
.g-price.hot{background:linear-gradient(160deg,#f0d690,var(--gold) 50%,#b08734);color:var(--ink);border-color:transparent;transform:translateY(-10px);box-shadow:0 24px 50px rgba(216,180,95,.18)}
.g-price.hot h3,.g-price.hot .amt small{color:#4a3b17}
.g-price.hot li svg{color:var(--ink)}
.g-price.hot .btn{background:var(--ink);color:var(--gold)}
.g-tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--gold);padding:4px 9px;border-radius:999px}
.g-team{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.g-tm{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.g-tm .ph{aspect-ratio:4/4.3;position:relative}
.g-tm .ph svg{width:100%;height:100%}
.g-tm .yr{position:absolute;right:12px;bottom:12px;background:rgba(13,12,10,.82);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--mut)}
.g-tm .yr b{color:var(--gold);font:700 16px 'Unbounded',sans-serif;margin-right:4px}
.g-tm .tx{padding:16px 18px 20px}
.g-tm h3{margin:0 0 5px;font-size:17px}
.g-tm p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
.g-rev{display:grid;grid-template-columns:.8fr 2fr;gap:20px}
.g-score{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.g-score .big{font:800 72px/1 'Unbounded',sans-serif;color:var(--gold)}
.g-score .stars svg{width:22px;height:22px}
.g-rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g-r{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative}
.g-r::after{content:"\201C";position:absolute;right:18px;top:4px;font:800 64px 'Unbounded',sans-serif;color:rgba(216,180,95,.16)}
.g-r p{margin:0;line-height:1.55;font-size:15px}
.who{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:14px}
.who i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.who small{display:block;opacity:.6;font-size:12px}
.v-gold .who i{background:rgba(216,180,95,.15);color:var(--gold)}
.g-contact{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
.g-info{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.g-row{display:flex;gap:14px;align-items:start}
.g-row .ico{color:var(--gold);flex:0 0 auto;width:40px;height:40px;padding:9px;border:1px solid var(--line);border-radius:12px}
.g-row small{display:block;color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.g-row b{font-size:17px}
.g-row b.ph{font:700 22px 'Unbounded',sans-serif;color:var(--gold);font-variant-numeric:tabular-nums}
.map{display:block;border-radius:22px;overflow:hidden;border:1px solid var(--line);position:relative;min-height:320px}
.map>svg{width:100%;height:100%;position:absolute;inset:0}
.map span svg{width:18px;height:18px}
.map span{position:absolute;left:16px;bottom:16px;background:#1dae4f;color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:10px;display:flex;gap:8px;align-items:center}
.g-foot{padding-block:28px;color:var(--mut);font-size:13px}
.g-foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.v-gold{--mb-bg:#0d0c0a;--mb-line:#2d281d;--mb-fg:#f4eee1;--mb-btn:#1c1913}
@media (max-width:1020px){.g-hero .wrap{grid-template-columns:1fr}.g-offer{left:auto;right:12px;top:-14px}.g-zones{grid-template-columns:1fr 1fr}.g-prices,.g-team{grid-template-columns:1fr 1fr}.g-price.hot{transform:none}.g-rev,.g-contact{grid-template-columns:1fr}}
@media (max-width:620px){.g-zones,.g-rgrid{grid-template-columns:1fr}.g-sec{padding-block:52px}.g-hero .wrap{padding-block:36px 44px}.g-zone{padding:18px}.g-prices{grid-template-columns:1fr}.g-team{grid-template-columns:1fr 1fr;gap:12px}.g-tm .tx{padding:12px}.g-tm h3{font-size:15px}.g-tm p{font-size:13px}.g-stats b{font-size:18px}.g-ctas .btn{flex:1 1 100%}}

/* =================== 2 · ENERGY =================== */
.v-energy{--bg:#eef0f3;--s1:#ffffff;--ink:#0f1115;--mut:#5a606c;--or:#ff5a1f;--co:#2643ff;--lime:#d7f25b;--line:#d8dbe2;
  background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,sans-serif}
.v-energy .disp{font-family:'Dela Gothic One','Onest',sans-serif;text-transform:uppercase;letter-spacing:-.01em;font-weight:400}
.v-energy .hdr{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.v-energy .logo{font-family:'Dela Gothic One',sans-serif;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:4px}
.v-energy .logo i{width:10px;height:10px;background:var(--or);border-radius:50%;display:inline-block;margin-left:2px}
.v-energy .nav a{color:var(--mut)}.v-energy .nav a:hover{color:var(--or)}
.v-energy .btn-or{background:var(--or);color:#fff;border-radius:10px}
.v-energy .btn-ink{background:var(--ink);color:#fff;border-radius:10px}
.v-energy .btn-ln{background:#fff;border-color:var(--line);color:var(--ink);border-radius:10px}
.e-hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;padding-block:40px 28px}
.e-h1{font-size:clamp(40px,7vw,104px);line-height:.92;margin:0}
.e-h1 span{display:block}
.e-h1 span:nth-child(2){color:var(--or)}
.e-h1 span:nth-child(3){-webkit-text-stroke:2px var(--ink);color:transparent}
.e-lead{display:flex;gap:18px;align-items:center;margin-top:24px;flex-wrap:wrap}
.e-lead p{margin:0;max-width:30em;color:var(--mut);font-size:17px;line-height:1.5;flex:1 1 300px}
.e-side{display:grid;grid-template-rows:auto 1fr;gap:14px}
.e-offer{background:var(--or);color:#fff;border-radius:22px;padding:26px;position:relative;overflow:hidden}
.e-offer::after{content:"";position:absolute;right:-40px;bottom:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.18)}
.e-offer .z{font:400 64px/1 'Dela Gothic One',sans-serif}
.e-offer .z small{font-size:22px}
.e-offer h3{margin:8px 0 6px;font-size:20px}
.e-offer p{margin:0 0 16px;opacity:.9;font-size:14px;max-width:24em}
.e-offer .btn{background:#fff;color:var(--ink);position:relative;z-index:1}
.e-247{background:var(--ink);color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.e-247 div b{display:block;font:400 30px 'Dela Gothic One',sans-serif;color:var(--lime)}
.e-247 div span{font-size:12.5px;color:#b9bdc7;line-height:1.3;display:block}
.e-tick{background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;border-block:4px solid var(--or)}
.e-tick div{display:inline-flex;gap:36px;padding:14px 0;animation:tick 26s linear infinite;font:400 22px 'Dela Gothic One',sans-serif;text-transform:uppercase}
.e-tick div span::after{content:"✦";color:var(--or);margin-left:36px}
@keyframes tick{to{transform:translateX(-50%)}}
.e-sec{padding-block:64px}
.e-sh{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.e-eb{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px 7px 8px;border-radius:999px}
.e-eb .ico{width:20px;height:20px;color:var(--lime)}

/* ===== App ===== */
const V={gold:vGold,energy:vEnergy,aqua:vAqua};
const BG={gold:'#0d0c0a',energy:'#eef0f3',aqua:'#edf5f4'};
const app=document.getElementById('app');
function render(scrollTop){
  gid=0;
  app.innerHTML=V[cur]();
  document.body.style.background=BG[cur];
  document.documentElement.lang=lang==='ky'?'ky':'ru';
  document.querySelectorAll('[data-k]').forEach(el=>el.textContent=t(el.dataset.k));
  document.querySelectorAll('.sw-tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===cur));
  document.querySelectorAll('.sw-lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  if(scrollTop)window.scrollTo(0,0);
}
document.querySelectorAll('.sw-tab').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.v;location.hash=cur;render(true)}));
document.querySelectorAll('.sw-lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;try{localStorage.setItem('mf_lang',lang)}catch(e){}render(false)}));
app.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');
  if(c){const done=()=>{c.textContent=t('copied');setTimeout(()=>c.textContent=t('copy'),1600)};
    try{navigator.clipboard.writeText(CFG.phone).then(done,done)}catch(err){done()}}
  const a=e.target.closest('.nav a,.logo');
  if(a&&a.getAttribute('href').startsWith('#')){e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el)el.scrollIntoView({behavior:'smooth'})}
});
app.addEventListener('input',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;
  const n=e.target.value.trim();f.querySelector('[data-wa]').href=wa(n?t('wa_from')+' '+n+'.':'');
});
app.addEventListener('submit',e=>e.preventDefault());
function fromHash(){const h=location.hash.slice(1);if(V[h]&&h!==cur){cur=h;render(true)}}
window.addEventListener('hashchange',fromHash);
const h0=location.hash.slice(1);if(V[h0])cur=h0;
render(false);
</script>
