<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Задачник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#1b1b1f);--hint:var(--tg-theme-hint-color,#8a8a93);--btn:var(--tg-theme-button-color,#2a8c82);--btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f3f5);--ok:#2f9e6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:12px 16px 90px}
h1{font-size:20px;margin:0}.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.top .sp{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--btn);color:var(--btx)}button.danger{color:#d33}
.week{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.day{flex:1;min-width:44px;text-align:center;padding:6px 0;border-radius:12px;background:var(--card);font-size:12px;color:var(--hint)}
.day b{display:block;font-size:17px;color:var(--tx)}.day.sel{background:var(--btn);color:var(--btx)}.day.sel b{color:var(--btx)}
.day i{display:block;height:5px;width:5px;border-radius:50%;margin:2px auto 0;background:transparent}.day i.on{background:var(--ok)}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--hint);background:none;padding:0;margin-top:2px}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}.task.done .ttl{text-decoration:line-through;color:var(--hint)}
.body{flex:1;min-width:0}.ttl{font-weight:600;word-break:break-word}.meta{font-size:13px;color:var(--hint)}.cmt{font-size:14px;margin-top:4px}
textarea,input,select{width:100%;font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--hint);background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--hint);margin:10px 0 4px}.row{display:flex;gap:8px}.row>*{flex:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.fab{position:fixed;right:16px;bottom:20px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0}
.empty{text-align:center;color:var(--hint);padding:24px 0}.h2{font-size:14px;color:var(--hint);margin:16px 0 6px}
</style>
</head>
<body>
<div class="top"><h1 id="title">Задачник</h1><span class="sp"></span><button id="prev">‹</button><button id="today">Сегодня</button><button id="next">›</button></div>
<div class="week" id="week"></div>
<div id="list"></div>
<div class="h2">Комментарий к дню</div>
<textarea id="note" rows="3" placeholder="Как прошёл день, что важно запомнить…"></textarea>
<button class="fab pri" id="add">+</button>

<div class="sheet" id="sheet"><div class="panel">
  <h1 id="sTitle">Новая задача</h1>
  <label>Задача</label><input id="fTitle" maxlength="200">
  <label>Заметка</label><textarea id="fNote" rows="2"></textarea>
  <div class="row"><div><label>Дата начала</label><input type="date" id="fDate"></div><div><label>Время (необязательно)</label><input type="time" id="fTime"></div></div>
  <label>Повтор</label>
  <div class="row"><select id="fUnit"><option value="none">Не повторять</option><option value="day">Каждые N дней</option><option value="week">Каждые N недель</option><option value="month">Каждые N месяцев</option></select><input type="number" id="fEvery" min="1" max="365" value="1"></div>
  <div class="row"><div><label>Повторять до (необязательно)</label><input type="date" id="fUntil"></div><div><label>Напомнить за (мин)</label><input type="number" id="fRemind" min="0" value="0"></div></div>
  <div class="row" style="margin-top:16px"><button id="sDel" class="danger">Удалить</button><button id="sCancel">Отмена</button><button id="sSave" class="pri">Сохранить</button></div>
</div></div>

<script>
const API_URL = "https://PROJECT_REF.supabase.co/functions/v1/bot"; // ← подставьте URL функции
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return fmt(d); };
const utc = s => new Date(s+"T00:00:00Z");
function occurs(t, ds){ // та же логика, что на сервере
  const d=utc(ds), s=utc(t.start_date);
  if(d<s || (t.until && d>utc(t.until))) return false;
  if(t.repeat_unit==="none") return ds===t.start_date;
  const n=t.repeat_every||1, diff=Math.round((d-s)/864e5);
  if(t.repeat_unit==="day") return diff%n===0;
  if(t.repeat_unit==="week") return diff%(7*n)===0;
  const m=(d.getUTCFullYear()-s.getUTCFullYear())*12+d.getUTCMonth()-s.getUTCMonth(); if(m%n) return false;
  const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
  return d.getUTCDate()===Math.min(s.getUTCDate(),last);
}
// Локальный режим: пока API_URL не настроен или приложение открыто вне Telegram, данные лежат в localStorage.
const LOCAL = API_URL.includes("PROJECT_REF") || !tg?.initData;
const DB_KEY = "planner-db-v1";
const ldb = () => { try { return JSON.parse(localStorage.getItem(DB_KEY)) || {tasks:[],completions:[],notes:[]}; } catch { return {tasks:[],completions:[],notes:[]}; } };
const lsave = d => localStorage.setItem(DB_KEY, JSON.stringify(d));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()));
async function localCall(b){
  const d = ldb();
  switch(b.op){
    case "load": return {tasks:d.tasks.filter(t=>!t.archived), completions:d.completions, notes:d.notes, tz:Intl.DateTimeFormat().resolvedOptions().timeZone};
    case "saveTask": { const t=b.task; const row={...t, id:t.id||uid(), until:t.until||null, time:t.time||null, archived:false};
      const i=d.tasks.findIndex(x=>x.id===row.id); if(i>=0) d.tasks[i]=row; else d.tasks.push(row); break; }
    case "deleteTask": { const t=d.tasks.find(x=>x.id===b.id); if(t) t.archived=true; break; }
    case "toggle": d.completions=d.completions.filter(c=>!(c.task_id===b.task_id&&c.date===b.date));
      if(b.done) d.completions.push({task_id:b.task_id,date:b.date,comment:b.comment||"",done_at:new Date().toISOString()}); break;
    case "saveNote": d.notes=d.notes.filter(n=>n.date!==b.date); if(b.note) d.notes.push({date:b.date,note:b.note}); break;
  }
  lsave(d); return {ok:true};
}
async function call(body){
  if(LOCAL) return localCall(body);
  const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","x-telegram-init-data":tg?.initData||""},body:JSON.stringify(body)});
  const j = await r.json(); if(!r.ok||j.error) throw new Error(j.error||r.status); return j;
}
// Напоминания в локальном режиме: пока вкладка открыта (в Telegram их шлёт бот)
if(LOCAL){
  if("Notification" in window && Notification.permission==="default") document.addEventListener("click",()=>Notification.requestPermission(),{once:true});
  setInterval(async()=>{
    const now=new Date(), ds=fmt(now), min=now.getHours()*60+now.getMinutes(), sent=JSON.parse(localStorage.getItem("planner-sent")||"{}");
    const {tasks,completions}=await localCall({op:"load"});
    for(const t of tasks){
      if(!t.time||!occurs(t,ds)||completions.some(c=>c.task_id===t.id&&c.date===ds)) continue;
      const at=+t.time.slice(0,2)*60+ +t.time.slice(3,5)-(t.remind_before||0), key=t.id+ds;
      if(min>=at && min<=at+120 && !sent[key]){ sent[key]=1; localStorage.setItem("planner-sent",JSON.stringify(sent));
        if(Notification.permission==="granted") new Notification("⏰ "+t.time.slice(0,5)+" "+t.title,{body:t.note||""}); else alert("⏰ "+t.time.slice(0,5)+" "+t.title); }
    }
  },30000);
}
let sel = fmt(new Date()), state = {tasks:[],completions:[],notes:[]}, editing = null;

async function load(){
  const from = addDays(sel,-3), to = addDays(sel,3);
  try { state = await call({op:"load",from,to}); render(); } catch(e){ $("list").innerHTML=`<div class="empty">Не удалось загрузить (${e.message})</div>`; }
}
const comp = (id,d) => state.completions.find(c=>c.task_id===id && c.date===d);
function render(){
  const dn = ["вс","пн","вт","ср","чт","пт","сб"], today = fmt(new Date());
  $("title").textContent = sel===today ? "Сегодня" : parse(sel).toLocaleDateString("ru",{day:"numeric",month:"long",weekday:"short"});
  $("week").innerHTML = [-3,-2,-1,0,1,2,3].map(i=>{
    const d=addDays(sel,i), has=state.tasks.some(t=>occurs(t,d));
    return `<div class="day ${d===sel?"sel":""}" data-d="${d}">${dn[parse(d).getDay()]}<b>${parse(d).getDate()}</b><i class="${has?"on":""}"></i></div>`;
  }).join("");
  const items = state.tasks.filter(t=>occurs(t,sel)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  $("list").innerHTML = items.length ? items.map(t=>{
    const c=comp(t.id,sel), rep = t.repeat_unit==="none"?"":` · каждые ${t.repeat_every} ${({day:"дн.",week:"нед.",month:"мес."})[t.repeat_unit]}`;
    return `<div class="task ${c?"done":""}" data-id="${t.id}"><button class="chk" data-chk="${t.id}">${c?"✓":""}</button>
      <div class="body" data-edit="${t.id}"><div class="ttl">${esc(t.title)}</div><div class="meta">${t.time?t.time.slice(0,5):"весь день"}${rep}${t.note?" · "+esc(t.note):""}</div>${c&&c.comment?`<div class="cmt">💬 ${esc(c.comment)}</div>`:""}</div></div>`;
  }).join("") : `<div class="empty">На этот день задач нет</div>`;
  $("note").value = state.notes.find(n=>n.date===sel)?.note || "";
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("week").onclick = e => { const d=e.target.closest(".day"); if(d){ sel=d.dataset.d; load(); } };
$("prev").onclick = () => { sel=addDays(sel,-1); load(); };
$("next").onclick = () => { sel=addDays(sel,1); load(); };
$("today").onclick = () => { sel=fmt(new Date()); load(); };
$("list").onclick = async e => {
  const chk=e.target.closest("[data-chk]"), ed=e.target.closest("[data-edit]");
  if(chk){
    const id=chk.dataset.chk, was=comp(id,sel);
    let comment=""; if(!was){ comment = prompt("Комментарий к выполнению (можно пропустить):","") ?? ""; }
    await call({op:"toggle",task_id:id,date:sel,done:!was,comment}).catch(()=>{}); tg?.HapticFeedback?.notificationOccurred("success"); load();
  } else if(ed){ openSheet(state.tasks.find(t=>t.id===ed.dataset.edit)); }
};
let nt; $("note").oninput = () => { clearTimeout(nt); nt=setTimeout(()=>call({op:"saveNote",date:sel,note:$("note").value}).catch(()=>{}),600); };

function openSheet(t){
  editing=t||null; $("sTitle").textContent=t?"Редактировать":"Новая задача";
  $("fTitle").value=t?.title||""; $("fNote").value=t?.note||""; $("fDate").value=t?.start_date||sel; $("fTime").value=t?.time?.slice(0,5)||"";
  $("fUnit").value=t?.repeat_unit||"none"; $("fEvery").value=t?.repeat_every||1; $("fUntil").value=t?.until||""; $("fRemind").value=t?.remind_before||0;
  $("sDel").style.display=t?"":"none"; $("sheet").classList.add("open");
}
$("add").onclick = () => openSheet(null);
$("sCancel").onclick = () => $("sheet").classList.remove("open");
$("sDel").onclick = async () => { if(confirm("Удалить задачу (и все её повторы)?")){ await call({op:"deleteTask",id:editing.id}); $("sheet").classList.remove("open"); load(); } };
$("sSave").onclick = async () => {
  if(!$("fTitle").value.trim()) return $("fTitle").focus();
  await call({op:"saveTask",task:{id:editing?.id,title:$("fTitle").value.trim(),note:$("fNote").value,start_date:$("fDate").value,time:$("fTime").value||null,
    repeat_unit:$("fUnit").value,repeat_every:+$("fEvery").value||1,until:$("fUntil").value||null,remind_before:+$("fRemind").value||0}});
  $("sheet").classList.remove("open"); sel=$("fDate").value; load();
};
load();
</script>
</body>
</html>
