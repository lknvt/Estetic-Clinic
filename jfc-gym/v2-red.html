<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JFC Gym — Red Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Manrope:wght@500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
/* Красный угол: красные полосы-секции чередуются с белыми и чёрными, плиточная сетка, плашки как в постах */
:root{--rd:#e30613;--rd2:#ff2b36;--bk:#101011;--bk2:#1b1b1d;--wh:#fff;--bg:#f3f3f4;--ln:#e4e4e7;--mu:#6b6b72;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--bk);font:500 16px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}
.ic{width:22px;height:22px;flex:none}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:Montserrat,"Arial Black",sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.02}
.jlogo{height:38px;width:auto;display:block}
.ban{display:inline-block;background:var(--rd);color:#fff;font:italic 900 13px/1 Montserrat,sans-serif;text-transform:uppercase;padding:8px 13px 7px;transform:skew(-10deg)}
.ban>span{display:inline-block;transform:skew(10deg)}
.ban.k{background:var(--bk)}
.sec{padding:64px 0}
.red{background:var(--rd);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.dark{background:var(--bk);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.tris:before,.tris:after{content:"";position:absolute;z-index:-1;pointer-events:none;clip-path:polygon(0 0,100% 0,50% 86%)}
.red.tris:before{width:520px;height:520px;right:-120px;top:-160px;background:#0000002e}
.red.tris:after{width:300px;height:300px;left:-90px;bottom:-140px;background:#ffffff1c;clip-path:polygon(50% 0,100% 86%,0 86%)}
.dark.tris:before{width:460px;height:460px;right:-120px;top:-140px;background:#e306132b}
.dark.tris:after{width:240px;height:240px;left:-60px;bottom:-110px;background:#ffffff0a;clip-path:polygon(50% 0,100% 86%,0 86%)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:30px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,3.6vw,48px);margin-top:16px;max-width:780px}
.sh p{color:var(--mu);max-width:440px}
.red .sh p,.dark .sh p{color:#ffffffb3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 26px;border-radius:14px;border:0;cursor:pointer;font-weight:800;font-size:15px;transition:.25s;white-space:nowrap}
.btn-r{background:var(--rd);color:#fff;box-shadow:0 12px 28px -12px #e30613}.btn-r:hover{background:var(--rd2);transform:translateY(-2px)}
.btn-w{background:#fff;color:var(--rd)}.btn-w:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px #0006}
.btn-k{background:var(--bk);color:#fff}.btn-k:hover{background:#000;transform:translateY(-2px)}
.btn-l{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}.btn-l:hover{background:#ffffff1a}
.btn-g{background:#25d366;color:#fff}.btn-g:hover{filter:brightness(1.06)}
.card{background:#fff;color:var(--bk);border-radius:var(--r);position:relative;overflow:hidden}
/* header */
.hd{position:fixed;top:12px;left:0;right:0;z-index:50}
.hd .in{max-width:1320px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:20px;height:64px;padding:0 10px 0 20px;background:#ffffffeb;backdrop-filter:blur(16px);border-radius:18px;box-shadow:0 14px 34px -18px #0005}
nav{display:flex;gap:2px;margin-left:8px}
nav a{padding:8px 12px;border-radius:10px;font-size:14px;font-weight:700;color:#3a3a40;transition:.2s}
nav a:hover{background:#fde6e7;color:var(--rd)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.lang button{border:0;background:none;color:var(--mu);font-weight:800;font-size:12px;padding:7px 10px;border-radius:8px;cursor:pointer}
.lang button.on{background:var(--bk);color:#fff}
.ph{white-space:nowrap;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:0 6px}
.ph .ic{color:var(--rd);width:20px;height:20px}
.bar .btn{height:46px;padding:0 18px;font-size:14px;border-radius:12px}
.burger{display:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--bg);color:var(--bk);cursor:pointer;place-items:center}
/* hero */
.hero{padding:100px 0 30px;min-height:100svh;display:flex;align-items:center}
.hero.tris:before{width:760px;height:760px;right:-180px;top:-120px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,1fr);gap:14px;width:100%;height:min(680px,calc(100svh - 140px));min-height:540px}
.b-main{grid-column:span 7;grid-row:span 3;padding:30px 10px 10px 0;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.b-main h1{font-size:clamp(42px,5.6vw,86px);margin:22px 0 20px;line-height:.98}
.b-main h1 em{font-style:italic;display:inline-block;background:#fff;color:var(--rd);padding:0 .16em;transform:skew(-6deg);margin-top:.08em}
.b-main p{color:#ffe1e3;font-size:18px;max-width:540px}
.b-main .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.b-live{grid-column:span 5;padding:24px 26px;display:flex;flex-direction:column;justify-content:space-between}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:#0a8a3a}
.live:before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;animation:ping 1.8s infinite}
.live.closed{color:var(--mu)}
@keyframes ping{0%{box-shadow:0 0 0 0 #0a8a3a66}100%{box-shadow:0 0 0 12px #0a8a3a00}}
.b-live small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.nx{display:flex;align-items:end;justify-content:space-between;gap:12px}
.nx b{display:block;font:italic 900 24px/1.1 Montserrat,sans-serif;text-transform:uppercase;margin-top:6px}
.nx .tm{font:italic 900 46px/1 Montserrat,sans-serif;color:var(--rd)}
.b-rate{grid-column:span 3;padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bk);color:#fff}
.b-rate b{display:block;font:italic 900 56px/1 Montserrat,sans-serif;margin-bottom:4px}
.stars{display:flex;gap:2px;color:#ffc21a}.stars .ic{width:18px;height:18px}
.b-rate span{display:block;font-weight:700;font-size:14px;line-height:1.3;color:#c9c9cf}
.b-ig{grid-column:span 2;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:.25s}
.b-ig:hover{transform:translateY(-3px)}
.b-ig .ic{width:30px;height:30px;color:var(--rd)}
.b-ig b{display:block;font:italic 900 30px/1 Montserrat,sans-serif}
.b-ig span{color:var(--mu);font-size:12.5px;line-height:1.25;display:block;margin-top:4px}
.b-ph{grid-column:span 5;padding:22px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:var(--bk);color:#fff}
.b-ph small{color:#9a9aa2;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.b-ph a.big{font:italic 900 clamp(24px,2.3vw,34px) Montserrat,sans-serif;display:flex;align-items:center;gap:12px}
.b-ph a.big .ic{width:30px;height:30px;color:var(--rd2)}
.b-ph .row{display:flex;gap:8px}
.b-ph .row .btn{flex:1;height:48px;font-size:14px}
/* highlights */
.hls{background:#fff;border-bottom:1px solid var(--ln)}
.hls .wrap{display:flex;gap:22px;justify-content:space-between;overflow-x:auto;padding-block:22px;scrollbar-width:none}
.hl{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;width:86px;text-align:center;line-height:1.2}
.hl span.c{width:78px;height:78px;border-radius:50%;padding:3px;background:#dcdce0;display:block;transition:.25s}
.hl span.c svg{width:100%;height:100%;display:block;border-radius:50%;border:3px solid #fff}
.hl:hover span.c{background:var(--rd);transform:scale(1.06)}
/* dirs */
.dirs{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:168px;grid-auto-flow:dense;gap:14px}
.dir{padding:22px;display:flex;flex-direction:column;justify-content:space-between;transition:.3s;cursor:pointer;border:1.5px solid transparent}
.dir:hover{border-color:var(--rd);transform:translateY(-4px)}
.dir .ib{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#fde6e7;color:var(--rd);transition:.3s;position:relative}
.dir:hover .ib{background:var(--rd);color:#fff;transform:rotate(-8deg)}
.dir h3{font-size:18px;margin-bottom:6px}
.dir p{color:var(--mu);font-size:14px;line-height:1.45}
.dir .go{position:absolute;right:18px;top:20px;width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:.3s}
.dir .go .ic{width:18px;height:18px;transform:rotate(-45deg)}
.dir:hover .go{background:var(--rd);color:#fff}
.dir.big{grid-row:span 2;grid-column:span 2;background:var(--bk);color:#fff}
.dir.big h3{font-size:34px}
.dir.big p{color:#c9c9cf;font-size:15px;max-width:340px}
.dir.big .ib{background:var(--rd);color:#fff}
.dir.big .go{background:#ffffff14}
.dir.big .tri{position:absolute;right:-40px;top:-30px;width:300px;height:300px;background:var(--rd);opacity:.9;clip-path:polygon(0 0,100% 0,50% 86%)}
.dir.big.v{grid-column:span 1;background:var(--rd)}
.dir.big.v h3{font-size:28px}.dir.big.v p{color:#ffe1e3}.dir.big.v .ib{background:#fff;color:var(--rd)}
/* results */
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.rs{background:var(--bk);border-radius:var(--r);aspect-ratio:4/5;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;transition:.3s}
.rs:hover{transform:translateY(-6px) rotate(-.6deg)}
.rs .bgt{position:absolute;right:-30px;top:-20px;width:70%;aspect-ratio:1;background:var(--rd);opacity:.35;clip-path:polygon(0 0,100% 0,50% 86%)}
.rs .ic{position:absolute;left:20px;top:20px;width:44px;height:44px;color:#fff}
.rs b{align-self:flex-start;background:var(--rd);color:#fff;font:italic 900 clamp(20px,2vw,30px)/1.05 Montserrat,sans-serif;text-transform:uppercase;padding:8px 12px;transform:skew(-6deg);margin-bottom:12px}
.rs b small{font-size:.55em;margin-left:4px}
.rs p{color:#e4e4e7;font-weight:600;font-size:15px;position:relative}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.st{padding:26px;display:flex;gap:18px;align-items:flex-start}
.st .n{flex:none;width:56px;height:56px;display:grid;place-items:center;font:italic 900 22px Montserrat,sans-serif;color:#fff;background:var(--rd);clip-path:polygon(0 0,100% 0,50% 92%);padding-bottom:14px}
.st h3{font-size:17px;margin-bottom:6px}
.st p{color:var(--mu);font-size:14.5px}
/* coaches */
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 14px*3)/4);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.co{scroll-snap-align:start;padding:10px;background:var(--bk2);color:#fff;transition:.3s}
.co:hover{transform:translateY(-4px)}
.co .pic{border-radius:16px;overflow:hidden;aspect-ratio:1/1;position:relative}
.co .pic svg{width:100%;height:100%;display:block}
.co .exp{position:absolute;left:0;bottom:14px;background:var(--rd);color:#fff;font:italic 900 13px Montserrat,sans-serif;text-transform:uppercase;padding:6px 12px}
.co .tx{padding:16px 10px 10px}
.co h3{font-size:16px}
.co .rl{color:var(--rd2);font-weight:800;font-size:14px;margin:6px 0 10px}
.co .tg{display:inline-block;background:#ffffff12;border-radius:8px;padding:5px 10px;font-size:12px;color:#d4d4d8}
.arrows{display:flex;gap:8px}
.arrows button{width:52px;height:52px;border-radius:14px;border:0;background:#ffffff14;color:#fff;cursor:pointer;display:grid;place-items:center;transition:.2s}
.arrows button:hover{background:var(--rd)}
.arrows button:first-child .ic{transform:rotate(180deg)}
.red .arrows button{background:#0000002a}
.red .arrows button:hover{background:#fff;color:var(--rd)}
/* prices */
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pr{padding:28px;display:flex;flex-direction:column;border:1.5px solid var(--ln)}
.pr .pt{font:italic 900 17px Montserrat,sans-serif;text-transform:uppercase}
.pr .pp{font:italic 900 48px/1 Montserrat,sans-serif;margin:22px 0 2px;letter-spacing:-.03em}
.pr .pu{color:var(--mu);font-size:14px}
.pr ul{list-style:none;margin:22px 0 26px;display:grid;gap:10px;font-size:14.5px}
.pr li{display:flex;gap:10px}
.pr li .ic{width:20px;height:20px;color:var(--rd);flex:none}
.pr .btn{margin-top:auto}
.pr.hit{background:var(--rd);color:#fff;border-color:var(--rd);box-shadow:0 30px 50px -30px #e30613}
.pr.hit .pu{color:#ffd0d3}.pr.hit li .ic{color:#fff}
.pr .hb{position:absolute;right:16px;top:18px}
.pnote{margin-top:18px;color:var(--mu);font-size:15px}
.pnote b{color:var(--rd)}
/* schedule */
.sch{display:grid;grid-template-columns:260px 1fr;gap:14px}
.days{padding:10px;display:flex;flex-direction:column;gap:4px}
.days button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:#3a3a40;padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:800;font-size:15px;text-align:left;transition:.2s}
.days button:hover{background:var(--bg)}
.days button.on{background:var(--rd);color:#fff}
.days button small{font-size:11px;font-weight:800;text-transform:uppercase;opacity:.85}
.slots{padding:24px;display:flex;flex-direction:column}
.slots h3{font-size:22px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.slots h3 .ic{color:var(--rd)}
.slot{display:grid;grid-template-columns:110px 52px 1fr auto;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--ln)}
.slot:last-child{border:0}
.slot .tm{font:italic 900 24px Montserrat,sans-serif;color:var(--rd)}
.slot .ib{width:48px;height:48px;border-radius:12px;background:#fde6e7;display:grid;place-items:center;color:var(--rd)}
.slot b{font-size:16px}.slot span{display:block;color:var(--mu);font-size:13px}
.slot a{font-weight:800;font-size:13px;color:var(--rd);border:1.5px solid var(--rd);border-radius:10px;padding:8px 14px;transition:.2s}
.slot a:hover{background:var(--rd);color:#fff}
.empty{color:var(--mu);padding:20px 0;font-weight:700}
/* reviews */
.rvw{padding:26px;display:flex;flex-direction:column;gap:14px;scroll-snap-align:start;color:var(--bk)}
.rvw p{font-size:15.5px;color:#2e2e33;flex:1}
.who{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:italic 900 18px Montserrat,sans-serif;color:#fff;background:var(--rd)}
.who b{display:block}.who small{color:var(--mu);font-size:13px}
.rtrack{grid-auto-columns:calc((100% - 28px)/3)}
/* contacts */
.cb{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c-map{grid-column:span 7;min-height:430px;background:linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/32px 32px,var(--bk2);color:#fff}
.c-map .rd1,.c-map .rd2{position:absolute;background:#ffffff12;border-radius:8px}
.c-map .rd1{left:-10%;right:-10%;top:60%;height:22px;transform:rotate(-7deg)}
.c-map .rd2{top:-10%;bottom:-10%;left:42%;width:18px;transform:rotate(14deg)}
.pin{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.pin svg{width:84px;height:84px;filter:drop-shadow(0 14px 22px #e3061388)}
.pin span{background:#fff;color:var(--bk);border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px}
.c-map .btn{position:absolute;left:24px;bottom:24px}
.c-map .addr{position:absolute;left:24px;top:24px;right:24px}
.c-map .addr b{display:block;font:italic 900 22px Montserrat,sans-serif;text-transform:uppercase;margin-top:12px}
.c-map .addr>span:last-child{display:block;color:#a1a1aa;font-weight:700;margin-top:6px}
.c-form{grid-column:span 5;padding:30px}
.c-form h3{font-size:22px;margin-bottom:8px}
.c-form p{color:var(--mu);font-size:14.5px;margin-bottom:20px}
.fld{display:block;margin-bottom:12px}
.fld input,.fld select{width:100%;height:54px;border-radius:12px;background:var(--bg);border:1.5px solid var(--ln);color:var(--bk);padding:0 18px;outline:0;transition:.2s;appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--rd);background:#fff}
.c-form .btn{width:100%}
.c-form .note{font-size:12px;color:var(--mu);margin-top:10px}
.c-info{grid-column:span 12;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--rd);color:#fff}
.c-info>div{display:flex;align-items:center;gap:12px}
.c-info small{display:block;color:#ffd0d3;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.c-info b{font-weight:800;font-size:17px}
footer{padding:28px 0 34px;color:#a1a1aa;font-size:14px;background:var(--bk)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.soc{display:flex;gap:8px}
.soc a{width:44px;height:44px;border-radius:12px;background:#ffffff12;display:grid;place-items:center;color:#fff;transition:.2s}
.soc a:hover{background:var(--rd)}
.fab{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:10px;height:60px;padding:0 22px 0 18px;border-radius:16px;background:#25d366;color:#fff;font-weight:800;box-shadow:0 14px 34px -10px #25d366aa}
.fab .ic{width:26px;height:26px}
.mbar{display:none}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
@media(max-width:1180px){
 nav{display:none}.burger{display:grid}
 body.nav-open nav{display:flex;position:fixed;top:86px;left:16px;right:16px;flex-direction:column;background:#fff;border-radius:20px;padding:14px;margin:0;box-shadow:0 20px 40px -20px #0006}
 body.nav-open nav a{font-size:18px;padding:12px 14px}
 .track{grid-auto-columns:calc((100% - 28px)/3)}
}
@media(max-width:900px){
 .wrap{padding:0 16px}
 .ph span,.bar>.hr>.btn{display:none}
 .hero{padding-top:96px;min-height:0}
 .bento{grid-template-columns:repeat(2,1fr);grid-template-rows:none;height:auto;min-height:0}
 .b-main{grid-column:span 2;grid-row:auto;padding:10px 0 14px}
 .b-live,.b-ph{grid-column:span 2;min-height:150px}
 .b-rate,.b-ig{grid-column:span 1;min-height:150px}
 .b-live small.hrs{display:none}
 .dirs{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
 .dir{min-height:160px}
 .dir.big,.dir.big.v{grid-column:span 2;grid-row:auto;min-height:210px}
 .res{grid-template-columns:1fr 1fr}
 .steps{grid-template-columns:1fr}
 .track,.rtrack{grid-auto-columns:78%}
 .prices{grid-template-columns:1fr 1fr}
 .sch{grid-template-columns:1fr}
 .days{flex-direction:row;overflow-x:auto}
 .days button{flex:none;flex-direction:column;gap:2px;padding:10px 14px}
 .slot{grid-template-columns:76px 1fr auto;gap:10px}.slot .ib{display:none}.slot .tm{font-size:19px}
 .cb{grid-template-columns:1fr}
 .c-map,.c-form,.c-info{grid-column:auto}
 .c-map{min-height:340px}
 .sec{padding:52px 0}
 .fab{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;padding:8px;border-radius:18px;background:#fffffff2;backdrop-filter:blur(12px);box-shadow:0 14px 40px -12px #0007}
 .mbar a{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;background:var(--bg)}
 .mbar a.wa{background:#25d366;color:#fff}
 .mbar a .ic{width:20px;height:20px}
 footer{padding-bottom:110px}
}
@media(max-width:560px){
 .bar{padding-left:14px;gap:8px}
 .jlogo{height:32px}
 .b-main h1{font-size:40px}
 .b-main .ctas .btn{flex:1 1 100%}
 .dirs{gap:10px}.dir{min-height:140px;padding:16px}.dir p{display:none}.dir h3{font-size:14px}.dir .go{display:none}
 .dir.big p{display:block}.dir.big h3{font-size:26px}
 .prices{grid-template-columns:1fr}
 .nx .tm{font-size:34px}.nx b{font-size:18px}
 .slot a{display:none}.slot{grid-template-columns:76px 1fr}
}
</style>
</head>
<body>
<header class="hd"><div class="in"><div class="bar">
 <a href="#top" id="lg" aria-label="JFC GYM"></a>
 <nav><a href="#dirs" data-t="nav_dirs"></a><a href="#coaches" data-t="nav_coaches"></a><a href="#prices" data-t="nav_prices"></a><a href="#schedule" data-t="nav_schedule"></a><a href="#reviews" data-t="nav_reviews"></a><a href="#contacts" data-t="nav_contacts"></a></nav>
 <div class="hr">
  <div class="lang"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
  <a class="ph" data-link="tel" id="hph"></a>
  <a class="btn btn-r" data-link="wa" id="hwa"></a>
  <button class="burger" data-burger aria-label="Меню" id="hbg"></button>
 </div>
</div></div></header>

<section class="hero red tris" id="top"><div class="wrap">
 <div class="bento">
  <div class="b-main rv">
   <div>
    <span class="ban k"><span data-t="hero_kicker"></span></span>
    <h1 data-th="hero_title"></h1>
    <p data-t="hero_sub"></p>
   </div>
   <div class="ctas"><a class="btn btn-w" data-link="wa" id="h1"></a><a class="btn btn-k" href="#schedule" id="h2"></a></div>
  </div>
  <div class="card b-live rv">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="live" data-open></span><small class="hrs" data-t="loc_hours"></small></div>
   <div class="nx"><div><small data-t="next_class"></small><b id="nxd"></b></div><span class="tm" id="nxt"></span></div>
  </div>
  <div class="card b-rate rv"><div class="stars" id="hst"></div><div><b>4.9</b><span data-t="reviews_sub"></span></div></div>
  <a class="card b-ig rv" data-link="ig" id="big"></a>
  <div class="card b-ph rv">
   <small data-t="loc_phone_l"></small>
   <a class="big" data-link="tel" id="bph"></a>
   <div class="row"><a class="btn btn-g" data-link="wa" id="bwa"></a><a class="btn btn-l" data-link="gis" id="bgis"></a></div>
  </div>
 </div>
</div></section>

<div class="hls"><div class="wrap" id="hls"></div></div>

<section class="sec" id="dirs"><div class="wrap">
 <div class="sh rv"><div><span class="ban"><span data-t="dirs_kicker"></span></span><h2 data-t="dirs_title"></h2></div><p data-t="dirs_sub"></p></div>
 <div class="dirs" id="dirsg"></div>
</div></section>

<section class="sec red tris" id="results"><div class="wrap">
 <div class="sh rv"><div><span class="ban k"><span data-t="res_kicker"></span></span><h2 data-t="res_title"></h2></div><a class="btn btn-w" data-link="ig" id="igb"></a></div>
 <div class="res" id="resg"></div>
</div></section>

<section class="sec" id="why"><div class="wrap">
 <div class="sh rv"><div><span class="ban"><span data-t="steps_kicker"></span></span><h2 data-t="steps_title"></h2></div></div>
 <div class="steps" id="steps"></div>
</div></section>

<section class="sec dark tris" id="coaches"><div class="wrap">
 <div class="sh rv"><div><span class="ban"><span data-t="coaches_kicker"></span></span><h2 data-t="coaches_title"></h2></div><div class="arrows" data-for="coachg"></div></div>
 <div class="track" id="coachg"></div>
</div></section>

<section class="sec" id="prices"><div class="wrap">
 <div class="sh rv"><div><span class="ban"><span data-t="prices_kicker"></span></span><h2 data-t="prices_title"></h2></div></div>
 <div class="prices" id="priceg"></div>
 <p class="pnote" id="pnote"></p>
</div></section>

<section class="sec" id="schedule" style="padding-top:0"><div class="wrap">
 <div class="sh rv"><div><span class="ban"><span data-t="sched_kicker"></span></span><h2 data-t="sched_title"></h2></div><p data-t="sched_sub"></p></div>
 <div class="sch rv"><div class="card days" id="days"></div><div class="card slots" id="slots"></div></div>
</div></section>

<section class="sec red tris" id="reviews"><div class="wrap">
 <div class="sh rv"><div><span class="ban k"><span data-t="reviews_kicker"></span></span><h2 data-t="reviews_title"></h2></div><div class="arrows" data-for="revg"></div></div>
 <div class="track rtrack" id="revg"></div>
</div></section>

<section class="sec dark tris" id="contacts"><div class="wrap">
 <div class="sh rv"><div><span class="ban"><span data-t="loc_kicker"></span></span><h2 data-t="loc_title"></h2></div></div>
 <div class="cb rv">
  <div class="card c-map">
   <div class="rd1"></div><div class="rd2"></div>
   <div class="addr"><span class="ban"><span data-t="loc_addr_l"></span></span><b data-t="loc_addr"></b><span data-t="loc_hours"></span></div>
   <div class="pin"><svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="6,8 58,8 32,58" fill="#e30613"/><text x="32" y="30" text-anchor="middle" font-family="Montserrat,Arial Black" font-weight="900" font-style="italic" font-size="14" fill="#fff">JFC</text></svg><span data-open></span></div>
   <a class="btn btn-r" data-link="gis" id="mgis"></a>
  </div>
  <div class="card c-form">
   <h3 data-t="form_title"></h3><p data-t="form_sub"></p>
   <form data-waform>
    <label class="fld"><input id="fname" name="name" required data-tp="form_name"></label>
    <label class="fld"><input id="fphone" name="phone" type="tel" required placeholder="+996 ___ __ __ __"></label>
    <label class="fld"><select name="dir" id="fdir"></select></label>
    <button class="btn btn-g" type="submit" id="fsend"></button>
    <p class="note" data-t="form_note"></p>
   </form>
  </div>
  <div class="card c-info"><div id="ci1"></div><div id="ci2"></div><div id="ci3"></div></div>
 </div>
</div></section>

<footer><div class="wrap"><a href="#top" id="lg2" aria-label="JFC GYM"></a><span>© 2026 <span data-t="footer"></span></span><div class="soc"><a data-link="ig" aria-label="Instagram"></a><a data-link="wa" aria-label="WhatsApp"></a><a data-link="gis" aria-label="2GIS"></a></div></div></footer>
<a class="fab" data-link="wa" id="fab"></a>
<div class="mbar"><a data-link="tel" id="m1"></a><a class="wa" data-link="wa" id="m2"></a><a data-link="gis" id="m3"></a></div>

<script src="data.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);let sel=null;
window.render=function(){
 const J=window.JFC,{t,L,icon,dirs,coaches,prices,schedule,reviews,days,daysFull,portrait}=J;
 const ib=(k,x)=>icon(k)+'<span>'+x+'</span>';
 $('lg').innerHTML=J.logo('#111');$('lg2').innerHTML=J.logo('#fff');
 $('hph').innerHTML=ib('phone',J.C.phone);$('hwa').innerHTML=ib('wa',t('cta_wa_s'));$('hbg').innerHTML=icon('menu');
 $('h1').innerHTML=ib('wa',t('cta_trial'));$('h2').innerHTML=ib('clock',t('nav_schedule'));
 $('hst').innerHTML=icon('star').repeat(5);
 $('big').innerHTML=icon('ig')+`<div><b>71,6K</b><span>${t('st3_l')}</span></div>`;
 $('bph').innerHTML=icon('phone')+J.C.phone;$('bwa').innerHTML=ib('wa',t('cta_wa_s'));$('bgis').innerHTML=ib('pin',t('cta_route_s'));
 const nx=J.nextClass(); if(nx){$('nxd').textContent=nx.dir+(nx.k?' · '+days[J.lang][nx.day]:'');$('nxt').textContent=nx.time;}
 $('hls').innerHTML=J.highlights.map(([k,l,h])=>`<a class="hl" href="${h}"><span class="c">${J.hl(k)}</span>${t(l)}</a>`).join('');
 $('dirsg').innerHTML=dirs.map((d,i)=>`<a class="card dir rv ${i<2?'big':''} ${i===1?'v':''}" href="${J.waLink(t('wa_msg')+' '+L(d)[0])}" target="_blank" rel="noopener">${i===0?'<span class="tri"></span>':''}<span class="ib">${icon(d.ic)}</span><span class="go">${icon('arrow')}</span><div style="position:relative"><h3>${L(d)[0]}</h3><p>${L(d)[1]}</p></div></a>`).join('');
 $('igb').innerHTML=ib('ig','@jfc_gym.kg');
 $('resg').innerHTML=[['level',1],['medal',2],['kick',3],['ig',4]].map(([k,i])=>`<div class="rs rv"><span class="bgt"></span>${icon(k)}<b>${t('res'+i+'_n')}${i===1?'<small>'+t('res1_u')+'</small>':''}</b><p>${t('res'+i+'_t')}</p></div>`).join('');
 $('steps').innerHTML=[1,2,3].map(i=>`<div class="card st rv"><span class="n">${i}</span><div><h3>${t('step'+i+'_t')}</h3><p>${t('step'+i+'_d')}</p></div></div>`).join('');
 $('coachg').innerHTML=coaches.map((c,i)=>`<div class="card co rv"><div class="pic">${portrait(i,i%2?'#e30613':'#ececee',i%2?'#7a0009':'#bdbdc3','#101011')}<span class="exp">${c.exp} ${t('exp')}</span></div><div class="tx"><h3>${c.n}</h3><div class="rl">${L(c)}</div><span class="tg">${L(c.tag)}</span></div></div>`).join('');
 $('priceg').innerHTML=prices.map(p=>`<div class="card pr rv ${p.hit?'hit':''}">${p.hit?`<span class="ban k hb"><span>${t('popular')}</span></span>`:''}<div class="pt">${L(p)[0]}</div><div class="pp">${p.p}</div><div class="pu">${t('som')} ${L(p.u)}</div><ul>${L(p)[1].map(f=>`<li>${icon('check')}${f}</li>`).join('')}</ul><a class="btn ${p.hit?'btn-w':'btn-k'}" href="${J.waLink(t('wa_msg')+' '+L(p)[0]+' — '+p.p+' '+t('som'))}" target="_blank" rel="noopener">${t('price_cta')}</a></div>`).join('');
 $('pnote').innerHTML=t('prices_sub').replace(/^([^.]+\.)/,'<b>$1</b>');
 const today=J.bishkekNow().day; if(sel===null) sel=today;
 const draw=()=>{
  $('days').innerHTML=daysFull[J.lang].map((d,i)=>`<button class="${i===sel?'on':''}" data-d="${i}">${d}${i===today?`<small>${t('today')}</small>`:''}</button>`).join('');
  const l=schedule.filter(r=>r.t[sel]).sort((a,b)=>a.t[sel].localeCompare(b.t[sel]));
  $('slots').innerHTML=`<h3>${icon('clock')}${daysFull[J.lang][sel]}</h3>`+(l.length?l.map(r=>`<div class="slot"><span class="tm">${r.t[sel]}</span><span class="ib">${icon(dirs[r.d].ic)}</span><div><b>${L(dirs[r.d])[0]}</b><span>${L(dirs[r.d])[1]}</span></div><a href="${J.waLink(t('wa_msg')+' '+L(dirs[r.d])[0]+', '+daysFull[J.lang][sel]+' '+r.t[sel])}" target="_blank" rel="noopener">${t('cta_trial_s')}</a></div>`).join(''):`<p class="empty">${t('no_classes')}</p>`);
 };
 draw();$('days').onclick=e=>{const b=e.target.closest('button');if(b){sel=+b.dataset.d;draw();}};
 $('revg').innerHTML=reviews.map(r=>`<div class="card rvw rv"><div class="stars">${icon('star').repeat(5)}</div><p>«${L(r)}»</p><div class="who"><span class="av">${r.n[0]}</span><div><b>${r.n}</b><small>${L(r.s)}</small></div></div></div>`).join('');
 $('mgis').innerHTML=ib('pin',t('cta_route'));
 $('fdir').innerHTML=`<option value="">${t('form_dir')}</option>`+dirs.map(d=>`<option>${L(d)[0]}</option>`).join('');
 $('fsend').innerHTML=ib('wa',t('form_send'));
 $('ci1').innerHTML=`${icon('phone')}<div><small>${t('loc_phone_l')}</small><a href="tel:${J.C.tel}"><b>${J.C.phone}</b></a></div>`;
 $('ci2').innerHTML=`${icon('clock')}<div><small>${t('loc_hours_l')}</small><b>${t('loc_hours')}</b></div>`;
 $('ci3').innerHTML=`${icon('ig')}<div><small>Instagram</small><a href="${J.C.ig}" target="_blank" rel="noopener"><b>@jfc_gym.kg · 71,6K</b></a></div>`;
 document.querySelectorAll('.soc a').forEach((a,i)=>a.innerHTML=icon(['ig','wa','pin'][i]));
 $('fab').innerHTML=ib('wa','WhatsApp');
 $('m1').innerHTML=ib('phone',t('cta_call'));$('m2').innerHTML=ib('wa','WhatsApp');$('m3').innerHTML=ib('pin','2ГИС');
 document.querySelectorAll('.arrows').forEach(a=>{const tr=$(a.dataset.for);a.innerHTML=`<button aria-label="Назад">${icon('arrow')}</button><button aria-label="Вперёд">${icon('arrow')}</button>`;
  a.onclick=e=>{const b=e.target.closest('button');if(!b)return;const dir=b===a.firstChild?-1:1;tr.scrollBy({left:dir*(tr.firstElementChild.offsetWidth+14),behavior:'smooth'});};});
};
})();
</script>
</body>
</html>
