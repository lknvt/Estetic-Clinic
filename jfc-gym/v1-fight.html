<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JFC Gym — Fight Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
:root{--bk:#0b0b0c;--bk2:#151517;--bk3:#1f1f22;--rd:#e3001b;--rd2:#ff2a3d;--wh:#fff;--gr:#a9a9ae;--ln:#ffffff1a;--paper:#f4f3f1;--ink:#111}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bk);color:var(--wh);font:400 16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
.ic{width:22px;height:22px;flex:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
h1,h2,h3,.os{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.kick{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--rd2)}
.kick:before{content:"";width:28px;height:3px;background:var(--rd)}
.sec{padding:72px 0}
.sec h2{font-size:clamp(34px,4.4vw,58px);margin:14px 0 12px}
.sec .lead{color:var(--gr);max-width:560px}
.light{background:var(--paper);color:var(--ink)}
.light .lead{color:#55555b}
.light .kick{color:var(--rd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border:0;cursor:pointer;font:600 15px Inter;transition:.2s;white-space:nowrap;clip-path:polygon(0 0,100% 0,100% 70%,calc(100% - 14px) 100%,0 100%)}
.btn-r{background:var(--rd);color:#fff}.btn-r:hover{background:var(--rd2);transform:translateY(-2px)}
.btn-o{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #ffffff55}.btn-o:hover{box-shadow:inset 0 0 0 1.5px #fff}
.btn-w{background:#fff;color:var(--bk)}.btn-w:hover{background:#ffe3e6}
.btn-g{background:#1db954;color:#fff}.btn-g:hover{filter:brightness(1.08)}
/* header */
.hd{position:fixed;inset:0 0 auto;z-index:50;background:#0b0b0ccc;backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.hd .wrap{display:flex;align-items:center;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font:700 22px/1 Oswald;background:var(--rd);padding:8px 10px 7px;letter-spacing:.04em;clip-path:polygon(0 0,100% 0,100% 72%,82% 100%,0 100%)}
.logo span{font:600 12px/1.15 Inter;text-transform:uppercase;letter-spacing:.12em;color:var(--gr)}
.logo span i{display:block;font:700 16px Oswald;color:#fff;font-style:normal;letter-spacing:.06em}
nav{display:flex;gap:22px;margin-left:12px}
nav a{font-size:14px;font-weight:500;color:#d6d6da;transition:.2s}
nav a:hover{color:var(--rd2)}
.hr{margin-left:auto;display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--ln)}
.lang button{background:none;border:0;color:var(--gr);font:600 12px Inter;padding:7px 9px;cursor:pointer}
.lang button.on{background:#fff;color:var(--bk)}
.ph{display:flex;align-items:center;gap:8px;font:600 17px Oswald;letter-spacing:.03em}
.ph .ic{color:var(--rd2)}
.hd .btn{height:42px;padding:0 18px;font-size:14px}
.burger{display:none;background:none;border:0;color:#fff;cursor:pointer}
/* hero */
.hero{position:relative;min-height:100svh;max-height:980px;display:flex;flex-direction:column;justify-content:center;padding:110px 0 0;overflow:hidden;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 78% 45%,#e3001b55,transparent 70%),linear-gradient(180deg,#0b0b0c 0%,#120607 100%);z-index:-2}
.bigjfc{position:absolute;left:-2vw;bottom:-6vw;font:700 34vw/0.8 Oswald;color:transparent;-webkit-text-stroke:1.5px #ffffff10;z-index:-1;letter-spacing:-.02em;pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;width:100%}
.hero h1{font-size:clamp(52px,7.4vw,112px);line-height:.92;margin:20px 0 22px}
.hero h1 .r{color:var(--rd);display:block}
.hero h1 .o{display:block;color:transparent;-webkit-text-stroke:2px #fff}
.hero p.sub{font-size:18px;color:#cfcfd4;max-width:540px;margin-bottom:30px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.badge{position:absolute;top:8%;right:4%;background:#fff;color:var(--bk);font:700 15px Oswald;padding:14px 16px;transform:rotate(6deg);text-transform:uppercase;box-shadow:8px 8px 0 var(--rd)}
.cage{position:relative;aspect-ratio:1;max-width:520px;margin-left:auto;width:100%}
.cage svg{width:100%;height:100%}
.chip{position:absolute;display:flex;align-items:center;gap:8px;background:#111113ee;border:1px solid var(--ln);padding:10px 14px;font-size:14px;font-weight:600;backdrop-filter:blur(8px)}
.chip .ic{color:var(--rd2);width:18px;height:18px}
.c1{left:-4%;top:30%}.c2{right:-2%;top:56%}.c3{left:12%;bottom:8%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln);margin-top:48px}
.stats div{padding:22px 24px 26px;border-right:1px solid var(--ln)}
.stats div:last-child{border:0}
.stats b{display:block;font:700 44px/1 Oswald;color:#fff}
.stats b em{color:var(--rd);font-style:normal}
.stats span{font-size:14px;color:var(--gr)}
/* ticker */
.tick{background:var(--rd);overflow:hidden;white-space:nowrap;transform:rotate(-1.2deg);margin:-8px -10px 0;position:relative;z-index:2}
.tick div{display:inline-flex;gap:38px;padding:14px 0;animation:mq 28s linear infinite;font:700 24px Oswald;text-transform:uppercase;letter-spacing:.04em}
.tick i{font-style:normal;opacity:.55}
@keyframes mq{to{transform:translateX(-50%)}}
/* adv */
.adv{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.advg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ad{background:#fff;padding:26px;border-left:4px solid var(--rd);box-shadow:0 10px 30px -18px #0004;transition:.25s}
.ad:hover{transform:translateY(-4px)}
.ad .ic{width:34px;height:34px;color:var(--rd);margin-bottom:14px}
.ad h3{font-size:22px;margin-bottom:8px}
.ad p{font-size:15px;color:#55555b}
.big-q{font:700 clamp(30px,3.4vw,44px)/1.05 Oswald;text-transform:uppercase;margin:16px 0}
.big-q em{color:var(--rd);font-style:normal}
/* dirs */
.head2{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:34px;flex-wrap:wrap}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--ln);border:1px solid var(--ln)}
.dir{background:var(--bk);padding:26px 24px 28px;min-height:210px;display:flex;flex-direction:column;position:relative;transition:.3s;overflow:hidden}
.dir .n{position:absolute;right:18px;top:12px;font:700 54px Oswald;color:#ffffff0d;transition:.3s}
.dir .ic{width:40px;height:40px;color:var(--rd2);margin-bottom:auto;transition:.3s}
.dir h3{font-size:26px;margin:22px 0 8px}
.dir p{font-size:14px;color:var(--gr);transition:.3s}
.dir:hover{background:var(--rd)}
.dir:hover .ic,.dir:hover p{color:#fff}
.dir:hover .n{color:#ffffff30}
/* coaches */
.coaches{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.co{background:#fff;position:relative;overflow:hidden;transition:.3s}
.co:hover{transform:translateY(-6px);box-shadow:0 22px 40px -22px #0006}
.co .pic{aspect-ratio:4/5;position:relative;overflow:hidden}
.co .pic svg{width:100%;height:100%;display:block;transition:.5s}
.co:hover .pic svg{transform:scale(1.05)}
.co .exp{position:absolute;left:0;bottom:0;background:var(--rd);color:#fff;font:700 15px Oswald;padding:6px 10px;letter-spacing:.03em}
.co .tx{padding:14px 14px 18px}
.co h3{font-size:19px;line-height:1.1}
.co .rl{font-size:13px;font-weight:600;color:var(--rd);margin:6px 0 4px}
.co .tg{font-size:12px;color:#6a6a70}
/* prices */
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch}
.pr{background:var(--bk2);border:1px solid var(--ln);padding:30px 26px;display:flex;flex-direction:column;position:relative;transition:.3s}
.pr:hover{border-color:#ffffff40}
.pr h3{font-size:22px;color:#e9e9ec}
.pr .pp{font:700 54px/1 Oswald;margin:20px 0 4px}
.pr .pp small{font:500 15px Inter;color:var(--gr);margin-left:6px;text-transform:none}
.pr ul{list-style:none;margin:20px 0 26px;display:grid;gap:10px;font-size:14.5px;color:#d2d2d6}
.pr li{display:flex;gap:10px}
.pr li .ic{width:18px;height:18px;color:var(--rd2);margin-top:2px}
.pr .btn{margin-top:auto;width:100%}
.pr.hit{background:var(--rd);border-color:var(--rd);transform:translateY(-12px);box-shadow:0 30px 60px -30px #e3001b}
.pr.hit li .ic{color:#fff}.pr.hit ul{color:#fff}.pr.hit .pp small{color:#ffd2d6}
.pr .hb{position:absolute;top:-13px;left:26px;background:#fff;color:var(--rd);font:700 12px Inter;text-transform:uppercase;letter-spacing:.1em;padding:6px 10px}
.pnote{margin-top:26px;color:var(--gr);font-size:15px;display:flex;gap:10px;align-items:center}
/* schedule */
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:15px;box-shadow:0 20px 50px -30px #0005}
.tbl th,.tbl td{padding:13px 10px;text-align:center;border-bottom:1px solid #eee}
.tbl th{font:600 13px Inter;text-transform:uppercase;letter-spacing:.08em;color:#777;background:#fafafa}
.tbl td:first-child,.tbl th:first-child{text-align:left;padding-left:20px;font-weight:700}
.tbl td:first-child{font-family:Oswald;text-transform:uppercase;font-size:17px;font-weight:600;letter-spacing:.02em}
.tbl td .tm{display:inline-block;background:#111;color:#fff;font-weight:600;font-size:14px;padding:4px 9px}
.tbl .td{background:#ffeef0}
.tbl th.td{background:var(--rd);color:#fff}
.tbl td.td .tm{background:var(--rd)}
.tbl .dash{color:#ccc}
.schm{display:none}
/* reviews */
.rvhead{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:16px;background:var(--bk2);border:1px solid var(--ln);padding:14px 20px}
.score b{font:700 48px/1 Oswald}
.stars{display:flex;gap:2px;color:#ffc531}.stars .ic{width:18px;height:18px}
.score small{display:block;color:var(--gr);font-size:13px}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rvw{background:var(--bk2);border:1px solid var(--ln);padding:24px;position:relative;transition:.3s}
.rvw:hover{border-color:var(--rd)}
.rvw .q{position:absolute;right:18px;top:16px;font:700 70px/1 Oswald;color:var(--rd);opacity:.35}
.rvw p{color:#dcdce0;font-size:15px;margin:12px 0 18px}
.rvw .who{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;display:grid;place-items:center;background:var(--rd);font:700 18px Oswald}
.who b{display:block;font-size:15px}.who small{color:var(--gr);font-size:13px}
/* contacts */
.ct{display:grid;grid-template-columns:1.05fr .95fr;gap:0;box-shadow:0 30px 60px -30px #0007}
.ctl{background:var(--rd);padding:36px 40px;position:relative;overflow:hidden}
.ctl:after{content:"JFC";position:absolute;right:-20px;bottom:-60px;font:700 220px/1 Oswald;color:#ffffff14}
.ctl h2{font-size:clamp(34px,4vw,52px);margin:12px 0 26px}
.ctl .kick{color:#fff}.ctl .kick:before{background:#fff}
.bigph{display:block;font:700 clamp(34px,4.2vw,56px)/1 Oswald;margin-bottom:24px;letter-spacing:.02em}
.bigph:hover{text-decoration:underline}
.inf{display:grid;gap:14px;margin-bottom:28px;position:relative;z-index:1}
.inf div{display:flex;gap:12px;align-items:flex-start}
.inf small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.75}
.inf b{font-weight:600}
.openb{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0a7d33;font-size:13px;font-weight:700;padding:5px 10px;margin-bottom:18px}
.openb:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pl 1.6s infinite}
.openb.closed{color:#999}
@keyframes pl{50%{opacity:.3}}
.ctl .ctas{position:relative;z-index:1}
.ctr{background:var(--bk2);padding:36px 40px;border:1px solid var(--ln)}
.ctr h3{font-size:30px;margin-bottom:10px}
.ctr p{color:var(--gr);font-size:15px;margin-bottom:24px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gr);margin-bottom:6px}
.fld input,.fld select{width:100%;height:48px;background:var(--bk);border:1px solid #ffffff26;color:#fff;padding:0 16px;outline:0;transition:.2s;border-radius:0;appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--rd)}
.ctr .btn{width:100%;margin-top:6px}
.ctr .note{font-size:12px;color:#77777d;margin-top:12px}
.map{height:150px;margin-top:18px;background:linear-gradient(#ffffff08 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/28px 28px,var(--bk);position:relative;display:grid;place-items:center;border:1px solid var(--ln)}
.map:before{content:"";position:absolute;left:0;right:0;top:55%;height:14px;background:#ffffff14;transform:rotate(-8deg)}
.map:after{content:"";position:absolute;top:0;bottom:0;left:38%;width:12px;background:#ffffff10;transform:rotate(12deg)}
.map a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.map a .ic{width:46px;height:46px;color:var(--rd2);filter:drop-shadow(0 6px 10px #e3001b88)}
.map a span{background:#fff;color:#111;padding:6px 12px;font-size:13px}
footer{border-top:1px solid var(--ln);padding:28px 0 30px;color:#77777d;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer .soc{display:flex;gap:12px}
footer .soc a{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--ln);color:#fff;transition:.2s}
footer .soc a:hover{background:var(--rd);border-color:var(--rd)}
.fab{position:fixed;right:22px;bottom:22px;z-index:60;width:62px;height:62px;border-radius:50%;background:#1db954;display:grid;place-items:center;box-shadow:0 10px 30px -6px #1db95499;animation:bob 3s ease-in-out infinite}
.fab .ic{width:30px;height:30px;color:#fff}
@keyframes bob{50%{transform:translateY(-5px)}}
.mbar{display:none}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.tick div,.fab{animation:none}}
/* responsive */
@media(max-width:1180px){nav{display:none}.burger{display:block}
 body.nav-open nav{display:flex;position:fixed;top:72px;left:0;right:0;flex-direction:column;background:#0b0b0cf5;padding:20px 32px 28px;gap:16px;border-bottom:1px solid var(--ln)}
 body.nav-open nav a{font-size:20px}
 .coaches{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
 .wrap{padding:0 18px}
 .hd .btn,.ph span{display:none}
 .hero{padding-top:96px;max-height:none}
 .hero .wrap{grid-template-columns:1fr}
 .cage{max-width:340px;margin:10px auto 0;order:2}
 .badge{top:auto;bottom:10px;right:8px;font-size:13px}
 .stats{grid-template-columns:1fr 1fr;margin-top:24px}
 .stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--ln)}
 .stats b{font-size:34px}
 .adv,.ct{grid-template-columns:1fr}
 .dirs,.prices{grid-template-columns:1fr 1fr}
 .pr.hit{transform:none}
 .revs{grid-template-columns:1fr}
 .ctl,.ctr{padding:30px 22px}
 .sec{padding:56px 0}
 .tbl{display:none}.schm{display:block}
 .fab{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1.3fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#0b0b0cf2;backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:8px}
 .mbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;font-size:12px;font-weight:600;background:var(--bk3)}
 .mbar a.wa{background:#1db954}
 .mbar a .ic{width:20px;height:20px}
 footer{padding-bottom:100px}
}
@media(max-width:560px){
 .hero h1{font-size:50px}
 .hero p.sub{font-size:16px}
 .ctas .btn{flex:1 1 calc(50% - 6px);padding:0 12px}.ctas .btn:first-child{flex-basis:100%}
 .cage{max-width:260px}.chip{font-size:12px;padding:7px 10px}.badge{font-size:12px;padding:10px 12px}
 .ad{padding:18px 16px}.ad h3{font-size:18px}.ad p{font-size:13.5px}.ad .ic{width:28px;height:28px;margin-bottom:10px}
 .dirs{grid-template-columns:1fr}
 .dir{min-height:0;padding:20px;display:grid;grid-template-columns:44px 1fr;column-gap:14px}
 .dir .ic{grid-row:span 2;margin:0}.dir h3{margin:0 0 4px;font-size:22px}
 .coaches{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:62%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 8px}
 .co{scroll-snap-align:start}
 .prices{grid-template-columns:1fr}
 .c1{left:0}.c2{right:0}
}
/* mobile schedule */
.dtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.dtabs button{flex:1 0 auto;min-width:46px;height:44px;border:1px solid #ddd;background:#fff;font-weight:700;cursor:pointer}
.dtabs button.on{background:var(--rd);border-color:var(--rd);color:#fff}
.dlist{display:grid;gap:8px}
.dlist div{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 16px;border-left:4px solid var(--rd)}
.dlist b{font:600 18px Oswald;text-transform:uppercase}
.dlist span{font-weight:700}
</style>
</head>
<body>
<header class="hd">
 <div class="wrap">
  <a href="#top" class="logo"><b>JFC</b><span><i>GYM</i><em data-t="brand_sub" style="font-style:normal"></em></span></a>
  <nav>
   <a href="#dirs" data-t="nav_dirs"></a><a href="#coaches" data-t="nav_coaches"></a><a href="#prices" data-t="nav_prices"></a>
   <a href="#schedule" data-t="nav_schedule"></a><a href="#reviews" data-t="nav_reviews"></a><a href="#contacts" data-t="nav_contacts"></a>
  </nav>
  <div class="hr">
   <div class="lang"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
   <a class="ph" data-link="tel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg><span data-phone></span></a>
   <a class="btn btn-r" data-link="wa"><span data-t="cta_wa_s"></span></a>
   <button class="burger" data-burger aria-label="Меню"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
 </div>
</header>

<section class="hero" id="top">
 <div class="bigjfc">JFC</div>
 <div class="wrap">
  <div>
   <span class="kick" data-t="fight_kicker"></span>
   <h1><span data-t="hero_title_1"></span> <span class="r" data-t="hero_title_2"></span><span class="o" data-t="hero_title_3"></span></h1>
   <p class="sub" data-t="hero_sub"></p>
   <div class="ctas">
    <a class="btn btn-r" data-link="wa" id="h-wa"></a>
    <a class="btn btn-o" data-link="tel" id="h-tel"></a>
    <a class="btn btn-o" data-link="gis" id="h-gis"></a>
   </div>
  </div>
  <div class="cage">
   <svg viewBox="0 0 400 400" aria-hidden="true">
    <defs>
     <pattern id="net" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v14M0 0h14" stroke="#ffffff22" stroke-width="1.2"/></pattern>
     <radialGradient id="glw"><stop offset="0" stop-color="#e3001b" stop-opacity=".55"/><stop offset="1" stop-color="#e3001b" stop-opacity="0"/></radialGradient>
     <clipPath id="oct"><polygon points="117,20 283,20 380,117 380,283 283,380 117,380 20,283 20,117"/></clipPath>
    </defs>
    <circle cx="200" cy="200" r="200" fill="url(#glw)"/>
    <g clip-path="url(#oct)"><rect width="400" height="400" fill="#0b0b0c"/><rect width="400" height="400" fill="url(#net)"/></g>

<script src="data.js"></script>
<script>
(function(){
const J=()=>window.JFC, $=id=>document.getElementById(id);
let selDay=null;
window.render=function(){
 const {t,L,icon,dirs,coaches,prices,schedule,reviews,days,portrait,bishkekNow}=J();
 const ib=(k,txt)=>icon(k)+'<span>'+txt+'</span>';
 $('h-wa').innerHTML=ib('wa',t('cta_trial'));$('h-tel').innerHTML=ib('phone',t('cta_call'));$('h-gis').innerHTML=ib('pin',t('cta_route_s'));
 $('c-wa').innerHTML=ib('wa',t('cta_wa'));$('c-gis').innerHTML=ib('pin',t('cta_route'));$('f-send').innerHTML=ib('wa',t('form_send'));
 $('fab').innerHTML=icon('wa');$('m-tel').innerHTML=ib('phone',t('cta_call'));$('m-wa').innerHTML=ib('wa',t('cta_wa_s'));$('m-gis').innerHTML=ib('pin','2ГИС');
 document.querySelectorAll('.soc a').forEach((a,i)=>a.innerHTML=icon(['ig','wa','pin'][i]));
 $('stats').innerHTML=[1,2,3,4].map(i=>`<div><b>${t('st'+i+'_n').replace('+','<em>+</em>')}</b><span>${t('st'+i+'_l')}</span></div>`).join('');
 const tk=dirs.map(d=>L(d)[0]).join(' <i>✦</i> ')+' <i>✦</i> ';$('tick').innerHTML=tk+tk;
 $('fline').innerHTML=t('fight_line').replace(/(\S+)$/,'<em>$1</em>');
 $('adv').innerHTML=[['medal',1],['team',2],['level',3],['clock',4]].map(([k,i])=>`<div class="ad rv">${icon(k)}<h3>${t('adv'+i+'_t')}</h3><p>${t('adv'+i+'_d')}</p></div>`).join('');
 $('dirsg').innerHTML=dirs.map((d,i)=>`<a class="dir rv" data-link="wa"><span class="n">0${i+1}</span>${icon(d.ic)}<h3>${L(d)[0]}</h3><p>${L(d)[1]}</p></a>`).join('');
 $('coachg').innerHTML=coaches.map((c,i)=>`<div class="co rv"><div class="pic">${portrait(i,i%2?'#2a2a2e':'#3a0d12',i%2?'#e3001b':'#111','#0b0b0c')}<span class="exp">${c.exp} ${t('exp')}</span></div><div class="tx"><h3>${c.n}</h3><div class="rl">${L(c)}</div><div class="tg">${L(c.tag)}</div></div></div>`).join('');
 $('priceg').innerHTML=prices.map(p=>`<div class="pr rv ${p.hit?'hit':''}">${p.hit?`<span class="hb">${t('popular')}</span>`:''}<h3>${L(p)[0]}</h3><div class="pp">${p.p}<small>${t('som')} ${L(p.u)}</small></div><ul>${L(p)[1].map(f=>`<li>${icon('check')}${f}</li>`).join('')}</ul><a class="btn ${p.hit?'btn-w':'btn-o'}" href="${J().waLink(t('wa_msg')+' '+L(p)[0]+' — '+p.p+' '+t('som'))}" target="_blank" rel="noopener">${t('price_cta')}</a></div>`).join('');
 const today=bishkekNow().day; if(selDay===null) selDay=today;
 $('tbl').innerHTML=`<tr><th></th>${days[J().lang].map((d,i)=>`<th class="${i===today?'td':''}">${d}${i===today?' · '+t('today'):''}</th>`).join('')}</tr>`+schedule.map(r=>`<tr><td>${L(dirs[r.d])[0]}</td>${r.t.map((x,i)=>`<td class="${i===today?'td':''}">${x?`<span class="tm">${x}</span>`:'<span class="dash">—</span>'}</td>`).join('')}</tr>`).join('');
 const drawDay=()=>{$('dtabs').innerHTML=days[J().lang].map((d,i)=>`<button class="${i===selDay?'on':''}" data-d="${i}">${d}</button>`).join('');
  const l=schedule.filter(r=>r.t[selDay]).sort((a,b)=>a.t[selDay].localeCompare(b.t[selDay]));
  $('dlist').innerHTML=l.length?l.map(r=>`<div><b>${L(dirs[r.d])[0]}</b><span>${r.t[selDay]}</span></div>`).join(''):`<div>${t('no_classes')}</div>`;};
 drawDay(); $('dtabs').onclick=e=>{const b=e.target.closest('button');if(b){selDay=+b.dataset.d;drawDay();}};
 $('stars').innerHTML=icon('star').repeat(5);
 $('revg').innerHTML=reviews.map(r=>`<div class="rvw rv"><span class="q">“</span><div class="stars">${icon('star').repeat(5)}</div><p>${L(r)}</p><div class="who"><span class="av">${r.n[0]}</span><div><b>${r.n}</b><small>${L(r.s)}</small></div></div></div>`).join('');
 $('fdir').innerHTML=dirs.map(d=>`<option>${L(d)[0]}</option>`).join('');
 document.querySelectorAll('.dir[data-link]').forEach(a=>{a.href=J().waLink();a.target='_blank';a.rel='noopener'});
};
})();
</script>
