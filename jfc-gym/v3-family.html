<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JFC Gym — Clean Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&family=Manrope:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
/* Чистая арена: белые стены зала, красные треугольники, чёрный шрифт, иконки как в «актуальном» */
:root{--bg:#f4f4f5;--wh:#fff;--ink:#111113;--ink2:#2b2b30;--mu:#6b6b72;--or:#e30613;--or2:#ff2b36;--orl:#fde6e7;--bl:#ececef;--mn:#f6f6f7;--yl:#ffffff;--pk:#fde6e7;--ln:#e4e4e7;--r:26px;--sh:0 24px 48px -28px #11111340}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font:500 16px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}
.ic{width:22px;height:22px;flex:none}
.wrap{max-width:1260px;margin:0 auto;padding:0 28px}
h1,h2{font-family:Montserrat,"Arial Black",sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.04}
h3{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.jlogo{height:40px;width:auto;display:block}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--or);color:#fff;padding:8px 14px 7px;font:italic 900 13px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.01em;transform:skew(-10deg)}
.pill>*{transform:skew(10deg)}
.pill .ic{width:16px;height:16px}
.sec{padding:64px 0}
.sh{text-align:center;max-width:720px;margin:0 auto 34px}
.sh h2{font-size:clamp(30px,3.6vw,46px);margin:14px 0 10px}
.sh p{color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 26px;border-radius:18px;border:0;cursor:pointer;font-weight:800;font-size:15px;transition:.25s;white-space:nowrap}
.btn-o{background:var(--or);color:#fff;box-shadow:0 12px 26px -12px #e30613aa}.btn-o:hover{background:var(--or2);transform:translateY(-2px)}
.btn-n{background:var(--ink);color:#fff}.btn-n:hover{background:var(--ink2)}
.btn-w{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ln)}.btn-w:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-g{background:#25d366;color:#fff}.btn-g:hover{filter:brightness(1.05)}
/* top strip */
.top{background:var(--or);color:#ffe1e3;font-size:13.5px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:40px;gap:16px}
.top div{display:flex;gap:22px;align-items:center}
.top span{display:flex;align-items:center;gap:7px}
.top .ic{width:16px;height:16px;color:#fff}
.top a{color:#fff;font-weight:800}
/* header */
.hd{position:sticky;top:0;z-index:50;background:#f5f3eee6;backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.2s}
.hd .wrap{display:flex;align-items:center;gap:22px;height:76px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo .mk{width:44px;height:44px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em;position:relative}
.logo .mk:after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--or);border:2px solid var(--bg)}
.logo b{display:block;font-size:19px;font-weight:800;line-height:1}
.logo small{color:var(--mu);font-size:12px;font-weight:600}
nav{display:flex;gap:24px;margin-left:16px}
nav a{font-weight:700;font-size:15px;color:var(--ink2);position:relative}
nav a:after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:2px;background:var(--or);transition:.25s}
nav a:hover:after{right:0}
.hr{margin-left:auto;display:flex;align-items:center;gap:12px}
.lang{display:flex;background:#fff;border-radius:12px;padding:3px;box-shadow:inset 0 0 0 1px var(--ln)}
.lang button{border:0;background:none;padding:7px 10px;border-radius:9px;font-weight:800;font-size:12px;color:var(--mu);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.hd .btn{height:48px;padding:0 18px;font-size:14px}
.burger{display:none;width:48px;height:48px;border-radius:14px;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--ln);color:var(--ink);cursor:pointer;place-items:center}
/* hero */
.hero{padding:28px 0 40px;min-height:calc(100svh - 116px);display:flex;align-items:center}
.hero .wrap{display:grid;grid-template-columns:1.02fr .98fr;gap:48px;align-items:center;width:100%}
.hero h1{font-size:clamp(40px,4.9vw,70px);margin:20px 0 18px}
.hero h1 em{font-style:italic;color:#fff;background:var(--or);padding:0 .16em;display:inline-block;transform:skew(-6deg);white-space:nowrap}

.hero p{color:var(--mu);font-size:18px;max-width:520px}
.aud-chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 26px}
.aud-chips span{display:flex;align-items:center;gap:7px;background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 16px -10px #11111333}
.aud-chips .ic{width:18px;height:18px;color:var(--or)}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.trust{display:flex;align-items:center;gap:14px;margin-top:28px}
.avs{display:flex}
.avs span{width:40px;height:40px;border-radius:50%;border:3px solid var(--bg);margin-left:-10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink)}
.avs span:first-child{margin-left:0}
.trust b{font-size:18px}.trust .st{display:flex;color:#ffb400}.trust .st .ic{width:16px;height:16px}
.trust small{display:block;color:var(--mu);font-size:13px}
.col{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:200px 150px 200px;gap:14px;position:relative}
.tile{border-radius:var(--r);padding:22px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:.3s}
.tile:hover{transform:translateY(-4px) rotate(-.5deg)}
.tile .bi{width:64px;height:64px;color:var(--ink)}
.tile b{font-size:22px;font-weight:800}
.tile small{display:block;color:var(--ink2);font-weight:600;font-size:13px}
.t1{background:var(--ink);color:#fff;grid-row:span 2}.t1 .bi{color:var(--or2);width:90px;height:90px}.t1 small{color:#aab4cc}
.t1 .big{font-family:Montserrat,sans-serif;font-style:italic;font-size:120px;font-weight:900;line-height:.8;position:absolute;right:-8px;bottom:-14px;color:#ffffff0d}
.t2{background:var(--or);color:#fff}.t2 .bi{color:#fff}.t2 small{color:#ffe1d4}
.t3{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ln)}
.tile .tr{position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:var(--or);opacity:.12;clip-path:polygon(0 0,100% 0,50% 86%)}
.t1 .tr{opacity:.85;width:220px;height:220px;right:-50px;top:-40px}.t2 .tr{background:#000;opacity:.18}.t4{background:var(--bl);grid-column:span 2;flex-direction:row;align-items:center;gap:18px;justify-content:flex-start}
.float{position:absolute;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;z-index:2}
.f1{left:-22px;bottom:-18px}.f2{right:-14px;top:-14px;background:var(--ink);color:#fff}.f2 .ic{color:var(--or2)}
.dotg{width:10px;height:10px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 4px #16a34a26}
.f1.closed .dotg{background:#999;box-shadow:none}
/* stats */
.stats{background:var(--ink);color:#fff;border-radius:var(--r);display:grid;grid-template-columns:repeat(4,1fr);padding:10px}
.stats div{padding:22px 26px;border-right:1px solid #ffffff18}
.stats div:last-child{border:0}
.stats b{font:italic 900 40px/1 Montserrat,sans-serif;color:var(--or2)}
.stats span{display:block;color:#b8c1d6;font-size:14px;margin-top:6px}
/* highlights */
.hls{display:flex;gap:18px;justify-content:space-between;overflow-x:auto;background:#fff;border-radius:var(--r);padding:20px 26px;margin-bottom:14px;scrollbar-width:none;box-shadow:0 1px 0 var(--ln)}
.hl{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;width:86px;text-align:center;line-height:1.2}
.hl span.c{width:76px;height:76px;border-radius:50%;padding:3px;background:#dcdce0;display:block;transition:.25s}
.hl span.c svg{width:100%;height:100%;display:block;border-radius:50%;border:3px solid #fff}
.hl:hover span.c{background:var(--or);transform:scale(1.06)}
/* audience */
.aud{background:#fff;border-radius:34px;padding:12px;box-shadow:var(--sh)}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:22px;padding:6px;width:max-content;max-width:100%;margin:0 auto 12px}
.tabs button{border:0;background:none;border-radius:16px;padding:12px 22px;font-weight:800;font-size:15px;color:var(--mu);cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s}
.tabs button.on{background:var(--ink);color:#fff}
.tabs .ic{width:18px;height:18px}
.ap{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;min-height:320px}
.ap .tx{padding:34px 36px;display:flex;flex-direction:column;justify-content:center}
.ap h3{font-size:34px;margin-bottom:12px}
.ap p{color:var(--mu);font-size:17px;margin-bottom:22px}
.ap ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.ap li{background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.ap li .ic{width:16px;height:16px;color:var(--or)}
.ap .vis{border-radius:26px;display:grid;place-items:center;position:relative;overflow:hidden}
.ap .vis .ic{width:150px;height:150px;stroke-width:1.2;color:var(--ink)}
.ap .vis .ring{position:absolute;border-radius:50%;border:2px dashed #11111322}
/* dirs */
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dir{background:#fff;border-radius:24px;padding:24px;transition:.3s;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--ln)}
.dir:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.dir .ib{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.dir .ib .ic{width:28px;height:28px}
.dir h3{font-size:19px}
.dir p{color:var(--mu);font-size:14px;line-height:1.45;flex:1}
.dir .more{display:flex;align-items:center;gap:6px;color:var(--or);font-weight:800;font-size:14px}
.dir .more .ic{width:16px;height:16px;transition:.2s}
.dir:hover .more .ic{transform:translateX(4px)}
/* coaches */
.coaches{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.co{background:#fff;border-radius:26px;padding:12px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;transition:.3s}
.co:hover{box-shadow:var(--sh);transform:translateY(-3px)}
.co .pic{border-radius:18px;overflow:hidden;aspect-ratio:1/1.15;position:relative}
.co .pic svg{width:100%;height:100%;display:block}
.co h3{font-size:18px}
.co .rl{color:var(--or);font-weight:800;font-size:14px;margin:4px 0 10px}
.co .meta{display:flex;flex-wrap:wrap;gap:6px}
.co .meta span{background:var(--bg);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--ink2)}
.co .meta span.e{background:var(--ink);color:#fff}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stp{background:#fff;border-radius:24px;padding:26px;position:relative}
.stp .n{width:52px;height:52px;background:var(--or);color:#fff;display:grid;place-items:center;font:italic 900 20px Montserrat,sans-serif;margin-bottom:16px;clip-path:polygon(0 0,100% 0,50% 92%);padding-bottom:14px}
.stp h3{font-size:19px;margin-bottom:6px}.stp p{color:var(--mu);font-size:14.5px}
/* prices */
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch}
.pr{background:#fff;border-radius:26px;padding:28px;display:flex;flex-direction:column;position:relative;box-shadow:0 1px 0 var(--ln)}
.pr h3{font-size:18px}
.pr .pp{font-family:Montserrat,sans-serif;font-style:italic;font-size:44px;font-weight:900;letter-spacing:-.04em;margin:18px 0 0;line-height:1}
.pr .pu{color:var(--mu);font-size:14px;font-weight:600}
.pr ul{list-style:none;display:grid;gap:10px;margin:20px 0 24px;font-size:14.5px}
.pr li{display:flex;gap:10px}
.pr li .ic{width:20px;height:20px;color:var(--or)}
.pr .btn{margin-top:auto}
.pr.hit{background:var(--ink);color:#fff;box-shadow:var(--sh);transform:scale(1.03)}
.pr.hit .pu{color:#aab4cc}.pr.hit li .ic{color:var(--or2)}
.pr .hb{position:absolute;top:-12px;right:22px;background:var(--or);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800}
.pnote{text-align:center;margin-top:22px;color:var(--mu)}
.pnote b{color:var(--ink)}
/* schedule */
.sbox{background:#fff;border-radius:30px;padding:10px;box-shadow:var(--sh);overflow:hidden}
.tbl{width:100%;border-collapse:separate;border-spacing:0 }
.tbl th,.tbl td{padding:12px 8px;text-align:center}
.tbl th{font-size:13px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.tbl th.td{color:var(--or)}
.tbl td:first-child,.tbl th:first-child{text-align:left;padding-left:18px}
.tbl td:first-child{font-weight:800;display:flex;align-items:center;gap:10px}
.tbl td:first-child i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.tbl td:first-child i .ic{width:18px;height:18px}
.tbl tr:not(:first-child) td{border-top:1px solid #f0ede6}
.tbl .tm{display:inline-block;border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px}
.tbl td.td{background:#fff7f3}
.tbl .dash{color:#d5d1c8}
.schm{display:none}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:6px}
.dtabs button{flex:1 0 auto;min-width:48px;height:46px;border:0;border-radius:14px;background:var(--bg);font-weight:800;cursor:pointer;color:var(--ink2)}
.dtabs button.on{background:var(--or);color:#fff}
.dlist{display:grid;gap:8px;padding:6px}
.dlist div{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px}
.dlist i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.dlist b{flex:1}.dlist span{font-weight:800;color:var(--or)}
/* reviews */
.revs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.rsum{background:var(--or);color:#fff;border-radius:26px;padding:28px;grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between}
.rsum b{font-family:Montserrat,sans-serif;font-style:italic;font-size:84px;font-weight:900;line-height:.9;letter-spacing:-.05em}
.rsum .st{display:flex;margin:10px 0}.rsum .st .ic{width:22px;height:22px}
.rsum p{color:#ffe1d4}
.rsum .btn{background:#fff;color:var(--or);width:100%}
.rvw{background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px}
.rvw .st{display:flex;color:#ffb400}.rvw .st .ic{width:16px;height:16px}
.rvw p{font-size:15px;color:var(--ink2);flex:1}
.who{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.who b{display:block;font-size:15px}.who small{color:var(--mu);font-size:13px}
/* contacts */
.ct{background:var(--ink);color:#fff;border-radius:36px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ctl{padding:34px 34px 30px}
.ctl .pill{background:var(--or);color:#fff}
.ctl h2{font-size:clamp(30px,3.4vw,44px);margin:14px 0 22px}
.bph{display:inline-flex;align-items:center;gap:12px;font-size:clamp(28px,3vw,40px);font-weight:800;letter-spacing:-.02em;margin-bottom:22px}
.bph .ic{width:34px;height:34px;color:var(--or2)}
.inf{display:grid;gap:14px;margin-bottom:26px}
.inf div{display:flex;gap:12px}
.inf .ic{color:var(--or2);margin-top:2px}
.inf small{display:block;color:#a1a1aa;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.ctl .ctas .btn-w{background:#ffffff12;color:#fff;box-shadow:inset 0 0 0 1.5px #ffffff30}
.ctr{background:#fff;color:var(--ink);border-radius:26px;padding:32px}
.ctr h3{font-size:24px;margin-bottom:8px}.ctr p{color:var(--mu);font-size:14.5px;margin-bottom:20px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:var(--ink2)}
.fld input,.fld select{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);padding:0 16px;outline:0;color:var(--ink);transition:.2s;appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--or);background:#fff}
.ctr .btn{width:100%}
.ctr .note{font-size:12px;color:var(--mu);margin-top:10px;text-align:center}
.gis{margin-top:14px;grid-column:span 2;height:120px;border-radius:24px;background:linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/26px 26px,#1e1e21;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:relative;overflow:hidden}
.gis:before{content:"";position:absolute;left:-5%;right:-5%;top:48%;height:16px;background:#ffffff14;transform:rotate(-4deg)}
.gis div{position:relative;display:flex;align-items:center;gap:14px;font-weight:800}
.gis .pinb{width:52px;height:52px;border-radius:16px;background:var(--or);display:grid;place-items:center}
.gis .btn{position:relative}
footer{padding:30px 0 36px;color:var(--mu);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.soc{display:flex;gap:8px}
.soc a{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ln);transition:.2s}
.soc a:hover{background:var(--or);color:#fff}
.fab{position:fixed;right:22px;bottom:22px;z-index:60;width:64px;height:64px;border-radius:22px;background:#25d366;display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px -10px #25d366}
.fab .ic{width:32px;height:32px}
.fab:before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid #25d366;animation:rp 2s infinite}
@keyframes rp{to{transform:scale(1.4);opacity:0}}
.mbar{display:none}
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.fab:before{animation:none}}
@media(max-width:1160px){
 nav{display:none}.burger{display:grid}
 body.nav-open nav{display:flex;position:fixed;top:116px;left:16px;right:16px;flex-direction:column;background:#fff;border-radius:24px;padding:20px 24px;margin:0;box-shadow:var(--sh);gap:16px}
 body.nav-open nav a{font-size:18px}
 .coaches{grid-template-columns:repeat(2,1fr)}
 .revs{grid-template-columns:repeat(2,1fr)}.rsum{grid-row:auto;grid-column:span 2}
}
@media(max-width:900px){
 .wrap{padding:0 16px}
 .top .hide{display:none}
 .hd .btn{display:none}
 body.nav-open nav{top:76px}
 .hero{min-height:0;padding-top:16px}
 .hero .wrap{grid-template-columns:1fr;gap:34px}
 .col{grid-template-rows:150px 150px 120px}.tile{padding:18px}.tile b{font-size:18px}.tile .bi{width:48px;height:48px}.t1 .bi{width:64px;height:64px}
 .f1{left:8px;top:auto;bottom:-16px}.f2{right:8px}
 .stats{grid-template-columns:1fr 1fr}
 .stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid #ffffff18}
 .stats b{font-size:34px}
 .ap{grid-template-columns:1fr}.ap .vis{min-height:180px;order:-1}.ap .tx{padding:22px 16px}
 .ap h3{font-size:26px}
 .dirs{grid-template-columns:1fr 1fr}
 .steps{grid-template-columns:1fr}
 .prices{grid-template-columns:1fr 1fr}.pr.hit{transform:none}
 .tbl{display:none}.schm{display:block}
 .ct{grid-template-columns:1fr;border-radius:28px}.gis{grid-column:auto;flex-direction:column;justify-content:center;gap:14px;height:auto;padding:24px}
 .ctl{padding:22px 14px}
 .ctr{padding:24px 18px}
 .sec{padding:52px 0}
 .fab{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(12px);box-shadow:0 -10px 30px -16px #11111340}
 .mbar a{height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;background:var(--bg);color:var(--ink)}
 .mbar a.wa{background:#25d366;color:#fff;flex-direction:row;gap:8px;font-size:14px}
 .mbar a .ic{width:20px;height:20px}
 footer{padding-bottom:110px}
}
@media(max-width:560px){
 .top .wrap{justify-content:center}.top .hide2{display:none}
 .logo small{display:none}
 .hero h1{font-size:40px}
 .hero p{font-size:16px}
 .ctas .btn{flex:1 1 100%}
 .tabs{width:100%}.tabs button{flex:1;padding:10px 6px;font-size:13px;justify-content:center}.tabs button .ic{display:none}
 .dirs{grid-template-columns:1fr 1fr;gap:10px}.dir{padding:16px;border-radius:20px}.dir p{display:none}.dir h3{font-size:16px}.dir .ib{width:48px;height:48px}
 .coaches{grid-template-columns:1fr}
 .co{grid-template-columns:96px 1fr}
 .prices{grid-template-columns:1fr}
 .revs{grid-template-columns:1fr}.rsum{grid-column:auto}
}
</style>
</head>
<body>
<div class="top"><div class="wrap">
 <div><span class="hide" id="tp1"></span><span class="hide2" id="tp2"></span></div>
 <div><a data-link="tel" id="tp3"></a></div>
</div></div>
<header class="hd"><div class="wrap">
 <a href="#top" class="logo" id="lg" aria-label="JFC GYM"></a>
 <nav><a href="#dirs" data-t="nav_dirs"></a><a href="#coaches" data-t="nav_coaches"></a><a href="#prices" data-t="nav_prices"></a><a href="#schedule" data-t="nav_schedule"></a><a href="#reviews" data-t="nav_reviews"></a><a href="#contacts" data-t="nav_contacts"></a></nav>
 <div class="hr">
  <div class="lang"><button data-lang="ru">RU</button><button data-lang="ky">KG</button></div>
  <a class="btn btn-o" data-link="wa" id="hwa"></a>
  <button class="burger" data-burger aria-label="Меню" id="hbg"></button>
 </div>
</div></header>

<section class="hero" id="top"><div class="wrap">
 <div class="rv">
  <span class="pill" id="hk"></span>
  <h1 data-th="hero_title"></h1>
  <p data-t="hero_sub"></p>
  <div class="aud-chips" id="chips"></div>
  <div class="ctas"><a class="btn btn-o" data-link="wa" id="h1"></a><a class="btn btn-w" data-link="tel" id="h2"></a></div>
  <div class="trust"><div class="avs"><span style="background:#e30613;color:#fff">Т</span><span style="background:#111;color:#fff">А</span><span style="background:#fde6e7">Д</span><span style="background:#fff">С</span></div><div><b>4.9</b> <span class="st" id="tst" style="display:inline-flex;vertical-align:-2px"></span><small data-t="reviews_sub"></small></div></div>
 </div>
 <div class="col rv" id="col"></div>
</div></section>

<div class="wrap"><div class="hls rv" id="hls"></div><div class="stats rv" id="stats"></div></div>

<section class="sec" id="aud"><div class="wrap">
 <div class="sh rv"><span class="pill"><span data-t="aud_kicker"></span></span><h2 data-t="adv_title"></h2></div>
 <div class="aud rv"><div class="tabs" id="atabs"></div><div class="ap" id="apanel"></div></div>
</div></section>

<section class="sec" id="dirs" style="padding-top:20px"><div class="wrap">
 <div class="sh rv"><span class="pill"><span data-t="dirs_kicker"></span></span><h2 data-t="dirs_title"></h2><p data-t="dirs_sub"></p></div>
 <div class="dirs" id="dirsg"></div>
</div></section>

<section class="sec" id="coaches"><div class="wrap">
 <div class="sh rv"><span class="pill"><span data-t="coaches_kicker"></span></span><h2 data-t="coaches_title"></h2><p data-t="coaches_sub"></p></div>
 <div class="coaches" id="coachg"></div>
</div></section>

<section class="sec" id="start"><div class="wrap">
 <div class="sh rv"><span class="pill"><span data-t="steps_kicker"></span></span><h2 data-t="steps_title"></h2></div>
 <div class="steps" id="steps"></div>
</div></section>
<section class="sec" id="prices" style="padding-top:0"><div class="wrap">
 <div class="sh rv" style="margin-bottom:28px"><span class="pill"><span data-t="prices_kicker"></span></span><h2 data-t="prices_title"></h2></div>
 <div class="prices" id="priceg"></div>
 <p class="pnote" id="pnote"></p>
</div></section>

<section class="sec" id="schedule"><div class="wrap">
 <div class="sh rv"><span class="pill"><span data-t="sched_kicker"></span></span><h2 data-t="sched_title"></h2><p data-t="sched_sub"></p></div>
 <div class="sbox rv"><table class="tbl" id="tbl"></table><div class="schm"><div class="dtabs" id="dtabs"></div><div class="dlist" id="dlist"></div></div></div>
</div></section>

<section class="sec" id="reviews"><div class="wrap">
 <div class="sh rv"><span class="pill"><span data-t="reviews_kicker"></span></span><h2 data-t="reviews_title"></h2></div>
 <div class="revs" id="revg"></div>
</div></section>

<section class="sec" id="contacts"><div class="wrap">
 <div class="ct rv">
  <div class="ctl">
   <span class="pill"><span data-t="loc_kicker"></span></span>
   <h2 data-t="loc_title"></h2>
   <a class="bph" data-link="tel" id="cph"></a>
   <div class="inf" id="cinf"></div>
   <div class="ctas"><a class="btn btn-g" data-link="wa" id="cwa"></a><a class="btn btn-w" data-link="gis" id="cgis"></a></div>
  </div>
  <div class="ctr">
   <h3 data-t="form_title"></h3><p data-t="form_sub"></p>
   <form data-waform>
    <label class="fld"><span data-t="form_name"></span><input name="name" required data-tp="form_name"></label>
    <label class="fld"><span data-t="form_phone"></span><input name="phone" type="tel" required placeholder="+996"></label>
    <label class="fld"><span data-t="form_dir"></span><select name="dir" id="fdir"></select></label>
    <button class="btn btn-o" type="submit" id="fsend"></button>
    <p class="note" data-t="form_note"></p>
   </form>
  </div>
  <a class="gis" data-link="gis"><div><span class="pinb" id="gpin"></span><span><span data-t="loc_addr"></span><br><small style="color:#a1a1aa;font-weight:600" data-open></small></span></div><span class="btn btn-o" data-t="cta_route"></span></a>
 </div>
</div></section>

<footer><div class="wrap"><a href="#top" class="logo" id="lg2" aria-label="JFC GYM"></a><span>© 2026 <span data-t="footer"></span></span><div class="soc"><a data-link="ig" aria-label="Instagram"></a><a data-link="wa" aria-label="WhatsApp"></a><a data-link="gis" aria-label="2GIS"></a></div></div></footer>
<a class="fab" data-link="wa" id="fab" aria-label="WhatsApp"></a>
<div class="mbar"><a data-link="tel" id="m1"></a><a class="wa" data-link="wa" id="m2"></a><a data-link="gis" id="m3"></a></div>

<script src="data.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);let aud=0,selDay=null;
const tint=['#fde6e7','#ececef','#fde6e7','#ececef','#fde6e7','#ececef','#fde6e7','#ececef'];
const tcol=['#e30613','#111113','#e30613','#111113','#e30613','#111113','#e30613','#111113'];
window.render=function(){
 const J=window.JFC,{t,L,icon,dirs,coaches,prices,schedule,reviews,days,portrait}=J;
 const ib=(k,x)=>icon(k)+'<span>'+x+'</span>';
 $('tp1').innerHTML=icon('pin')+t('loc_addr');$('tp2').innerHTML=icon('clock')+t('loc_hours');$('tp3').innerHTML=icon('phone')+' '+J.C.phone;
 $('hwa').innerHTML=ib('wa',t('cta_wa'));$('hbg').innerHTML=icon('menu');
 $('hk').innerHTML='<span>'+t('hero_kicker')+'</span>';
 $('lg').innerHTML=J.logo('#111');$('lg2').innerHTML=J.logo('#111');
 $('hls').innerHTML=J.highlights.map(([k,l,h])=>`<a class="hl" href="${h}"><span class="c">${J.hl(k)}</span>${t(l)}</a>`).join('');
 $('chips').innerHTML=[['team','aud_adult'],['kids','aud_kids'],['women','aud_women']].map(([k,x])=>`<span>${icon(k)}${t(x)}</span>`).join('');
 $('h1').innerHTML=ib('wa',t('cta_trial'));$('h2').innerHTML=ib('phone',J.C.phone);
 $('tst').innerHTML=icon('star').repeat(5);
 $('col').innerHTML=`<div class="tile t1"><span class="tr"></span><span class="big">MMA</span>${icon('mma','bi')}<div><b>${L(dirs[0])[0]}</b><small>${t('cage_chip')}</small></div></div>
  <div class="tile t2"><span class="tr"></span>${icon('box','bi')}<div><b>${L(dirs[1])[0]}</b></div></div>
  <div class="tile t3"><span class="tr"></span>${icon('kids','bi')}<div><b>${L(dirs[6])[0]}</b><small>${t('kids_chip')}</small></div></div>
  <div class="tile t4">${icon('gym','bi')}<div><b>${L(dirs[4])[0]}</b><small>${t('loc_hours')}</small></div></div>
  <div class="float f1 ${J.isOpen()?'':'closed'}"><span class="dotg"></span>${t(J.isOpen()?'open_now':'closed_now')}</div>
  <div class="float f2">${icon('medal')}${t('trial_badge')}</div>`;
 $('stats').innerHTML=[1,2,3,4].map(i=>`<div><b>${t('st'+i+'_n')}</b><span>${t('st'+i+'_l')}</span></div>`).join('');
 const A=[['team','aud_adult',[0,1,2,3,4,5],'#fde6e7'],['kids','aud_kids',[6,3,2],'#ececef'],['women','aud_women',[7,4,5],'#fde6e7']];
 const keys=['adult','kids','women'];
 const drawA=()=>{
  $('atabs').innerHTML=A.map((a,i)=>`<button class="${i===aud?'on':''}" data-i="${i}">${icon(a[0])}${t(a[1])}</button>`).join('');
  const a=A[aud],k=keys[aud];
  $('apanel').innerHTML=`<div class="tx"><h3>${t('aud_'+k+'_t')}</h3><p>${t('aud_'+k+'_d')}</p><ul>${a[2].map(d=>`<li>${icon('check')}${L(dirs[d])[0]}</li>`).join('')}</ul><div><a class="btn btn-o" href="${J.waLink(t('wa_msg')+' ('+t(a[1])+')')}" target="_blank" rel="noopener">${ib('wa',t('cta_trial'))}</a></div></div>
   <div class="vis" style="background:${a[3]}"><span class="ring" style="width:260px;height:260px"></span><span class="ring" style="width:380px;height:380px"></span>${icon(a[0])}</div>`;
 };
 drawA();$('atabs').onclick=e=>{const b=e.target.closest('button');if(b){aud=+b.dataset.i;drawA();}};
 $('dirsg').innerHTML=dirs.map((d,i)=>`<a class="dir rv" href="${J.waLink(t('wa_msg')+' '+L(d)[0])}" target="_blank" rel="noopener"><span class="ib" style="background:${tint[i]};color:${tcol[i]}">${icon(d.ic)}</span><h3>${L(d)[0]}</h3><p>${L(d)[1]}</p><span class="more">${t('cta_trial_s')}${icon('arrow')}</span></a>`).join('');
 const pc=[['#fde6e7','#e30613'],['#f1f1f3','#bdbdc3'],['#fde6e7','#e30613'],['#f1f1f3','#bdbdc3'],['#fde6e7','#e30613'],['#f1f1f3','#bdbdc3']];
 $('coachg').innerHTML=coaches.map((c,i)=>`<div class="co rv"><div class="pic">${portrait(i,pc[i][0],pc[i][1],'#111113')}</div><div><h3>${c.n}</h3><div class="rl">${L(c)}</div><div class="meta"><span class="e">${c.exp} ${t('exp')}</span><span>${L(c.tag)}</span></div></div></div>`).join('');
 $('steps').innerHTML=[1,2,3].map(i=>`<div class="stp rv"><span class="n">${i}</span><h3>${t('step'+i+'_t')}</h3><p>${t('step'+i+'_d')}</p></div>`).join('');
 $('priceg').innerHTML=prices.map(p=>`<div class="pr rv ${p.hit?'hit':''}">${p.hit?`<span class="hb">★ ${t('popular')}</span>`:''}<h3>${L(p)[0]}</h3><div class="pp">${p.p}</div><div class="pu">${t('som')} ${L(p.u)}</div><ul>${L(p)[1].map(f=>`<li>${icon('check')}${f}</li>`).join('')}</ul><a class="btn ${p.hit?'btn-o':'btn-w'}" href="${J.waLink(t('wa_msg')+' '+L(p)[0]+' — '+p.p+' '+t('som'))}" target="_blank" rel="noopener">${t('price_cta')}</a></div>`).join('');
 $('pnote').innerHTML=t('prices_sub').replace(/^([^.]+\.)/,'<b>$1</b>');
 const today=J.bishkekNow().day;if(selDay===null)selDay=today;
 $('tbl').innerHTML=`<tr><th></th>${days[J.lang].map((d,i)=>`<th class="${i===today?'td':''}">${d}${i===today?' ●':''}</th>`).join('')}</tr>`+schedule.map(r=>`<tr><td><i style="background:${tint[r.d]};color:${tcol[r.d]}">${icon(dirs[r.d].ic)}</i>${L(dirs[r.d])[0]}</td>${r.t.map((x,i)=>`<td class="${i===today?'td':''}">${x?`<span class="tm" style="background:${tint[r.d]};color:${tcol[r.d]}">${x}</span>`:'<span class="dash">·</span>'}</td>`).join('')}</tr>`).join('');
 const dd=()=>{$('dtabs').innerHTML=days[J.lang].map((d,i)=>`<button class="${i===selDay?'on':''}" data-d="${i}">${d}</button>`).join('');
  const l=schedule.filter(r=>r.t[selDay]).sort((a,b)=>a.t[selDay].localeCompare(b.t[selDay]));
  $('dlist').innerHTML=l.length?l.map(r=>`<div><i style="background:${tint[r.d]};color:${tcol[r.d]}">${icon(dirs[r.d].ic)}</i><b>${L(dirs[r.d])[0]}</b><span>${r.t[selDay]}</span></div>`).join(''):`<div>${t('no_classes')}</div>`;};
 dd();$('dtabs').onclick=e=>{const b=e.target.closest('button');if(b){selDay=+b.dataset.d;dd();}};
 $('revg').innerHTML=`<div class="rsum rv"><div><b>4.9</b><div class="st">${icon('star').repeat(5)}</div><p>${t('reviews_sub')}</p></div><a class="btn" data-link="wa" href="${J.waLink()}" target="_blank" rel="noopener">${ib('wa',t('cta_trial_s'))}</a></div>`+
  reviews.map((r,i)=>`<div class="rvw rv"><div class="st">${icon('star').repeat(5)}</div><p>${L(r)}</p><div class="who"><span class="av" style="background:${tint[i]};color:${tcol[i]}">${r.n[0]}</span><div><b>${r.n}</b><small>${L(r.s)}</small></div></div></div>`).join('');
 $('cph').innerHTML=icon('phone')+J.C.phone;
 $('cinf').innerHTML=`<div>${icon('pin')}<div><small>${t('loc_addr_l')}</small><b>${t('loc_addr')}</b></div></div><div>${icon('clock')}<div><small>${t('loc_hours_l')}</small><b>${t('loc_hours')}</b></div></div><div>${icon('ig')}<div><small>Instagram</small><a href="${J.C.ig}" target="_blank" rel="noopener"><b>@jfc_gym.kg</b></a></div></div>`;
 $('cwa').innerHTML=ib('wa',t('cta_wa'));$('cgis').innerHTML=ib('pin',t('cta_route'));
 $('fdir').innerHTML=dirs.map(d=>`<option>${L(d)[0]}</option>`).join('');$('fsend').innerHTML=ib('wa',t('form_send'));
 $('gpin').innerHTML=icon('pin');
 document.querySelectorAll('.soc a').forEach((a,i)=>a.innerHTML=icon(['ig','wa','pin'][i]));
 $('fab').innerHTML=icon('wa');
 $('m1').innerHTML=ib('phone',t('cta_call'));$('m2').innerHTML=ib('wa','WhatsApp');$('m3').innerHTML=ib('pin','2ГИС');
};
})();
</script>
</body>
</html>
